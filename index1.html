      </div>
      <div class="step-list-rows" id="stepListRows">
        ${rowsHtml}
      </div>
    </div>
  `;
}

function selectStepFromList(stepId) {
  editor.selectedStepId = stepId;
  editor.rightTab = 'step';
  editor.scrollToStepId = stepId;
  render();
}

function updateStepFromList(stepId, key, val) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === stepId); if (!s) return;
  s[key] = val;
  p.updatedAt = nowISO();
  saveState();
  // Don't re-render the whole thing on text input — let it commit, just save.
  // But for lane / type changes (selects), re-render so the canvas updates.
  if (key !== 'title') render();
}

function stepDragStart(evt, stepId) {
  stepDrag.id = stepId;
  stepDrag.overId = null;
  evt.dataTransfer.effectAllowed = 'move';
  // Required for Firefox
  try { evt.dataTransfer.setData('text/plain', stepId); } catch (e) {}
  // Slight delay so the drag image captures the row before opacity drops
  setTimeout(() => {
    const el = document.querySelector(`[data-step-id="${stepId}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

function stepDragOver(evt, overId) {
  if (!stepDrag.id || stepDrag.id === overId) return;
  evt.preventDefault();
  evt.dataTransfer.dropEffect = 'move';
  // Determine if over the top half or bottom half of the row
  const row = evt.currentTarget;
  const rect = row.getBoundingClientRect();
  const before = (evt.clientY - rect.top) < rect.height / 2;
  // Only update DOM if changed
  if (stepDrag.overId !== overId || stepDrag.before !== before) {
    // Clear previous indicator
    document.querySelectorAll('.step-row.drop-before, .step-row.drop-after').forEach(r => {
      r.classList.remove('drop-before', 'drop-after');
    });
    row.classList.add(before ? 'drop-before' : 'drop-after');
    stepDrag.overId = overId;
    stepDrag.before = before;
  }
}

function stepDragLeave(evt) {
  // Clear indicator if we leave the row entirely (not just moving over a child)
  const row = evt.currentTarget;
  if (!row.contains(evt.relatedTarget)) {
    row.classList.remove('drop-before', 'drop-after');
  }
}

function stepDragDrop(evt, overId) {
  evt.preventDefault();
  if (!stepDrag.id || stepDrag.id === overId) {
    stepDragEnd(evt);
    return;
  }
  reorderStep(stepDrag.id, overId, stepDrag.before);
  stepDragEnd(evt);
}

function stepDragEnd(evt) {
  document.querySelectorAll('.step-row.drop-before, .step-row.drop-after, .step-row.dragging').forEach(r => {
    r.classList.remove('drop-before', 'drop-after', 'dragging');
  });
  stepDrag.id = null;
  stepDrag.overId = null;
  stepDrag.before = false;
}

function reorderStep(draggedId, anchorId, before) {
  const p = getCurrentProcess(); if (!p) return;

  // Build the current ordered list (same logic as renderStepList)
  const indexed = p.steps.map((s, i) => ({ s, i }));
  indexed.sort((a, b) => {
    const ca = a.s.column || 0;
    const cb = b.s.column || 0;
    if (ca !== cb) return ca - cb;
    return a.i - b.i;
  });
  const orderedIds = indexed.map(x => x.s.id);

  // Remove dragged from current position
  const currentIdx = orderedIds.indexOf(draggedId);
  if (currentIdx === -1) return;
  orderedIds.splice(currentIdx, 1);

  // Insert at new position
  let anchorIdx = orderedIds.indexOf(anchorId);
  if (anchorIdx === -1) {
    // Anchor not found — append at end
    orderedIds.push(draggedId);
  } else {
    if (!before) anchorIdx += 1;
    orderedIds.splice(anchorIdx, 0, draggedId);
  }

  // Reassign columns sequentially based on new order
  // Note: this linearizes any parallel-branch column arrangement — accepted tradeoff for v1
  orderedIds.forEach((id, idx) => {
    const step = p.steps.find(s => s.id === id);
    if (step) step.column = idx;
  });

  p.updatedAt = nowISO();
  saveState();
  toast('Steps reordered');
  render();
}

function updateProcessName(v) {
  const p = getCurrentProcess();
  if (!p) return;
  p.name = v;
  p.updatedAt = nowISO();
  saveState();
  // No re-render to avoid losing focus.
}

function toggleNotes() { editor.showNotes = !editor.showNotes; render(); }
function toggleRightPanel() { editor.rightCollapsed = !editor.rightCollapsed; render(); }
function toggleHideExceptions() { editor.hideExceptions = !editor.hideExceptions; render(); }
function toggleShowImpliedEdges() { editor.showImpliedEdges = !editor.showImpliedEdges; render(); }

// Auto-tidy: scans the process for (column, lane) collisions and bumps later
// steps to next-available columns. Called on demand from the toolbar.
function tidyLayout() {
  const p = getCurrentProcess(); if (!p) return;
  if (!confirm('Tidy layout? This will shift overlapping steps to free columns. Won\'t affect connections.')) return;
  // Iterate steps in their current (column, list-index) order and reassign
  // each one to the next-available cell in its lane.
  const sorted = p.steps.slice().sort((a, b) => {
    const ca = a.column || 0, cb = b.column || 0;
    if (ca !== cb) return ca - cb;
    return p.steps.indexOf(a) - p.steps.indexOf(b);
  });
  const occupied = {}; // laneId → Set of columns
  let bumped = 0;
  sorted.forEach(s => {
    if (!occupied[s.laneId]) occupied[s.laneId] = new Set();
    let col = s.column || 0;
    while (occupied[s.laneId].has(col)) {
      col += 1;
      bumped += 1;
    }
    if (col !== (s.column || 0)) {
      s.column = col;
    }
    occupied[s.laneId].add(col);
  });
  p.updatedAt = nowISO();
  saveState(); render();
  toast(bumped > 0 ? `Tidied ${bumped} overlapping step${bumped === 1 ? '' : 's'}` : 'Layout already clean');
}
function toggleCanvasFullscreen() {
  editor.canvasFullscreen = !editor.canvasFullscreen;
  // Try the browser's native Fullscreen API too (cleaner experience), but tolerate failure.
  // Some browsers/sandboxes block it. Our CSS-based fullscreen mode works regardless.
  if (editor.canvasFullscreen) {
    try {
      const el = document.documentElement;
      if (el && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    } catch (e) { /* native fullscreen not available — CSS-based fallback handles it */ }
  } else {
    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    } catch (e) {}
  }
  render();
}
function setRightTab(t) { editor.rightTab = t; render(); }

function selectStep(id) {
  editor.selectedStepId = id;
  editor.rightTab = 'step';
  render();
}

/* ==================================================================
   SVG RENDERER — swimlanes + steps + connections
   ================================================================== */

const LAYOUT = {
  laneLabelWidth: 64,
  laneHeight: 160,
  laneHeaderHeight: 0,
  columnWidth: 240,
  columnGap: 0,
  paddingTop: 24,
  paddingLeft: 24,
  paddingRight: 60,
  paddingBottom: 30,
  stepW: 180,
  stepH: 84,
  decisionW: 150,
  decisionH: 110,
  subTrackHeight: 80, // extra vertical space for the sub-process track when a lane has both regular and sub-process steps
};

function laneById(proc, id) { return proc.lanes.find(l => l.id === id); }

function laneIndex(proc, id) {
  return Math.max(0, proc.lanes.findIndex(l => l.id === id));
}

// === Dynamic lane sizing ===
// Lanes that contain both regular steps AND sub-process steps get visually expanded
// to give the sub-process track room to breathe below the main flow. This is the
// BPMN convention — call activities hang under the main process line as a separate
// track. Cached at the start of every renderSVG so all geometry queries are consistent.
let _laneSizesCache = null;

function computeLaneSizes(proc) {
  const heights = {};
  const tops = {};
  const hasSubTrack = {};
  let y = LAYOUT.paddingTop;
  proc.lanes.forEach(l => {
    const inLane = proc.steps.filter(s => s.laneId === l.id);
    const hasMain = inLane.some(s => s.shape !== 'subprocess');
    const hasSub  = inLane.some(s => s.shape === 'subprocess');
    const expand = hasMain && hasSub;
    hasSubTrack[l.id] = expand;
    heights[l.id] = LAYOUT.laneHeight + (expand ? LAYOUT.subTrackHeight : 0);
    tops[l.id] = y;
    y += heights[l.id];
  });
  return { heights, tops, hasSubTrack, total: y - LAYOUT.paddingTop };
}

function laneCenterY(proc, laneId) {
  // Main-flow center sits at laneTop + laneHeight/2 (in the upper portion when expanded)
  if (_laneSizesCache && _laneSizesCache.tops[laneId] !== undefined) {
    return _laneSizesCache.tops[laneId] + LAYOUT.laneHeight / 2;
  }
  // Fallback for callers before cache exists
  const idx = laneIndex(proc, laneId);
  return LAYOUT.paddingTop + idx * LAYOUT.laneHeight + LAYOUT.laneHeight / 2;
}

function colCenterX(col) {
  return LAYOUT.paddingLeft + LAYOUT.laneLabelWidth + col * LAYOUT.columnWidth + LAYOUT.columnWidth / 2;
}

function stepBox(s) {
  if (s.shape === 'decision') return { w: LAYOUT.decisionW, h: LAYOUT.decisionH };
  if (s.shape === 'subprocess') return { w: LAYOUT.stepW * 0.92, h: 56 }; // compact, sits in sub-track below main flow
  return { w: LAYOUT.stepW, h: LAYOUT.stepH };
}

// Cell-collision resolver. Returns a Map<stepId, yOffset>.
//
// Two responsibilities:
//   1. Sub-processes ALWAYS render in the lower sub-track of their lane (offset +52px from
//      lane center) so they read as annotations attached to the main flow rather than
//      inline equals to it. This is the BPMN-style "sub-process call activity" layout.
//   2. Multiple steps that would still collide after step 1 (e.g., two regular steps
//      sharing the same column+lane, or two sub-processes in the same column+lane)
//      get distributed vertically within their respective track so they don't stack.
//
// Purely render-time positioning — does not mutate data.
function computeCellOffsets(proc) {
  // Vertical separation between main flow center and sub-process track center.
  // Geometrically: main flow is centered at laneTop + laneHeight/2.
  // Sub-track is centered at laneTop + laneHeight + subTrackHeight/2.
  // Difference = laneHeight/2 + subTrackHeight/2.
  const SUB_TRACK_OFFSET = LAYOUT.laneHeight / 2 + LAYOUT.subTrackHeight / 2;
  const cells = {}; // key: "col|laneId" → array of step objects
  proc.steps.forEach(s => {
    const key = (s.column || 0) + '|' + s.laneId;
    if (!cells[key]) cells[key] = [];
    cells[key].push(s);
  });
  const offsets = {};
  // Helper: distribute a list of steps around a base Y offset
  const distribute = (steps, baseOffset) => {
    if (steps.length === 0) return;
    if (steps.length === 1) {
      offsets[steps[0].id] = baseOffset;
      return;
    }
    const slot = Math.min(LAYOUT.laneHeight / (steps.length + 1), 70);
    steps.forEach((s, i) => {
      offsets[s.id] = baseOffset + (i - (steps.length - 1) / 2) * slot;
    });
  };
  Object.values(cells).forEach(stepsInCell => {
    // Split into main-flow shapes and sub-process shapes
    const mains = stepsInCell.filter(s => s.shape !== 'subprocess');
    const subs  = stepsInCell.filter(s => s.shape === 'subprocess');
    // If the lane has only sub-processes (no mains anywhere in lane), treat them as
    // main flow — no need to push them down. Look at the broader lane, not just cell.
    const laneId = stepsInCell[0].laneId;
    const laneHasMain = proc.steps.some(s => s.laneId === laneId && s.shape !== 'subprocess');
    distribute(mains, 0);
    distribute(subs, laneHasMain ? SUB_TRACK_OFFSET : 0);
  });
  return offsets;
}

let _cellOffsetsCache = {};

function stepCenter(proc, s) {
  const offset = (_cellOffsetsCache && _cellOffsetsCache[s.id]) || 0;
  return { x: colCenterX(s.column), y: laneCenterY(proc, s.laneId) + offset };
}

function renderSVG(proc) {
  if (proc.steps.length === 0) return '';

  // Compute lane sizes first (some lanes expand to accommodate a sub-process track)
  _laneSizesCache = computeLaneSizes(proc);

  // Compute cell-collision offsets so steps sharing the same (column, lane) cell
  // get staggered vertically instead of rendering on top of each other.
  _cellOffsetsCache = computeCellOffsets(proc);

  // Compute which edges are "transitively redundant" — implied by other paths in
  // the graph. Hidden by default; toggleable via the toolbar.
  _redundantEdgesCache = detectRedundantEdges(proc);

  // Filter visible
  let visible = editor.filterLaneId
    ? proc.steps.filter(s => s.laneId === editor.filterLaneId)
    : proc.steps.slice();
  if (editor.hideExceptions) {
    visible = visible.filter(s => s.type !== 'exception');
  }
  const visibleIds = new Set(visible.map(s => s.id));

  // Compute SVG canvas size — total height now accounts for expanded lanes
  const maxCol = Math.max(0, ...proc.steps.map(s => s.column || 0));
  const width = LAYOUT.paddingLeft + LAYOUT.laneLabelWidth + (maxCol + 1) * LAYOUT.columnWidth + LAYOUT.paddingRight;
  const height = LAYOUT.paddingTop + _laneSizesCache.total + LAYOUT.paddingBottom;

  // Lane backgrounds (split into bands and sticky labels for horizontal-scroll pinning).
  // For lanes that have a sub-track, we render the main band and an additional sub-track
  // band beneath it with a subtle visual distinction, plus a divider line between them.
  let laneBandsSvg = '';
  let laneLabelsSvg = '';
  proc.lanes.forEach((l, i) => {
    const top = _laneSizesCache.tops[l.id];
    const totalH = _laneSizesCache.heights[l.id];
    const bandColor = i % 2 === 0 ? '#fbf8f1' : '#f6f1e5';
    const bandX = LAYOUT.paddingLeft + LAYOUT.laneLabelWidth;
    const bandW = width - LAYOUT.paddingLeft - LAYOUT.laneLabelWidth - LAYOUT.paddingRight;

    if (_laneSizesCache.hasSubTrack[l.id]) {
      // Two-zone lane: main flow band on top, sub-track band underneath with a slightly
      // darker/different tint so the BPMN sub-process layout reads visually.
      const mainH = LAYOUT.laneHeight;
      const subH = LAYOUT.subTrackHeight;
      const subBandColor = i % 2 === 0 ? '#f5f0e0' : '#efe9d6';
      laneBandsSvg += `
        <rect x="${bandX}" y="${top}" width="${bandW}" height="${mainH}" fill="${bandColor}" stroke="#e6dfce" stroke-width="0.5" />
        <rect x="${bandX}" y="${top + mainH}" width="${bandW}" height="${subH}" fill="${subBandColor}" stroke="#e6dfce" stroke-width="0.5" />
        <line x1="${bandX}" y1="${top + mainH}" x2="${bandX + bandW}" y2="${top + mainH}" stroke="#cdc4ad" stroke-width="0.75" stroke-dasharray="3 3" />
        <text x="${bandX + 10}" y="${top + mainH + 14}" font-family="IBM Plex Mono, monospace" font-size="9" fill="#a89e80" letter-spacing="0.06em" text-transform="uppercase">SUB-PROCESS TRACK</text>
      `;
      laneLabelsSvg += `
        <rect x="${LAYOUT.paddingLeft}" y="${top}" width="${LAYOUT.laneLabelWidth}" height="${totalH}" fill="${l.color}" />
        <text class="lane-label-text" transform="translate(${LAYOUT.paddingLeft + LAYOUT.laneLabelWidth/2}, ${top + totalH/2}) rotate(-90)" text-anchor="middle" dominant-baseline="middle">${escapeHtml(l.name)}</text>
      `;
    } else {
      // Standard single-zone lane
      laneBandsSvg += `
        <rect x="${bandX}" y="${top}" width="${bandW}" height="${totalH}" fill="${bandColor}" stroke="#e6dfce" stroke-width="0.5" />
      `;
      laneLabelsSvg += `
        <rect x="${LAYOUT.paddingLeft}" y="${top}" width="${LAYOUT.laneLabelWidth}" height="${totalH}" fill="${l.color}" />
        <text class="lane-label-text" transform="translate(${LAYOUT.paddingLeft + LAYOUT.laneLabelWidth/2}, ${top + totalH/2}) rotate(-90)" text-anchor="middle" dominant-baseline="middle">${escapeHtml(l.name)}</text>
      `;
    }
  });
  // Compute total height of lane label group for the right-edge shadow
  const laneLabelTotalHeight = _laneSizesCache.total;
  const laneLabelShadowX = LAYOUT.paddingLeft + LAYOUT.laneLabelWidth;
  // Lane label edge shadow (subtle gradient on right side, only visible when scrolled)
  laneLabelsSvg += `
    <rect id="laneLabelShadow" x="${laneLabelShadowX}" y="${LAYOUT.paddingTop}" width="6" height="${laneLabelTotalHeight}" fill="url(#laneLabelEdgeGradient)" opacity="0" />
  `;

  // Build connections first (so they sit under the steps)
  // Precompute fan-out (multiple connections leaving same step) and fan-in (multiple
  // connections arriving at same step), plus categorize by direction. This is what
  // lets us stagger exit/entry points for steps with 3+ branches (e.g. a decision
  // with Yes/No/Timeout) so connections don't pile on top of each other.
  const fanInfo = computeConnectionFan(proc, visibleIds);

  let connsSvg = '';
  proc.steps.forEach(from => {
    if (!from.connections) return;
    from.connections.forEach((c, ci) => {
      const to = proc.steps.find(s => s.id === c.toId);
      if (!to) return;
      // Hide if either end isn't in the visible set
      if (!visibleIds.has(from.id) || !visibleIds.has(to.id)) return;
      // Hide if neither end is visible (lane filter)
      if (editor.filterLaneId && from.laneId !== editor.filterLaneId && to.laneId !== editor.filterLaneId) return;
      // Hide if redundant (transitive shortcut) and global override is off
      const edgeKey = from.id + '|' + c.toId + '|' + ci;
      const isRedundant = _redundantEdgesCache.has(edgeKey);
      if (isRedundant && !editor.showImpliedEdges) return;
      const meta = fanInfo[edgeKey] || {};
      // When edges are forced visible via the toggle, render redundant ones with reduced opacity
      // so the user can see at a glance which edges the graph would normally hide.
      const isImpliedShown = isRedundant && editor.showImpliedEdges;
      connsSvg += renderConnection(proc, from, to, c.label, meta, { faded: isImpliedShown });
    });
  });

  // Render steps
  let stepsSvg = '';
  visible.forEach(s => {
    stepsSvg += renderStep(proc, s);
  });

  // Notes callouts
  let notesSvg = '';
  if (editor.showNotes) {
    visible.forEach(s => {
      if (s.notes && s.notes.trim()) {
        notesSvg += renderNoteCallout(proc, s);
      }
    });
  }

  return `
    <svg id="processSVG" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" style="display:block;">
      <defs>
        <marker id="arrow-happy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2d6a4f" />
        </marker>
        <marker id="arrow-exc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9d2d2d" />
        </marker>
        <marker id="arrow-handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b7889" />
        </marker>
        <style>
          .lane-label-text { font-family: "IBM Plex Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #f8f4ec; letter-spacing: 0.04em; }
          .step-title-text { font-family: "IBM Plex Sans", sans-serif; font-size: 13px; font-weight: 600; fill: #0d1b2a; }
          .step-desc-text { font-family: "IBM Plex Sans", sans-serif; font-size: 11px; fill: #6b7889; }
          .step-system-text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: #2a3a4d; letter-spacing: 0.02em; }
          .conn-label-text { font-family: "IBM Plex Sans", sans-serif; font-size: 10px; fill: #2a3a4d; }
          .conn-label-bg { fill: #ffffff; stroke: #e6dfce; }
          .note-text { font-family: "IBM Plex Sans", sans-serif; font-size: 10px; fill: #2a3a4d; }
          .note-shape { fill: #fff8d8; stroke: #d6c97c; }
          .step-shape { fill: #fbfdfb; stroke: #d6cdb8; }
          .step-shape-exc { fill: #fdf6f4; stroke: #d6a89e; }
          .opt-flag { fill: #d68a1f; }
          text { dominant-baseline: middle; }
        </style>
        <linearGradient id="laneLabelEdgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#000" stop-opacity="0" />
        </linearGradient>
      </defs>
      ${laneBandsSvg}
      ${connsSvg}
      ${stepsSvg}
      ${notesSvg}
      <g id="laneLabelsGroup">${laneLabelsSvg}</g>
    </svg>
  `;
}

function renderStep(proc, s) {
  const { x, y } = stepCenter(proc, s);
  const { w, h } = stepBox(s);
  const lane = laneById(proc, s.laneId);
  const laneColor = lane ? lane.color : '#4a5e7a';
  const isDecision = s.shape === 'decision';
  const isSubproc = s.shape === 'subprocess';
  const isStart = s.shape === 'start';
  const isEnd = s.shape === 'end';
  const isExc = s.type === 'exception';
  const isSelected = editor.selectedStepId === s.id;

  const cornerColor = isExc ? '#9d2d2d' : '#2d6a4f';
  const tintBg = isSubproc ? '#f3f0e3'
                : isStart ? '#f0f7f3'
                : isEnd   ? (isExc ? '#fbeae7' : '#eef5f0')
                : (isExc ? '#faf0ef' : '#fbfdfb');
  const stroke = isSelected ? cornerColor : (isSubproc ? '#a89e80' : (isStart || isEnd) ? cornerColor : '#d6cdb8');
  const strokeWidth = isSubproc ? 2 : 1.5;

  // For decisions, narrower wrap; for steps, wider; for start/end, narrower; subprocess: compact 1-line title
  const titleMaxChars = isDecision ? 18 : (isStart || isEnd) ? 18 : isSubproc ? 22 : 24;
  const descMaxChars = isDecision ? 20 : (isStart || isEnd) ? 22 : isSubproc ? 22 : 28;
  const titleLines = wrapText(s.title, titleMaxChars).slice(0, isSubproc ? 1 : 2);
  const descLinesAll = wrapText(s.description, descMaxChars);
  const maxDescLines = isDecision ? (titleLines.length > 1 ? 0 : 1)
                     : (isStart || isEnd) ? (titleLines.length > 1 ? 0 : 1)
                     : isSubproc ? 1
                     : 2;
  const descLines = descLinesAll.slice(0, maxDescLines);

  const lineH = 14;
  const descLineH = 13;
  const padTop = isDecision ? (titleLines.length === 1 ? 18 : 8) : isSubproc ? 12 : 18;
  const titleSize = isDecision ? 12 : isSubproc ? 12 : 13;

  const blockTop = y - h/2 + padTop;
  let cursor = blockTop;
  const titleYs = titleLines.map((_, i) => cursor + i * lineH + 10);
  cursor += titleLines.length * lineH + 4;
  const descYs = descLines.map((_, i) => cursor + i * descLineH + 8);

  let shape;
  if (isDecision) {
    const points = [
      [x, y - h/2], [x + w/2, y], [x, y + h/2], [x - w/2, y]
    ].map(p => p.join(',')).join(' ');
    shape = `<polygon class="step-shape" points="${points}" fill="${tintBg}" stroke="${stroke}" stroke-width="${isSelected ? 2.25 : 1.5}" />`;
  } else if (isSubproc) {
    // BPMN subprocess marker: rectangle with double vertical bars at bottom-right.
    // Unlinked subprocesses get a dashed stroke + muted treatment so they read as a stub.
    const isUnlinked = !s.linkedProcessId;
    const subStroke = isUnlinked ? '#a89e80' : stroke;
    const subDash = isUnlinked ? 'stroke-dasharray="6 4"' : '';
    const barFill = isUnlinked ? '#a89e80' : '#4a5e7a';
    shape = `
      <rect class="step-shape" x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="6" ry="6" fill="${tintBg}" stroke="${subStroke}" stroke-width="${strokeWidth}" ${subDash} />
      <rect x="${x - w/2}" y="${y - h/2}" width="4" height="${h}" fill="${cornerColor}" />
      <rect x="${x - w/2 + 4}" y="${y - h/2}" width="${w - 4}" height="3" fill="${laneColor}" opacity="0.55" />
      <rect x="${x + w/2 - 16}" y="${y + h/2 - 14}" width="3" height="9" fill="${barFill}" />
      <rect x="${x + w/2 - 11}" y="${y + h/2 - 14}" width="3" height="9" fill="${barFill}" />
    `;
  } else if (isStart) {
    // BPMN start node: pill-shaped (high border-radius), single thin border, accent stripe
    const r = h / 2; // pill radius = half height
    shape = `
      <rect class="step-shape" x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${r}" ry="${r}" fill="${tintBg}" stroke="${stroke}" stroke-width="${isSelected ? 2.25 : 1.5}" />
      <path d="M ${x - w/2 + 6} ${y - h/2} A ${r - 6} ${r - 6} 0 0 0 ${x - w/2 + 6} ${y + h/2} Z" fill="${cornerColor}" opacity="0.85" />
    `;
  } else if (isEnd) {
    // BPMN end node: double pill — outer + inner concentric pills with a small gap
    // Stroke color follows happy/exception type so green/red still signals meaning
    const r = h / 2;
    const innerInset = 5;
    const innerR = (h - 2 * innerInset) / 2;
    shape = `
      <rect class="step-shape" x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="${r}" ry="${r}" fill="${tintBg}" stroke="${stroke}" stroke-width="${isSelected ? 2.25 : 1.5}" />
      <rect x="${x - w/2 + innerInset}" y="${y - h/2 + innerInset}" width="${w - 2*innerInset}" height="${h - 2*innerInset}" rx="${innerR}" ry="${innerR}" fill="none" stroke="${cornerColor}" stroke-width="1.75" />
    `;
  } else {
    shape = `
      <rect class="step-shape" x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="6" ry="6" fill="${tintBg}" stroke="${stroke}" stroke-width="${isSelected ? 2.25 : 1.5}" />
      <rect x="${x - w/2}" y="${y - h/2}" width="4" height="${h}" fill="${cornerColor}" />
      <rect x="${x - w/2 + 4}" y="${y - h/2}" width="${w - 4}" height="3" fill="${laneColor}" opacity="0.55" />
    `;
  }

  const titleSvg = titleLines.map((line, i) =>
    `<text class="step-title-text" x="${x}" y="${titleYs[i]}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="${titleSize}" font-weight="600" fill="#0d1b2a">${escapeHtml(line)}</text>`
  ).join('');

  const descSvg = descLines.map((line, i) =>
    `<text class="step-desc-text" x="${x}" y="${descYs[i]}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#6b7889">${escapeHtml(line)}</text>`
  ).join('');

  const sysLabel = (s.system && !isDecision && !isSubproc && !isStart && !isEnd) ?
    `<g>
      <line x1="${x - w/2 + 10}" y1="${y + h/2 - 18}" x2="${x + w/2 - 10}" y2="${y + h/2 - 18}" stroke="#e6dfce" stroke-width="0.5" />
      <text class="step-system-text" x="${x - w/2 + 10}" y="${y + h/2 - 7}" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10" fill="#2a3a4d" letter-spacing="0.04">${escapeHtml(s.system)}</text>
    </g>` : '';

  const sysLabelDecision = (s.system && isDecision) ?
    `<text x="${x}" y="${y + h/2 + 14}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6b7889">${escapeHtml(s.system)}</text>` : '';

  const badgePos = isDecision
    ? { cx: x + w/2 - 4, cy: y - h/4 + 4 }
    : { cx: x + w/2 - 11, cy: y - h/2 + 11 };
  const optBadge = s.optimizable ? `
    <g class="opt-flag">
      <circle cx="${badgePos.cx}" cy="${badgePos.cy}" r="8" fill="#c9961f" stroke="#fff" stroke-width="1.5" />
      <text x="${badgePos.cx}" y="${badgePos.cy + 0.5}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="700" fill="#fff">!</text>
    </g>
  ` : '';

  // Variance badge — small chip showing how many locations deviate from canonical
  const numLocsAffected = (s.variances || []).reduce((n, v) => n + (v.locationIds || []).length, 0);
  const variancePos = isDecision
    ? { cx: x + w/2 - 4, cy: y + h/4 - 4 }
    : { cx: x + w/2 - 11, cy: y + h/2 - 11 };
  const varianceBadge = (s.variances && s.variances.length > 0) ? `
    <g class="variance-flag" title="${s.variances.length} variance${s.variances.length === 1 ? '' : 's'}, ${numLocsAffected} location${numLocsAffected === 1 ? '' : 's'} affected">
      <circle cx="${variancePos.cx}" cy="${variancePos.cy}" r="8" fill="#9d2d2d" stroke="#fff" stroke-width="1.5" />
      <text x="${variancePos.cx}" y="${variancePos.cy + 0.5}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif" font-size="9" font-weight="700" fill="#fff">±${numLocsAffected}</text>
    </g>
  ` : '';

  const onClickHandler = (isSubproc && s.linkedProcessId)
    ? `event.stopPropagation(); openLinkedProcess('${s.linkedProcessId}', event)`
    : `selectStep('${s.id}')`;

  return `
    <g class="step-group ${isSelected ? 'selected' : ''}" onclick="${onClickHandler}" style="${isSubproc && s.linkedProcessId ? 'cursor: pointer;' : ''}">
      ${shape}
      ${titleSvg}
      ${descSvg}
      ${sysLabel}
      ${sysLabelDecision}
      ${optBadge}
      ${varianceBadge}
    </g>
  `;
}

function openLinkedProcess(processId, evt) {
  // If shift-click, just select the step (allow editing). Otherwise navigate.
  if (evt && evt.shiftKey) {
    // Find the step that has this linkedProcessId in current process
    const proc = getCurrentProcess();
    if (proc) {
      const s = proc.steps.find(x => x.linkedProcessId === processId);
      if (s) selectStep(s.id);
    }
    return;
  }
  const found = findProcessAnywhere(processId);
  if (found) navigate('process', { teamId: found.team.id, processId: found.process.id });
  else toast('Linked process not found');
}

// Compute fan-out / fan-in metadata for each connection so renderConnection can
// stagger exit/entry points when multiple connections share an endpoint.
//
// Returns a map keyed by "fromId|toId|connIndex" with:
//   exitDir:    'right' | 'down' | 'up'   (which side of the FROM step the line leaves)
//   exitOrder:  index among siblings exiting the same direction
//   exitTotal:  total siblings exiting the same direction
//   entryDir:   'left' | 'down' | 'up' | 'right'  (which side of the TO step the line enters)
//   entryOrder: index among siblings entering the same direction
//   entryTotal: total siblings entering the same direction
//
// The directions for FROM are picked the same way the existing renderConnection logic
// picks them, but ALL connections from a step are categorized first so we know
// totals before assigning offsets.
// Detect edges that are "transitively redundant" — connections where the destination
// is already reachable from the source through other paths. The classic case is a
// decision-then-rejoin pattern: A → B → C and A → C both exist; the direct A → C
// edge is implied by the longer A → B → C path.
//
// Per-edge override (c.display): 'auto' (default) | 'show' | 'hide'.
//   'show'  → never marked redundant, always renders
//   'hide'  → always marked redundant, never renders
//   'auto'  → mark redundant if a graph alternative exists
//
// Result: Set of edge keys ("fromId|toId|connIndex") that should be hidden when
// the global "Show implied" toggle is off.
function detectRedundantEdges(proc) {
  // Index steps by ID for column lookups
  const stepsById = {};
  proc.steps.forEach(s => { stepsById[s.id] = s; });

  // Build edge-aware adjacency: nodeId → array of {to, edgeKey, isBackward}.
  // Backward edges (target column < source column) are flagged so the BFS can
  // skip them — loop-back edges represent rework cycles, not "alternative forward
  // paths." Without this, a loop creates spurious cycles that make legitimate
  // forward edges look redundant.
  const adj = {};
  proc.steps.forEach(from => {
    adj[from.id] = (from.connections || []).map((c, ci) => {
      const target = stepsById[c.toId];
      return {
        to: c.toId,
        edgeKey: from.id + '|' + c.toId + '|' + ci,
        isBackward: target && (target.column || 0) < (from.column || 0)
      };
    });
  });

  const redundant = new Set();

  proc.steps.forEach(from => {
    (from.connections || []).forEach((c, ci) => {
      const u = from.id;
      const v = c.toId;
      const edgeKey = u + '|' + v + '|' + ci;
      const display = c.display || 'auto';

      if (display === 'show') return;
      if (display === 'hide') { redundant.add(edgeKey); return; }
      if (u === v) return;             // self-loop — leave alone
      if (!adj[v]) return;             // dangling target

      // Backward edges (loops) are never auto-flagged redundant — their semantics
      // are "go back and retry," which by definition isn't an alternative forward path.
      const targetStep = stepsById[v];
      const thisIsBackward = targetStep && (targetStep.column || 0) < (from.column || 0);
      if (thisIsBackward) return;

      // BFS from u, excluding only this specific edge instance AND skipping all
      // backward edges (so loops don't create spurious "alternative path" cycles).
      const visited = new Set([u]);
      const queue = [u];
      let foundV = false;
      while (queue.length > 0 && !foundV) {
        const cur = queue.shift();
        const edges = adj[cur] || [];
        for (const e of edges) {
          if (e.edgeKey === edgeKey) continue;
          if (e.isBackward) continue;
          if (e.to === v) { foundV = true; break; }
          if (!visited.has(e.to)) {
            visited.add(e.to);
            queue.push(e.to);
          }
        }
      }
      if (foundV) redundant.add(edgeKey);
    });
  });

  return redundant;
}

let _redundantEdgesCache = new Set();

function computeConnectionFan(proc, visibleIds) {
  const out = {};
  // Helper: classify direction from FROM step to TO step
  const classifyExit = (from, to) => {
    const fc = stepCenter(proc, from);
    const tc = stepCenter(proc, to);
    if (from.shape === 'decision') {
      if (from.laneId === to.laneId || tc.y === fc.y) return 'right';
      if (tc.y > fc.y) return 'down';
      return 'up';
    }
    // Non-decision: usually exits right; if target is in same column, exits down/up
    if (Math.abs(tc.x - fc.x) < 4) {
      return tc.y > fc.y ? 'down' : 'up';
    }
    return 'right';
  };
  const classifyEntry = (from, to) => {
    const fc = stepCenter(proc, from);
    const tc = stepCenter(proc, to);
    if (Math.abs(tc.x - fc.x) < 4) {
      return tc.y > fc.y ? 'up' : 'down'; // entering from above (up edge) or below (down edge)
    }
    if (tc.x > fc.x) return 'left';
    return 'right';
  };

  // First pass: collect all visible connections with their classification
  const conns = [];
  proc.steps.forEach(from => {
    if (!from.connections) return;
    from.connections.forEach((c, ci) => {
      const to = proc.steps.find(s => s.id === c.toId);
      if (!to) return;
      if (!visibleIds.has(from.id) || !visibleIds.has(to.id)) return;
      conns.push({
        key: from.id + '|' + c.toId + '|' + ci,
        from, to, c, ci,
        exitDir: classifyExit(from, to),
        entryDir: classifyEntry(from, to),
      });
    });
  });

  // Second pass: bucket by (fromId, exitDir) and (toId, entryDir) to count siblings
  const exitBuckets = {};
  const entryBuckets = {};
  conns.forEach(cc => {
    const eKey = cc.from.id + '|' + cc.exitDir;
    if (!exitBuckets[eKey]) exitBuckets[eKey] = [];
    exitBuckets[eKey].push(cc);
    const inKey = cc.to.id + '|' + cc.entryDir;
    if (!entryBuckets[inKey]) entryBuckets[inKey] = [];
    entryBuckets[inKey].push(cc);
  });

  // Third pass: assign order/total for each connection
  conns.forEach(cc => {
    const eKey = cc.from.id + '|' + cc.exitDir;
    const eBucket = exitBuckets[eKey];
    const inKey = cc.to.id + '|' + cc.entryDir;
    const inBucket = entryBuckets[inKey];
    out[cc.key] = {
      exitDir: cc.exitDir,
      exitOrder: eBucket.indexOf(cc),
      exitTotal: eBucket.length,
      entryDir: cc.entryDir,
      entryOrder: inBucket.indexOf(cc),
      entryTotal: inBucket.length,
    };
  });

  return out;
}

// Render a backward edge — loops/rework/retry connections where the target is to
// the LEFT of the source. Routes the line OUT the top of the source, OVER the top
// of all the swimlanes, and DOWN into the target. Visually distinct from forward
// flow so loops are immediately recognizable as loops.
function renderBackwardConnection(proc, from, to, label, opts) {
  const fc = stepCenter(proc, from);
  const tc = stepCenter(proc, to);
  const fb = stepBox(from);
  const tb = stepBox(to);

  // Exit from the top of the source, enter from the top of the target
  const x1 = fc.x;
  const y1 = fc.y - fb.h / 2;
  const x2 = tc.x;
  const y2 = tc.y - tb.h / 2;

  // Arc travels above the topmost lane band. Use a Y above paddingTop with a
  // small clearance. Don't go above 6px (need room for label text without
  // clipping the SVG top edge).
  const arcY = Math.max(6, LAYOUT.paddingTop - 14);

  // Orthogonal path: up from source, across at arcY, down into target
  const path = `M ${x1} ${y1} L ${x1} ${arcY} L ${x2} ${arcY} L ${x2} ${y2}`;

  // Color & marker — same logic as forward edges so loops still encode meaning
  // (handoff vs main vs exception). Loops within same lane still get the green
  // "main flow" color; cross-lane loops get the gray handoff color.
  const isHandoff = from.laneId !== to.laneId;
  const isExc = from.type === 'exception' || to.type === 'exception';
  const stroke = isExc ? '#9d2d2d' : (isHandoff ? '#6b7889' : '#2d6a4f');
  const dashAttr = isHandoff ? 'stroke-dasharray="6 4"' : '';
  const marker = isExc ? 'url(#arrow-exc)' : (isHandoff ? 'url(#arrow-handoff)' : 'url(#arrow-happy)');

  // Label sits on the horizontal arc segment, slightly above arcY so the loop
  // indicator badge can sit beside it without overlap.
  let labelSvg = '';
  if (label && label.trim()) {
    const MAX_LABEL_CHARS = 22;
    const labelTrimmed = label.length > MAX_LABEL_CHARS
      ? label.slice(0, MAX_LABEL_CHARS - 1).trim() + '…'
      : label;
    const lx = (x1 + x2) / 2;
    const ly = arcY;
    const labelW = labelTrimmed.length * 6 + 12;
    const tooltipAttr = labelTrimmed !== label ? `<title>${escapeHtml(label)}</title>` : '';
    labelSvg = `
      ${tooltipAttr}
      <rect class="conn-label-bg" x="${lx - labelW/2}" y="${ly - 9}" width="${labelW}" height="16" rx="3" />
      <text class="conn-label-text" x="${lx}" y="${ly + 1}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(labelTrimmed)}</text>
    `;
  }

  // Loop indicator — small ↩ glyph near the source-side ascending segment
  // so the reader instantly recognizes "this is a loop, not normal flow".
  const loopBadgeY = arcY + (y1 - arcY) / 2;
  const loopBadge = `
    <text x="${x1 + 8}" y="${loopBadgeY}" font-family="IBM Plex Mono, monospace" font-size="11" fill="${stroke}" dominant-baseline="middle">↩</text>
  `;

  const opacity = (opts && opts.faded) ? '0.35' : '1';
  return `
    <g class="conn-group conn-backward" opacity="${opacity}">
      <path d="${path}" fill="none" stroke="${stroke}" stroke-width="1.6" ${dashAttr} marker-end="${marker}" />
      ${loopBadge}
      ${labelSvg}
    </g>
  `;
}

function renderConnection(proc, from, to, label, meta, opts) {
  const fc = stepCenter(proc, from);
  const tc = stepCenter(proc, to);
  const fb = stepBox(from);
  const tb = stepBox(to);

  // Default fan metadata if none provided (single connection — no staggering needed)
  const m = meta || { exitDir: null, exitOrder: 0, exitTotal: 1, entryDir: null, entryOrder: 0, entryTotal: 1 };

  // === Backward edge detection ===
  // If the target is significantly to the LEFT of the source, this is a loop-back
  // edge (rework, retry, etc.). These need a different routing — instead of trying
  // to route through the middle of the diagram (which crashes into intermediate
  // steps), arc the line OVER the top of the swimlanes. This is the standard
  // workflow-tool convention for representing loops.
  const isBackward = tc.x < fc.x - LAYOUT.columnWidth / 2;

  if (isBackward) {
    return renderBackwardConnection(proc, from, to, label, opts);
  }

  // Helper: compute the stagger offset for an index out of N siblings, distributed
  // around the center. Returns a value in [-1, 1] roughly. For 1 sibling = 0;
  // for 2 = -0.5/+0.5; for 3 = -1/0/+1; etc.
  const staggerOffset = (idx, total) => {
    if (total <= 1) return 0;
    return (idx - (total - 1) / 2) / Math.max(1, (total - 1) / 2);
  };

  // === Exit point ===
  let x1, y1;
  const sameRow = from.laneId === to.laneId;

  if (from.shape === 'decision') {
    // Decision diamond: exits depend on direction. The diamond's edge runs from
    // center-side to corner. We can stagger exit points along that edge.
    const exitDir = m.exitDir || (sameRow || tc.y === fc.y ? 'right' : (tc.y > fc.y ? 'down' : 'up'));
    if (exitDir === 'right') {
      // Exit on the right corner. If multiple siblings exit right, stagger along the
      // diamond's slanted right edge — top-right edge for upper siblings, bottom-right edge
      // for lower siblings.
      if (m.exitTotal <= 1) {
        x1 = fc.x + fb.w / 2; y1 = fc.y;
      } else {
        const off = staggerOffset(m.exitOrder, m.exitTotal); // -1..+1
        // Walk along the diamond edge from the right corner toward top or bottom
        x1 = fc.x + fb.w / 2 - Math.abs(off) * (fb.w / 4);
        y1 = fc.y + off * (fb.h / 4);
      }
    } else if (exitDir === 'down') {
      // Exit on the bottom corner — stagger along bottom edges of diamond
      if (m.exitTotal <= 1) {
        x1 = fc.x; y1 = fc.y + fb.h / 2;
      } else {
        const off = staggerOffset(m.exitOrder, m.exitTotal);
        x1 = fc.x + off * (fb.w / 4);
        y1 = fc.y + fb.h / 2 - Math.abs(off) * (fb.h / 4);
      }
    } else { // up
      if (m.exitTotal <= 1) {
        x1 = fc.x; y1 = fc.y - fb.h / 2;
      } else {
        const off = staggerOffset(m.exitOrder, m.exitTotal);
        x1 = fc.x + off * (fb.w / 4);
        y1 = fc.y - fb.h / 2 + Math.abs(off) * (fb.h / 4);
      }
    }
  } else {
    // Non-decision: exit right edge, staggered vertically if multiple siblings
    if (m.exitDir === 'down' || (m.exitDir == null && Math.abs(tc.x - fc.x) < 4 && tc.y > fc.y)) {
      x1 = fc.x + (m.exitTotal > 1 ? staggerOffset(m.exitOrder, m.exitTotal) * (fb.w / 3) : 0);
      y1 = fc.y + fb.h / 2;
    } else if (m.exitDir === 'up' || (m.exitDir == null && Math.abs(tc.x - fc.x) < 4 && tc.y <= fc.y)) {
      x1 = fc.x + (m.exitTotal > 1 ? staggerOffset(m.exitOrder, m.exitTotal) * (fb.w / 3) : 0);
      y1 = fc.y - fb.h / 2;
    } else {
      // Right
      x1 = fc.x + fb.w / 2;
      // Stagger Y when multiple siblings exit right
      y1 = fc.y + (m.exitTotal > 1 ? staggerOffset(m.exitOrder, m.exitTotal) * (fb.h / 3.2) : 0);
    }
  }

  // === Entry point ===
  let x2, y2;
  if (m.entryDir === 'up' || (m.entryDir == null && Math.abs(tc.x - fc.x) < 4 && tc.y > fc.y)) {
    // Enters from above (the up edge / top of step)
    x2 = tc.x + (m.entryTotal > 1 ? staggerOffset(m.entryOrder, m.entryTotal) * (tb.w / 3) : 0);
    y2 = tc.y - tb.h / 2;
  } else if (m.entryDir === 'down' || (m.entryDir == null && Math.abs(tc.x - fc.x) < 4 && tc.y < fc.y)) {
    // Enters from below
    x2 = tc.x + (m.entryTotal > 1 ? staggerOffset(m.entryOrder, m.entryTotal) * (tb.w / 3) : 0);
    y2 = tc.y + tb.h / 2;
  } else if (m.entryDir === 'right') {
    // Enters from the right edge (rare — happens when target is to the left of source)
    x2 = tc.x + tb.w / 2;
    y2 = tc.y + (m.entryTotal > 1 ? staggerOffset(m.entryOrder, m.entryTotal) * (tb.h / 3.2) : 0);
  } else {
    // Enters from the left (default for forward flow). Stagger Y if multiple inbound.
    x2 = tc.x - tb.w / 2;
    y2 = tc.y + (m.entryTotal > 1 ? staggerOffset(m.entryOrder, m.entryTotal) * (tb.h / 3.2) : 0);
  }

  // === Color & marker ===
  const isHandoff = from.laneId !== to.laneId;
  const isExc = from.type === 'exception' || to.type === 'exception';
  const stroke = isExc ? '#9d2d2d' : (isHandoff ? '#6b7889' : '#2d6a4f');
  const dashAttr = isHandoff ? 'stroke-dasharray="6 4"' : '';
  const marker = isExc ? 'url(#arrow-exc)' : (isHandoff ? 'url(#arrow-handoff)' : 'url(#arrow-happy)');

  // === Path: orthogonal, with mid-X offset for fan-out so parallel lines don't overlap ===
  // When multiple connections share the same exit direction, they would all turn at
  // the same midX and overlap on the vertical segment. Offset each one's midX
  // proportionally so they fan out cleanly.
  let path;
  if (Math.abs(y2 - y1) < 4) {
    // Straight horizontal
    path = `M ${x1} ${y1} L ${x2} ${y2}`;
  } else if (Math.abs(x2 - x1) < 4) {
    // Straight vertical
    path = `M ${x1} ${y1} L ${x2} ${y2}`;
  } else {
    // Orthogonal — out, turn vertical, in.
    let midX = x1 + (x2 - x1) / 2;
    if (m.exitTotal > 1) {
      // Each sibling gets its own midX channel, offset by ~12px per index.
      // Centered so the middle sibling stays on the centerline.
      const channelGap = 14;
      midX = midX + (m.exitOrder - (m.exitTotal - 1) / 2) * channelGap;
    }
    path = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
  }

  // === Label position ===
  let labelSvg = '';
  if (label && label.trim()) {
    let lx = (x1 + x2) / 2;
    let ly = y1; // sit on the horizontal segment
    // If there are multiple sibling exits, slide the label along the line so labels
    // for parallel connections don't pile up on each other.
    if (m.exitTotal > 1) {
      // Place label on the horizontal segment at the midX channel position
      const channelGap = 14;
      const midX = (x1 + (x2 - x1) / 2) + (m.exitOrder - (m.exitTotal - 1) / 2) * channelGap;
      lx = (x1 + midX) / 2;
      ly = y1;
    }
    // Cap label length so long labels (e.g. "If there is significant competition, or…")
    // don't bleed across multiple steps. 22 chars is roughly one line at default size.
    const MAX_LABEL_CHARS = 22;
    const labelTrimmed = label.length > MAX_LABEL_CHARS
      ? label.slice(0, MAX_LABEL_CHARS - 1).trim() + '…'
      : label;
    const labelW = labelTrimmed.length * 6 + 12;
    const tooltipAttr = labelTrimmed !== label ? `<title>${escapeHtml(label)}</title>` : '';
    labelSvg = `
      ${tooltipAttr}
      <rect class="conn-label-bg" x="${lx - labelW/2}" y="${ly - 9}" width="${labelW}" height="16" rx="3" />
      <text class="conn-label-text" x="${lx}" y="${ly + 1}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(labelTrimmed)}</text>
    `;
  }

  // Apply faded styling for "implied" edges that the user is viewing because
  // the global override is on. Lower opacity signals visual subordination.
  const opacity = (opts && opts.faded) ? '0.35' : '1';

  return `
    <g class="conn-group" opacity="${opacity}">
      <path d="${path}" fill="none" stroke="${stroke}" stroke-width="1.6" ${dashAttr} marker-end="${marker}" />
      ${labelSvg}
    </g>
  `;
}

function renderNoteCallout(proc, s) {
  const { x, y } = stepCenter(proc, s);
  const { w, h } = stepBox(s);
  const noteX = x + w/2 + 14;
  const noteY = y - h/2 - 4;
  const lines = wrapText(s.notes, 26).slice(0, 4);
  const noteH = lines.length * 13 + 18;
  const noteW = 180;

  const linesSvg = lines.map((line, i) =>
    `<text x="${noteX + 8}" y="${noteY + 14 + i * 13}" font-family="IBM Plex Sans" font-size="10" fill="#2a3a4d" font-style="italic">${escapeHtml(line)}</text>`
  ).join('');

  return `
    <g class="notes-callout">
      <line x1="${x + w/2}" y1="${y - h/2 + 8}" x2="${noteX}" y2="${noteY + 12}" stroke="#c9961f" stroke-width="1" stroke-dasharray="2 2" />
      <rect x="${noteX}" y="${noteY}" width="${noteW}" height="${noteH}" rx="4" fill="#fbf1d8" stroke="#c9961f" stroke-width="0.8" />
      <rect x="${noteX}" y="${noteY}" width="3" height="${noteH}" fill="#c9961f" />
      ${linesSvg}
    </g>
  `;
}

function wrapText(text, maxChars) {
  if (!text) return [];
  const words = text.split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length <= maxChars) {
      cur = (cur + ' ' + w).trim();
    } else {
      if (cur) lines.push(cur);
      cur = w;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ==================================================================
   RIGHT PANEL — Insights tab
   ================================================================== */

function renderInsights(proc) {
  const opts = proc.steps.filter(s => s.optimizable);
  const excs = proc.steps.filter(s => s.type === 'exception');
  const sysMap = {};
  proc.steps.forEach(s => {
    if (s.system && s.system.trim()) {
      const sys = s.system.trim();
      sysMap[sys] = (sysMap[sys] || 0) + 1;
    }
  });
  const systems = Object.entries(sysMap).sort((a, b) => b[1] - a[1]);

  // === Process integrity check ===
  // Walks the connection graph to find structural issues: missing start, missing end,
  // and orphaned steps (steps with no inbound that aren't marked as start, or steps
  // with no outbound that aren't marked as end).
  const starts = proc.steps.filter(s => s.shape === 'start');
  const ends = proc.steps.filter(s => s.shape === 'end');
  const inboundCount = {};
  proc.steps.forEach(s => { inboundCount[s.id] = 0; });
  proc.steps.forEach(s => {
    (s.connections || []).forEach(c => {
      if (inboundCount[c.toId] !== undefined) inboundCount[c.toId] += 1;
    });
  });
  const orphansNoIn = proc.steps.filter(s =>
    inboundCount[s.id] === 0 && s.shape !== 'start' && proc.steps.length > 1);
  const orphansNoOut = proc.steps.filter(s =>
    (!s.connections || s.connections.length === 0) && s.shape !== 'end' && proc.steps.length > 1);
  const integrityIssues = [];
  if (proc.steps.length > 0) {
    if (starts.length === 0) integrityIssues.push({ kind: 'no-start', text: 'No Start step. Mark the entry point so the flow is clear.' });
    if (ends.length === 0)   integrityIssues.push({ kind: 'no-end',   text: 'No End step. Mark where the process completes.' });
    if (starts.length > 2)   integrityIssues.push({ kind: 'multi-start', text: `${starts.length} Start steps — usually a process has 1. Consider whether these are really separate processes.` });
    if (orphansNoIn.length > 0)  integrityIssues.push({ kind: 'orphan-in',  text: `${orphansNoIn.length} step${orphansNoIn.length === 1 ? ' has' : 's have'} no inbound connection: ${orphansNoIn.slice(0, 3).map(s => '"' + s.title + '"').join(', ')}${orphansNoIn.length > 3 ? '…' : ''}` });
    if (orphansNoOut.length > 0) integrityIssues.push({ kind: 'orphan-out', text: `${orphansNoOut.length} step${orphansNoOut.length === 1 ? ' has' : 's have'} no outbound connection: ${orphansNoOut.slice(0, 3).map(s => '"' + s.title + '"').join(', ')}${orphansNoOut.length > 3 ? '…' : ''}` });
  }
  const integrityHtml = integrityIssues.length === 0 && proc.steps.length > 1 ? `
    <div class="integrity-callout integrity-ok">
      <div class="integrity-icon">✓</div>
      <div>
        <div class="integrity-title">Process integrity looks good.</div>
        <div class="integrity-sub">${starts.length} start · ${ends.length} end · all steps connected.</div>
      </div>
    </div>
  ` : integrityIssues.length > 0 ? `
    <div class="integrity-callout integrity-warn">
      <div class="integrity-icon">⚠</div>
      <div>
        <div class="integrity-title">Process integrity</div>
        <ul class="integrity-list">
          ${integrityIssues.map(i => `<li>${escapeHtml(i.text)}</li>`).join('')}
        </ul>
      </div>
    </div>
  ` : '';

  // Implied/redundant edges count — show when the renderer is auto-hiding lines
  // so the user can find them via the toolbar toggle if they want to see them.
  const redundantCount = (_redundantEdgesCache && _redundantEdgesCache.size) || 0;
  const impliedHtml = redundantCount > 0 ? `
    <div class="integrity-callout" style="background: #f3f0e3; border-color: #d8d2bc; color: var(--ink-soft);">
      <div class="integrity-icon" style="color: var(--muted);">⊘</div>
      <div>
        <div class="integrity-title">${redundantCount} implied connection${redundantCount === 1 ? '' : 's'} hidden</div>
        <div class="integrity-sub">${editor.showImpliedEdges ? 'Currently visible (faded). ' : ''}These are paths where the destination is already reachable through other steps. Toggle <em>Show implied lines</em> in the toolbar to ${editor.showImpliedEdges ? 'hide them again' : 'see them'}, or override per-edge in the Step tab.</div>
      </div>
    </div>
  ` : '';

  // Variance hotspots — steps where multiple locations deviate from the canonical.
  // Sorted by # locations affected × annual executions to surface the highest-ROI
  // standardization targets. Tells the user "if all locations adopted canonical
  // here, here's what it would save."
  const stepsWithVariances = proc.steps
    .filter(s => (s.variances || []).length > 0)
    .map(s => {
      const totalLocsAffected = (s.variances || []).reduce((n, v) => n + (v.locationIds || []).length, 0);
      const minutesDeltaSum = (s.variances || []).reduce((sum, v) => {
        return sum + Math.abs(v.minutesDelta || 0) * (v.locationIds || []).length;
      }, 0);
      // Approx annual hours impact across all affected locations
      const annualHrsImpact = (annualExecutions(proc) * minutesDeltaSum) / (state.locations || []).length / 60;
      return { step: s, locsAffected: totalLocsAffected, minutesDeltaSum, annualHrsImpact };
    })
    .sort((a, b) => b.locsAffected - a.locsAffected);
  const totalVarianceRecords = stepsWithVariances.reduce((n, x) => n + x.step.variances.length, 0);
  const varianceHotspotsHtml = stepsWithVariances.length > 0 ? `
    <div class="insight-section">
      <div class="insight-section-head">
        <span>VARIANCE HOTSPOTS</span>
        <span class="insight-section-count">${stepsWithVariances.length}</span>
      </div>
      <div class="insight-section-sub">Steps where locations deviate from canonical. Sorted by reach. Standardization candidates.</div>
      ${stepsWithVariances.slice(0, 5).map(x => {
        const lane = laneById(proc, x.step.laneId);
        return `
          <div class="insight-card variance-hotspot-card" onclick="selectStep('${x.step.id}')">
            <div class="insight-card-title">${escapeHtml(x.step.title)}</div>
            <div class="insight-card-meta">
              ${lane ? `<span class="insight-meta-chip" style="background:${lane.color}; color:white;">${escapeHtml(lane.name)}</span>` : ''}
              <span class="insight-meta-chip" style="background:#9d2d2d; color:white;">${x.locsAffected} location${x.locsAffected === 1 ? '' : 's'}</span>
              <span class="insight-meta-chip">${x.step.variances.length} variance${x.step.variances.length === 1 ? '' : 's'}</span>
            </div>
            ${x.annualHrsImpact > 0 ? `<div class="insight-card-note" style="margin-top:6px;"><strong>~${formatHours(x.annualHrsImpact)}/yr</strong> if all locations adopted canonical here.</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  // Savings forecast for this process
  const team = findTeamForProcess(proc.id);
  const annualMin = processForecastedAnnualMinutes(proc);
  const annualHr = annualMin / 60;
  const realizedHr = processRealizedAnnualMinutes(proc) / 60;
  const rate = laborRateForTeam(team);
  const annualDollars = annualHr * rate;
  const realizedDollars = realizedHr * rate;
  const annualExec = annualExecutions(proc);

  const subProcSteps = proc.steps.filter(s => s.shape === 'subprocess' && s.linkedProcessId);
  const childProcs = getChildProcesses(proc.id);

  const forecastHtml = annualHr > 0 ? `
    <div class="savings-callout">
      <span class="big">${formatHours(annualHr)}</span> per year forecasted savings
      (≈ ${formatDollars(annualDollars)} at $${rate}/hr).
      ${realizedHr > 0 ? `<br/><span style="color: #2d6a4f; font-weight: 600;">✓ ${formatHours(realizedHr)} (${formatDollars(realizedDollars)}) already realized.</span>` : ''}
      <div style="font-size: 11px; color: var(--ink-soft); margin-top: 6px;">
        ${proc.frequency.count}× per ${proc.frequency.period} · ${annualExec.toLocaleString()} executions/year
      </div>
    </div>
  ` : '';

  const optHtml = opts.length === 0
    ? `<div class="insight-empty">No steps flagged for optimization yet. Open a step and toggle "Flag as optimization opportunity."</div>`
    : opts.map(s => {
        const lane = laneById(proc, s.laneId);
        const status = s.optimizationStatus || 'identified';
        const statusLabels = { identified: 'Identified', planned: 'Planned', in_progress: 'In Progress', done: 'Implemented' };
        const stepHrs = (annualExec * stepMinutesSaved(s)) / 60;
        return `
          <div class="insight-card" onclick="selectStep('${s.id}')">
            <div class="insight-card-title">
              ${escapeHtml(s.title)}
              <span class="opt-status-pill ${status}">${statusLabels[status]}</span>
            </div>
            <div class="insight-card-meta">${escapeHtml(lane ? lane.name : 'No lane')} · ${escapeHtml(s.system || 'No system')}${stepHrs > 0 ? ' · <strong>' + formatHours(stepHrs) + '/yr</strong>' : ''}</div>
            ${s.optimizationNote ? `<div class="insight-card-note">${escapeHtml(s.optimizationNote)}</div>` : ''}
          </div>
        `;
      }).join('');

  const excHtml = excs.length === 0
    ? `<div class="insight-empty">No exception paths mapped.</div>`
    : excs.map(s => {
        const lane = laneById(proc, s.laneId);
        return `
          <div class="insight-card exc" onclick="selectStep('${s.id}')">
            <div class="insight-card-title">${escapeHtml(s.title)}</div>
            <div class="insight-card-meta">${escapeHtml(lane ? lane.name : 'No lane')}</div>
          </div>
        `;
      }).join('');

  const sysHtml = systems.length === 0
    ? `<div class="insight-empty">No systems tagged.</div>`
    : `<div class="system-chips">${systems.map(([s, n]) =>
        `<div class="system-chip">${escapeHtml(s)}<span class="system-chip-count">${n}</span></div>`
      ).join('')}</div>`;

  // Linked processes (sub-processes called by this process)
  const linksHtml = subProcSteps.length === 0 ? '' : `
    <div class="insight-section">
      <div class="insight-section-title">
        <span>Sub-processes invoked</span>
        <span class="insight-count">${subProcSteps.length}</span>
      </div>
      ${subProcSteps.map(s => {
        const linked = findProcessAnywhere(s.linkedProcessId);
        if (!linked) return `<div class="insight-card"><div class="insight-card-title">${escapeHtml(s.title)}</div><div class="insight-card-meta">⚠ Linked process not found</div></div>`;
        return `
          <div class="insight-card" onclick="navigate('process', { teamId: '${linked.team.id}', processId: '${linked.process.id}' })">
            <div class="insight-card-title">${escapeHtml(s.title)} <span class="parent-link"><span class="chev">↗</span></span></div>
            <div class="insight-card-meta">→ ${escapeHtml(linked.process.name)} · ${escapeHtml(linked.team.name)}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  // Child processes (other processes that mark this as parent)
  const childrenHtml = childProcs.length === 0 ? '' : `
    <div class="insight-section">
      <div class="insight-section-title">
        <span>Child processes</span>
        <span class="insight-count">${childProcs.length}</span>
      </div>
      ${childProcs.map(({ team, process }) => `
        <div class="insight-card" onclick="navigate('process', { teamId: '${team.id}', processId: '${process.id}' })">
          <div class="insight-card-title">${escapeHtml(process.name)} <span class="parent-link"><span class="chev">↘</span></span></div>
          <div class="insight-card-meta">${escapeHtml(team.name)} · ${process.steps.length} steps</div>
        </div>
      `).join('')}
    </div>
  `;

  return `
    ${integrityHtml}
    ${impliedHtml}
    ${forecastHtml}
    ${varianceHotspotsHtml}

    <div class="insight-section">
      <div class="insight-section-title">
        <span>Optimization opportunities</span>
        <span class="insight-count" style="${opts.length ? 'color: var(--highlight); border-color: var(--highlight);' : ''}">${opts.length}</span>
      </div>
      ${optHtml}
    </div>

    <div class="insight-section">
      <div class="insight-section-title">
        <span>Exception paths</span>
        <span class="insight-count" style="${excs.length ? 'color: var(--exception); border-color: var(--exception-soft);' : ''}">${excs.length}</span>
      </div>
      ${excHtml}
    </div>

    ${linksHtml}
    ${childrenHtml}

    <div class="insight-section">
      <div class="insight-section-title">
        <span>Systems in use</span>
        <span class="insight-count">${systems.length}</span>
      </div>
      ${sysHtml}
    </div>
  `;
}

/* ==================================================================
   RIGHT PANEL — Step editor tab
   ================================================================== */

function renderStepEditor(proc) {
  if (!editor.selectedStepId) {
    return `
      <div class="step-form-empty">
        <div class="step-form-empty-icon">⌖</div>
        <div class="step-form-empty-title">No step selected</div>
        <div class="step-form-empty-sub">Click a step on the canvas to edit, or use <strong>+ Step</strong>/<strong>+ Decision</strong> to add a new one.</div>
      </div>
    `;
  }
  const s = proc.steps.find(x => x.id === editor.selectedStepId);
  if (!s) {
    editor.selectedStepId = null;
    return renderStepEditor(proc);
  }

  // Lane pills
  const lanePills = proc.lanes.map(l => `
    <button class="lane-pill ${s.laneId === l.id ? 'active' : ''}" onclick="updateStep('${s.id}', 'laneId', '${l.id}')">
      <span class="lane-pill-swatch" style="background: ${l.color}"></span>${escapeHtml(l.name)}
    </button>
  `).join('');

  // Predecessor selector — list of all steps that COULD point here
  const otherSteps = proc.steps.filter(x => x.id !== s.id);

  // Tasks list
  const tasksHtml = (s.tasks || []).map((t, i) => `
    <li class="task-item">
      <span class="task-bullet">▸</span>
      <input class="task-input" value="${escapeHtml(t)}" oninput="updateTask('${s.id}', ${i}, this.value)" />
      <button class="task-remove" onclick="removeTask('${s.id}', ${i})">×</button>
    </li>
  `).join('');

  // Connections — outgoing. Each row shows the target picker, label, and a
  // display-override control (auto/show/hide) that determines whether this edge
  // is rendered when the auto-redundancy detection would otherwise hide it.
  const connsHtml = (s.connections || []).map((c, i) => {
    const target = proc.steps.find(x => x.id === c.toId);
    const display = c.display || 'auto';
    const edgeKey = s.id + '|' + c.toId + '|' + i;
    const isAutoRedundant = _redundantEdgesCache && _redundantEdgesCache.has(edgeKey);
    const hint = isAutoRedundant && display === 'auto'
      ? `<div style="font-size:10px; color: var(--muted-soft); padding-left: 22px; margin-top: -2px;">⊘ Auto-hidden — implied by another path</div>`
      : '';
    return `
      <div class="lane-row" style="background: var(--surface); flex-wrap: wrap;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); flex-shrink: 0;">→</span>
        <select class="form-select" style="border:none; background:transparent; padding: 0; flex: 1; min-width: 120px; font-size: 12px;" onchange="updateConnTarget('${s.id}', ${i}, this.value)">
          <option value="">— select target —</option>
          ${otherSteps.map(o => `<option value="${o.id}" ${c.toId === o.id ? 'selected' : ''}>${escapeHtml(o.title || '(untitled)')}</option>`).join('')}
        </select>
        <input class="lane-row-input" placeholder="Label (Yes/No)" value="${escapeHtml(c.label || '')}" style="max-width: 90px; font-size: 11px;" oninput="updateConnLabel('${s.id}', ${i}, this.value)" />
        <button class="lane-row-remove" onclick="removeConn('${s.id}', ${i})">×</button>
        <div class="conn-display-pills" style="flex-basis: 100%; display: flex; gap: 4px; padding-left: 22px; margin-top: 4px; align-items: center;">
          <span style="font-size: 10px; color: var(--muted-soft); margin-right: 4px;">DISPLAY:</span>
          <button class="pill ${display === 'auto' ? 'active' : ''}" style="font-size: 10px; padding: 3px 8px;" onclick="setConnDisplay('${s.id}', ${i}, 'auto')" title="Auto: hide if implied by another path">Auto</button>
          <button class="pill ${display === 'show' ? 'active' : ''}" style="font-size: 10px; padding: 3px 8px;" onclick="setConnDisplay('${s.id}', ${i}, 'show')" title="Always show, even if redundant">Show</button>
          <button class="pill ${display === 'hide' ? 'active' : ''}" style="font-size: 10px; padding: 3px 8px;" onclick="setConnDisplay('${s.id}', ${i}, 'hide')" title="Always hide this connection">Hide</button>
        </div>
        ${hint}
      </div>
    `;
  }).join('');

  return `
    <div class="form-row">
      <label class="form-label">Title</label>
      <input class="form-input" value="${escapeHtml(s.title || '')}" oninput="updateStep('${s.id}', 'title', this.value, true)" />
    </div>

    <div class="form-row">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" oninput="updateStep('${s.id}', 'description', this.value, true)">${escapeHtml(s.description || '')}</textarea>
    </div>

    <div class="form-row">
      <label class="form-label">Shape</label>
      <div class="pill-group" style="flex-wrap: wrap;">
        <button class="pill ${s.shape === 'start' ? 'active' : ''}" onclick="updateStep('${s.id}', 'shape', 'start')"><span class="pill-dot" style="background: #2d6a4f; border-radius: 99px; width: 14px; height: 6px;"></span>Start</button>
        <button class="pill ${s.shape === 'step' ? 'active' : ''}" onclick="updateStep('${s.id}', 'shape', 'step')"><span class="pill-dot" style="background: var(--ink-soft);"></span>Step</button>
        <button class="pill ${s.shape === 'decision' ? 'active' : ''}" onclick="updateStep('${s.id}', 'shape', 'decision')"><span class="pill-dot" style="background: var(--ink-soft); transform: rotate(45deg);"></span>Decision</button>
        <button class="pill ${s.shape === 'subprocess' ? 'active' : ''}" onclick="updateStep('${s.id}', 'shape', 'subprocess')"><span class="pill-dot" style="background: #4a5e7a;"></span>Sub-process</button>
        <button class="pill ${s.shape === 'end' ? 'active' : ''}" onclick="updateStep('${s.id}', 'shape', 'end')"><span class="pill-dot" style="background: transparent; border: 2px double #2d6a4f; border-radius: 99px; width: 14px; height: 6px; box-sizing: border-box;"></span>End</button>
      </div>
    </div>

    ${s.shape === 'subprocess' ? `
      <div class="form-row">
        <label class="form-label">Linked process</label>
        <select class="form-select" onchange="updateStep('${s.id}', 'linkedProcessId', this.value || null)">
          <option value="">— select a process to link —</option>
          ${state.teams.flatMap(t => t.processes
            .filter(pp => pp.id !== proc.id)
            .map(pp => `<option value="${pp.id}" ${s.linkedProcessId === pp.id ? 'selected' : ''}>${escapeHtml(t.name)} / ${escapeHtml(pp.name)}</option>`)
          ).join('')}
        </select>
        <div style="font-size: 11px; color: var(--ink-soft); margin-top: 6px;">
          ${s.linkedProcessId ? 'Click the step on the canvas to drill into the linked process. Shift-click to keep editing.' : 'No process linked yet — click on the canvas will just select the step.'}
        </div>
      </div>
    ` : ''}

    <div class="form-row">
      <label class="form-label">Path type</label>
      <div class="pill-group">
        <button class="pill happy ${s.type === 'happy' ? 'active' : ''}" onclick="updateStep('${s.id}', 'type', 'happy')"><span class="pill-dot" style="background: ${s.type === 'happy' ? '#fff' : 'var(--happy)'};"></span>Happy path</button>
        <button class="pill exception ${s.type === 'exception' ? 'active' : ''}" onclick="updateStep('${s.id}', 'type', 'exception')"><span class="pill-dot" style="background: ${s.type === 'exception' ? '#fff' : 'var(--exception)'};"></span>Exception</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">Lane</label>
      <div>${lanePills}</div>
    </div>

    <div class="form-row">
      <label class="form-label">Column position</label>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn btn-secondary btn-sm" onclick="updateStep('${s.id}', 'column', Math.max(0, ${s.column} - 1))">←</button>
        <span style="font-family: 'IBM Plex Mono', monospace; padding: 0 10px; font-size: 13px;">col ${s.column}</span>
        <button class="btn btn-secondary btn-sm" onclick="updateStep('${s.id}', 'column', ${s.column} + 1)">→</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">System / tool tag</label>
      <input class="form-input" placeholder="e.g. Workday, Equifax, Okta" value="${escapeHtml(s.system || '')}" oninput="updateStep('${s.id}', 'system', this.value, true)" />
    </div>

    <div class="form-row">
      <label class="form-label">Time per execution</label>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="flex: 1;">
          <div style="font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px;">Current (min)</div>
          <input class="form-input" type="number" min="0" step="1" value="${s.currentMinutes || 0}" oninput="updateStep('${s.id}', 'currentMinutes', parseFloat(this.value) || 0, true)" />
        </div>
        <div style="flex: 1;">
          <div style="font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px;">Target (min)</div>
          <input class="form-input" type="number" min="0" step="1" value="${s.targetMinutes || 0}" oninput="updateStep('${s.id}', 'targetMinutes', parseFloat(this.value) || 0, true)" />
        </div>
      </div>
    </div>

    <div class="form-row" id="tut-optflag">
      <label class="form-label">Optimization flag</label>
      <div class="checkbox-row ${s.optimizable ? 'active' : ''}" onclick="toggleOpt('${s.id}')">
        <input type="checkbox" ${s.optimizable ? 'checked' : ''} onclick="event.stopPropagation();" onchange="toggleOpt('${s.id}')" />
        <label>Flag this step as an optimization opportunity</label>
      </div>
      ${s.optimizable ? `
        <textarea class="form-textarea" style="margin-top: 8px;" placeholder="Why is this an optimization opportunity?" oninput="updateStep('${s.id}', 'optimizationNote', this.value, true)">${escapeHtml(s.optimizationNote || '')}</textarea>
        <div style="margin-top: 10px;">
          <div style="font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;">Optimization status</div>
          <div class="pill-group" style="gap: 4px;">
            <button class="pill ${s.optimizationStatus === 'identified' ? 'active' : ''}" onclick="updateStep('${s.id}', 'optimizationStatus', 'identified')" style="font-size: 11px;">Identified</button>
            <button class="pill ${s.optimizationStatus === 'planned' ? 'active' : ''}" onclick="updateStep('${s.id}', 'optimizationStatus', 'planned')" style="font-size: 11px;">Planned</button>
            <button class="pill ${s.optimizationStatus === 'in_progress' ? 'active' : ''}" onclick="updateStep('${s.id}', 'optimizationStatus', 'in_progress')" style="font-size: 11px;">In Progress</button>
            <button class="pill ${s.optimizationStatus === 'done' ? 'active' : ''}" onclick="updateStep('${s.id}', 'optimizationStatus', 'done')" style="font-size: 11px;">Implemented</button>
          </div>
          ${s.optimizationStatus === 'done' ? `
            <div style="margin-top: 10px;">
              <div style="font-size: 10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px;">Realized minutes (post-implementation)</div>
              <input class="form-input" type="number" min="0" step="1" placeholder="Actual time after change"
                value="${s.realizedMinutes !== null ? s.realizedMinutes : ''}"
                oninput="updateStep('${s.id}', 'realizedMinutes', this.value === '' ? null : parseFloat(this.value), true)" />
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>

    <div class="form-row">
      <label class="form-label">Tasks</label>
      <ul class="tasks-list">${tasksHtml}</ul>
      <button class="task-add" onclick="addTask('${s.id}')">+ Add task</button>
    </div>

    <div class="form-row">
      <label class="form-label">Notes (attached, hideable)</label>
      <textarea class="form-textarea" placeholder="Detailed notes — context, gotchas, rules. Toggle 'Notes' on the canvas to show as callouts." oninput="updateStep('${s.id}', 'notes', this.value, true)">${escapeHtml(s.notes || '')}</textarea>
    </div>

    <div class="form-row">
      <label class="form-label">Connects to</label>
      <div>${connsHtml || '<div class="insight-empty">No outgoing connections.</div>'}</div>
      <button class="task-add" onclick="addConn('${s.id}')">+ Add connection</button>
    </div>

    <div class="form-row" id="tut-variances">
      <label class="form-label">Location variances ${(s.variances || []).length > 0 ? `<span class="variance-count-badge">${s.variances.length}</span>` : ''}</label>
      <div class="form-help" style="font-size: 11px; color: var(--muted); margin-bottom: 8px;">How this step differs at specific locations. Each variance lists which locations deviate, what changes, and the time impact.</div>
      <div>${renderVariancesHtml(s)}</div>
      ${state.locations && state.locations.length > 0
        ? `<button class="task-add" onclick="addVariance('${s.id}')">+ Add variance</button>`
        : `<div class="insight-empty">No locations defined. Add locations in <a href="#" onclick="event.preventDefault(); openSettingsModal(); return false;" style="color: var(--happy); text-decoration: underline; cursor: pointer;">Settings → Locations</a> first.</div>`
      }
    </div>

    <div class="form-actions">
      <div class="form-actions-left">
        <button class="btn btn-danger btn-sm" onclick="deleteStep('${s.id}')">Delete step</button>
      </div>
      <div class="form-actions-right">
        <button class="btn btn-secondary btn-sm" onclick="setRightTab('insights')">Done</button>
      </div>
    </div>
  `;
}

// Render the list of variances on a step. Each row shows: a visual chip indicating
// the variance type and time impact, the location chips, the description (editable),
// and a remove button. Designed to be compact since a step might have several variances.
function renderVariancesHtml(step) {
  const variances = step.variances || [];
  if (variances.length === 0) {
    return `<div class="insight-empty">No variances yet. The canonical applies to all locations.</div>`;
  }
  const allLocs = state.locations || [];
  return variances.map((v, vi) => {
    const locsList = (v.locationIds || []).map(lid => {
      const loc = allLocs.find(l => l.id === lid);
      return loc ? `<span class="variance-loc-chip" title="${escapeHtml(loc.name)}">${escapeHtml(loc.code)}</span>` : '';
    }).filter(Boolean).join('');
    const numLocs = (v.locationIds || []).length;
    const deltaLabel = v.minutesDelta > 0
      ? `<span class="variance-delta variance-delta-pos">+${v.minutesDelta}m</span>`
      : v.minutesDelta < 0
        ? `<span class="variance-delta variance-delta-neg">${v.minutesDelta}m</span>`
        : '';
    const typeLabel = {
      'extra-step': 'Extra step',
      'skipped': 'Skipped',
      'different-system': 'Different system',
      'different-role': 'Different role',
      'longer': 'Longer',
      'shorter': 'Shorter',
      'other': 'Other'
    }[v.type] || 'Other';
    return `
      <div class="variance-row">
        <div class="variance-row-head">
          <select class="variance-type-select" onchange="updateVariance('${step.id}', ${vi}, 'type', this.value)">
            ${['extra-step','skipped','different-system','different-role','longer','shorter','other'].map(t =>
              `<option value="${t}" ${v.type === t ? 'selected' : ''}>${ {
                'extra-step': 'Extra step',
                'skipped': 'Skipped',
                'different-system': 'Different system',
                'different-role': 'Different role',
                'longer': 'Longer',
                'shorter': 'Shorter',
                'other': 'Other'
              }[t] }</option>`
            ).join('')}
          </select>
          <input type="number" class="variance-delta-input" placeholder="±min" value="${v.minutesDelta || 0}" onchange="updateVariance('${step.id}', ${vi}, 'minutesDelta', parseInt(this.value)||0)" title="Minutes added (+) or saved (-) per execution at affected locations" />
          <span class="variance-loc-count">${numLocs} ${numLocs === 1 ? 'location' : 'locations'}</span>
          <button class="lane-row-remove" onclick="removeVariance('${step.id}', ${vi})" title="Remove variance">×</button>
        </div>
        <div class="variance-loc-chips">
          ${locsList || '<span style="font-size:11px;color:var(--muted-soft);">No locations selected</span>'}
          <button class="variance-edit-locs" onclick="editVarianceLocations('${step.id}', ${vi})">Edit locations →</button>
        </div>
        <textarea class="variance-desc" placeholder="What's different at these locations?" oninput="updateVariance('${step.id}', ${vi}, 'description', this.value, true)">${escapeHtml(v.description || '')}</textarea>
      </div>
    `;
  }).join('');
}

// Variance CRUD handlers
function addVariance(stepId) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === stepId); if (!s) return;
  if (!Array.isArray(s.variances)) s.variances = [];
  s.variances.push({
    id: uid('var'),
    locationIds: [],
    type: 'other',
    description: '',
    minutesDelta: 0
  });
  saveState(); render();
}

function updateVariance(stepId, vi, key, val, skipRender) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === stepId); if (!s) return;
  if (!s.variances || !s.variances[vi]) return;
  s.variances[vi][key] = val;
  saveState();
  if (!skipRender) render();
}

function removeVariance(stepId, vi) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === stepId); if (!s) return;
  if (!confirm('Remove this variance?')) return;
  s.variances.splice(vi, 1);
  saveState(); render();
}

function editVarianceLocations(stepId, vi) {
  // Open a small modal listing all locations as checkboxes
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === stepId); if (!s) return;
  if (!s.variances || !s.variances[vi]) return;
  const v = s.variances[vi];
  const allLocs = state.locations || [];
  if (allLocs.length === 0) { alert('Add locations in Settings → Locations first.'); return; }
  const selected = new Set(v.locationIds || []);
  const modalHtml = `
    <div class="modal-backdrop" onclick="closeVarianceLocsModal(event)">
      <div class="modal" onclick="event.stopPropagation()" style="max-width: 520px;">
        <div class="modal-head">
          <div class="modal-title">Select locations with this variance</div>
          <button class="modal-close" onclick="closeVarianceLocsModal()">×</button>
        </div>
        <div class="modal-body" style="max-height: 460px; overflow-y: auto;">
          <div style="margin-bottom: 12px; display: flex; gap: 8px;">
            <button class="btn btn-secondary btn-sm" onclick="varianceLocsToggleAll(true)">Select all</button>
            <button class="btn btn-secondary btn-sm" onclick="varianceLocsToggleAll(false)">Clear</button>
          </div>
          <div id="varianceLocsList">
            ${allLocs.map(l => `
              <label class="variance-loc-checkbox">
                <input type="checkbox" value="${l.id}" ${selected.has(l.id) ? 'checked' : ''} />
                <span class="variance-loc-checkbox-code">${escapeHtml(l.code)}</span>
