/* ==================================================================
   SAVINGS / FORECAST HELPERS
   ================================================================== */

const PERIOD_TO_YEAR = { day: 365, week: 52, month: 12, quarter: 4, year: 1 };

function annualExecutions(p) {
  if (!p || !p.frequency) return 0;
  const mult = PERIOD_TO_YEAR[p.frequency.period] || 1;
  return (p.frequency.count || 0) * mult;
}

function laborRateForTeam(team) {
  if (team && typeof team.laborRate === 'number' && team.laborRate > 0) return team.laborRate;
  return (state.settings && state.settings.laborRate) || 50;
}

// Per-step minutes saved per single execution of the parent process
function stepMinutesSaved(step) {
  if (!step.optimizable) return 0;
  const cur = step.currentMinutes || 0;
  const tgt = step.targetMinutes || 0;
  return Math.max(0, cur - tgt);
}
function stepMinutesRealized(step) {
  if (!step.optimizable || step.optimizationStatus !== 'done') return 0;
  const cur = step.currentMinutes || 0;
  const real = step.realizedMinutes !== null ? step.realizedMinutes : (step.targetMinutes || 0);
  return Math.max(0, cur - real);
}

// Forecasted annual minutes saved across all optimizable steps in a process
function processForecastedAnnualMinutes(p) {
  const exec = annualExecutions(p);
  const minPerExec = (p.steps || []).reduce((a, s) => a + stepMinutesSaved(s), 0);
  return exec * minPerExec;
}
function processRealizedAnnualMinutes(p) {
  const exec = annualExecutions(p);
  const minPerExec = (p.steps || []).reduce((a, s) => a + stepMinutesRealized(s), 0);
  return exec * minPerExec;
}
function findTeamForProcess(processId) {
  for (const t of state.teams) {
    if (t.processes.some(p => p.id === processId)) return t;
  }
  return null;
}
function annualDollarsForProcess(p) {
  const team = findTeamForProcess(p.id);
  const rate = laborRateForTeam(team);
  return (processForecastedAnnualMinutes(p) / 60) * rate;
}
function realizedDollarsForProcess(p) {
  const team = findTeamForProcess(p.id);
  const rate = laborRateForTeam(team);
  return (processRealizedAnnualMinutes(p) / 60) * rate;
}
function totalForecastedAnnualHours() {
  let mins = 0;
  state.teams.forEach(t => t.processes.forEach(p => { mins += processForecastedAnnualMinutes(p); }));
  return mins / 60;
}
function totalForecastedAnnualDollars() {
  let total = 0;
  state.teams.forEach(t => t.processes.forEach(p => {
    total += (processForecastedAnnualMinutes(p) / 60) * laborRateForTeam(t);
  }));
  return total;
}
function totalRealizedAnnualHours() {
  let mins = 0;
  state.teams.forEach(t => t.processes.forEach(p => { mins += processRealizedAnnualMinutes(p); }));
  return mins / 60;
}
function formatHours(h) {
  if (h === 0) return '0 hr';
  if (h < 1) return Math.round(h * 60) + ' min';
  if (h < 100) return h.toFixed(1) + ' hr';
  return Math.round(h).toLocaleString() + ' hr';
}
function formatDollars(d) {
  if (d === 0) return '$0';
  if (d < 1000) return '$' + Math.round(d);
  if (d < 100000) return '$' + (d / 1000).toFixed(1) + 'k';
  return '$' + Math.round(d / 1000).toLocaleString() + 'k';
}

function allProcesses() {
  const out = [];
  state.teams.forEach(t => t.processes.forEach(p => out.push({ team: t, process: p })));
  return out;
}
function findProcessAnywhere(processId) {
  for (const t of state.teams) {
    const p = t.processes.find(pp => pp.id === processId);
    if (p) return { team: t, process: p };
  }
  return null;
}
function getChildProcesses(parentProcessId) {
  return allProcesses().filter(({ process }) => process.parentProcessId === parentProcessId);
}
function getRootProcesses() {
  return allProcesses().filter(({ process }) => !process.parentProcessId);
}

/* ==================================================================
   TRIGGER HELPERS
   ================================================================== */

function uidTrigger() { return 'trg_' + Math.random().toString(36).slice(2, 9); }

// Returns all journey-graph edges across the org. Each edge:
// { from: {teamId, processId, stepId?}, to: {teamId, processId}, trigger?: triggerObj, source: 'trigger'|'subprocess' }
function allJourneyEdges() {
  const edges = [];
  state.teams.forEach(t => t.processes.forEach(p => {
    // Process-level explicit triggers
    (p.triggers || []).forEach(tg => {
      const tgt = findProcessAnywhere(tg.toProcessId);
      if (!tgt) return; // dangling trigger, skip
      edges.push({
        id: 'e_' + p.id + '_' + tg.id,
        from: { teamId: t.id, processId: p.id, stepId: null },
        to: { teamId: tgt.team.id, processId: tgt.process.id },
        trigger: tg,
        source: 'trigger'
      });
    });
    // Step-level subprocess links — only render if no explicit trigger already covers it
    (p.steps || []).forEach(s => {
      if (s.shape === 'subprocess' && s.linkedProcessId) {
        const alreadyCovered = (p.triggers || []).some(tg => tg.toProcessId === s.linkedProcessId);
        if (alreadyCovered) return;
        const tgt = findProcessAnywhere(s.linkedProcessId);
        if (!tgt) return;
        edges.push({
          id: 'e_sub_' + s.id,
          from: { teamId: t.id, processId: p.id, stepId: s.id },
          to: { teamId: tgt.team.id, processId: tgt.process.id },
          trigger: null,
          source: 'subprocess'
        });
      }
    });
  }));
  return edges;
}

// Topological-ish layout: assign each process a "depth" based on longest path of triggers feeding into it.
// Returns Map<processId, { col, row }>. Cycle-safe: nodes in cycles are placed at their highest valid depth.
function computeJourneyLayout() {
  const procs = allProcesses();
  const edges = allJourneyEdges();
  const inEdges = {}; // processId → array of from processIds
  const outEdges = {};
  procs.forEach(({ process }) => { inEdges[process.id] = []; outEdges[process.id] = []; });
  edges.forEach(e => {
    if (e.from.processId === e.to.processId) return; // skip self-loops
    inEdges[e.to.processId].push(e.from.processId);
    outEdges[e.from.processId].push(e.to.processId);
  });
  // Kahn's algorithm with cycle tolerance
  const depth = {};
  procs.forEach(({ process }) => { depth[process.id] = 0; });
  let changed = true;
  let safety = 0;
  while (changed && safety < 50) {
    changed = false;
    safety++;
    procs.forEach(({ process }) => {
      const incoming = inEdges[process.id];
      if (!incoming || incoming.length === 0) return;
      const maxIncoming = Math.max(...incoming.map(id => depth[id] != null ? depth[id] : 0));
      const newDepth = maxIncoming + 1;
      if (newDepth > depth[process.id]) { depth[process.id] = newDepth; changed = true; }
    });
  }
  // Group by column, assign rows by team
  const byCol = {};
  procs.forEach(({ team, process }) => {
    const col = depth[process.id] || 0;
    if (!byCol[col]) byCol[col] = [];
    byCol[col].push({ team, process });
  });
  // Sort within each column by team.id then process.name for stable layout
  Object.keys(byCol).forEach(c => {
    byCol[c].sort((a, b) => {
      if (a.team.id !== b.team.id) return a.team.id.localeCompare(b.team.id);
      return a.process.name.localeCompare(b.process.name);
    });
  });
  const layout = {};
  Object.keys(byCol).sort((a, b) => +a - +b).forEach(c => {
    byCol[c].forEach((entry, row) => {
      layout[entry.process.id] = { col: +c, row, team: entry.team, process: entry.process };
    });
  });
  return { layout, edges, columns: Object.keys(byCol).length };
}

function formatHandoff(ho) {
  if (!ho || !ho.value) return '';
  const v = ho.value;
  const u = ho.unit || 'min';
  const unitLabel = u === 'min' ? 'min' : u === 'hour' ? (v === 1 ? 'hr' : 'hrs') : (v === 1 ? 'day' : 'days');
  return `${v} ${unitLabel}`;
}

  const totalForecastDollars = totalForecastedAnnualDollars();
  const totalRealizedHours = totalRealizedAnnualHours();
  const realizedDollars = state.teams.reduce((acc, t) => acc + t.processes.reduce((a, p) => a + realizedDollarsForProcess(p), 0), 0);

  // ROI ranking
  const ranked = procs
    .map(({ team, process }) => ({
      team, process,
      hours: processForecastedAnnualMinutes(process) / 60,
      dollars: annualDollarsForProcess(process),
      optCount: process.steps.filter(s => s.optimizable).length
    }))
    .filter(r => r.hours > 0)
    .sort((a, b) => b.hours - a.hours)
    .slice(0, 8);
  const maxHours = Math.max(1, ...ranked.map(r => r.hours));

  // System hotspots — count optimizable steps per system
  const sysMap = {};
  procs.forEach(({ process }) => {
    process.steps.forEach(s => {
      if (s.optimizable && s.system) {
        if (!sysMap[s.system]) sysMap[s.system] = { count: 0, hours: 0 };
        sysMap[s.system].count++;
        sysMap[s.system].hours += (annualExecutions(process) * stepMinutesSaved(s)) / 60;
      }
    });
  });
  const sysList = Object.entries(sysMap)
    .map(([sys, info]) => ({ sys, ...info }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 8);
  const maxSysHours = Math.max(1, ...sysList.map(s => s.hours));

  // Optimization tracker — flat list of all optimizable steps grouped by status
  const allOpts = [];
  procs.forEach(({ team, process }) => {
    process.steps.forEach(s => {
      if (s.optimizable) {
        allOpts.push({
          step: s, process, team,
          status: s.optimizationStatus || 'identified',
          forecastHours: (annualExecutions(process) * stepMinutesSaved(s)) / 60,
          realizedHours: (annualExecutions(process) * stepMinutesRealized(s)) / 60
        });
      }
    });
  });
  const cols = ['identified', 'planned', 'in_progress', 'done'];
  const colNames = { identified: 'Identified', planned: 'Planned', in_progress: 'In Progress', done: 'Implemented' };
  const colSummary = cols.map(c => allOpts.filter(o => o.status === c));

  const roiRowsHtml = ranked.length === 0 ? `
    <div style="padding: 32px 8px; text-align: center; color: var(--ink-soft); font-size: 13px;">
      No forecasted savings yet. Mark steps as optimizable and add current/target minutes to see ROI here.
    </div>
  ` : ranked.map(r => `
    <div class="roi-row" onclick="navigate('process', { teamId: '${r.team.id}', processId: '${r.process.id}' })" style="cursor: pointer;">
      <div class="name">
        ${escapeHtml(r.process.name)}
        <span class="team-tag">${escapeHtml(r.team.name)} · ${r.optCount} opt</span>
      </div>
      <div class="hours">${formatHours(r.hours)}/yr</div>
      <div class="dollars">${formatDollars(r.dollars)}/yr</div>
      <div class="roi-bar"><div class="roi-bar-fill" style="width: ${(r.hours / maxHours * 100).toFixed(1)}%"></div></div>
    </div>
  `).join('');

  const sysRowsHtml = sysList.length === 0 ? `
    <div style="padding: 24px 8px; text-align: center; color: var(--ink-soft); font-size: 13px;">
      No system data yet.
    </div>
  ` : sysList.map(s => `
    <div class="system-hot-row">
      <div class="sys">${escapeHtml(s.sys)}</div>
      <div class="count">${s.count}</div>
      <div class="pain-bar"><div class="pain-fill" style="width: ${(s.hours / maxSysHours * 100).toFixed(1)}%"></div></div>
    </div>
  `).join('');

  const colsHtml = cols.map((c, i) => {
    const items = colSummary[i];
    const inner = items.length === 0
      ? `<div class="opt-empty">Nothing here yet.</div>`
      : items.map(o => `
        <div class="opt-card ${c === 'done' ? 'done' : ''}" onclick="navigate('process', { teamId: '${o.team.id}', processId: '${o.process.id}' })">
          <div class="step-name">${escapeHtml(o.step.title)}</div>
          <div class="proc-name">${escapeHtml(o.process.name)} · ${escapeHtml(o.team.name)}</div>
          <div class="savings-tag">
            ${c === 'done' ? '✓ ' + formatHours(o.realizedHours) + ' / yr realized' : formatHours(o.forecastHours) + ' / yr forecast'}
          </div>
        </div>
      `).join('');
    return `
      <div class="opt-col ${c}">
        <div class="opt-col-head">
          <div class="name">${colNames[c]}</div>
          <div class="count">${items.length}</div>
        </div>
        ${inner}
      </div>
    `;
  }).join('');

  return `
    <div class="dash-shell">
      <div class="dash-header">
        <div>
          <div class="section-eyebrow" style="margin-bottom: 8px;">${lbl('dashboardEyebrow')}</div>
          <h1>Dashboard</h1>
          <div class="sub">Forecasted savings, system hotspots, and optimization status across all mapped processes.</div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <label style="font-size: 11px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em;">Loaded labor rate</label>
          <div class="frequency-input">
            <span style="color: var(--ink-soft);">$</span>
            <input type="number" min="0" step="1" value="${state.settings.laborRate}" oninput="updateLaborRate(this.value)" style="width: 70px;" />
            <span style="color: var(--ink-soft); font-size: 12px;">/ hr</span>
          </div>
        </div>
      </div>

      <div class="dash-metrics">
        <div class="dash-metric">
          <div class="label">Processes mapped</div>
          <div class="value">${totalProcesses()}</div>
          <div class="value-sub">${totalSteps()} steps · ${totalOptimizations()} optimizations flagged</div>
        </div>
        <div class="dash-metric savings">
          <div class="label">Forecasted hours / year</div>
          <div class="value">${formatHours(totalForecastHours)}</div>
          <div class="value-sub">If all flagged optimizations land</div>
        </div>
        <div class="dash-metric savings">
          <div class="label">Forecasted $ / year</div>
          <div class="value">${formatDollars(totalForecastDollars)}</div>
          <div class="value-sub">At $${state.settings.laborRate}/hr loaded rate</div>
        </div>
        <div class="dash-metric realized" id="tut-realized">
          <div class="label">Realized so far</div>
          <div class="value">${formatHours(totalRealizedHours)}</div>
          <div class="value-sub">${formatDollars(realizedDollars)} from implemented optimizations</div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="dash-card" id="tut-roi">
          <h3>ROI ranking</h3>
          <div class="card-sub">Processes with the most forecasted savings — click to drill in.</div>
          ${roiRowsHtml}
        </div>
        <div class="dash-card">
          <h3>System hotspots</h3>
          <div class="card-sub">Where the friction concentrates. Bigger bars = more annual hours tied up.</div>
          ${sysRowsHtml}
        </div>
      </div>

      <div class="dash-card" id="tut-kanban">
        <h3>Optimization tracker</h3>
        <div class="card-sub">Move opportunities from idea to impact. Click a card to drill into the process.</div>
        <div class="opt-board">
          ${colsHtml}
        </div>
      </div>
    </div>
  `;
}

function updateLaborRate(v) {
  const n = parseFloat(v);
  if (!isNaN(n) && n >= 0) {
    state.settings.laborRate = n;
    saveState();
    render();
  }
}

/* ==================================================================
   JOURNEY VIEW
   ================================================================== */

let journeyView = { colorBy: 'team', filterTeamId: null };

function renderJourney() {
  const { layout, edges } = computeJourneyLayout();
  const procs = allProcesses();

  // Apply team filter
  const visibleProcs = journeyView.filterTeamId
    ? procs.filter(({ team }) => team.id === journeyView.filterTeamId)
    : procs;

  if (procs.length === 0) {
    return `
      <div class="page-narrow">
        <div class="atlas-hero">
          <div>
            <div class="section-eyebrow">${lbl('journeyEyebrow')}</div>
            <h1 class="atlas-title">No processes mapped yet.</h1>
            <div class="atlas-sub">Add a few processes from the Atlas first, then come back to see how they connect.</div>
          </div>
        </div>
        <div style="padding: 24px;">
          <button class="btn btn-primary" onclick="navigate('atlas')">Go to Atlas</button>
        </div>
      </div>
    `;
  }

  // Layout dimensions
  const COL_W = 280;
  const COL_GAP = 80;
  const ROW_H = 130;
  const ROW_GAP = 24;
  const PAD_X = 40;
  const PAD_Y = 40;

  // Compute SVG canvas size
  let maxCol = 0, maxRowByCol = {};
  Object.values(layout).forEach(({ col, row }) => {
    if (col > maxCol) maxCol = col;
    if (!maxRowByCol[col] || row > maxRowByCol[col]) maxRowByCol[col] = row;
  });
  const totalCols = maxCol + 1;
  const maxRows = Object.values(maxRowByCol).reduce((m, r) => Math.max(m, r), 0) + 1;
  const svgWidth = PAD_X * 2 + totalCols * COL_W + (totalCols - 1) * COL_GAP;
  const svgHeight = PAD_Y * 2 + maxRows * (ROW_H + ROW_GAP);

  // Card position helper
  const cardPos = (procId) => {
    const l = layout[procId];
    if (!l) return null;
    const x = PAD_X + l.col * (COL_W + COL_GAP);
    const y = PAD_Y + l.row * (ROW_H + ROW_GAP);
    return { x, y, cx: x + COL_W / 2, cy: y + ROW_H / 2 };
  };

  // Determine card color based on colorBy mode
  const colorForProc = (team, p) => {
    if (journeyView.colorBy === 'team') return team.color;
    if (journeyView.colorBy === 'forecast') {
      const hrs = processForecastedAnnualMinutes(p) / 60;
      if (hrs >= 200) return '#9d2d2d';
      if (hrs >= 50)  return '#c9961f';
      if (hrs > 0)   return '#5e7d57';
      return '#a89e80';
    }
    if (journeyView.colorBy === 'optimization') {
      const opts = (p.steps || []).filter(s => s.optimizable).length;
      if (opts >= 4) return '#9d2d2d';
      if (opts >= 2) return '#c9961f';
      if (opts >= 1) return '#5e7d57';
      return '#a89e80';
    }
    return team.color;
  };

  // Render edges first (behind cards)
  const edgeSvg = edges.map(e => {
    const fromPos = cardPos(e.from.processId);
    const toPos = cardPos(e.to.processId);
    if (!fromPos || !toPos) return '';
    // Filter check
    if (journeyView.filterTeamId) {
      const fProc = findProcessAnywhere(e.from.processId);
      const tProc = findProcessAnywhere(e.to.processId);
      if (!fProc || !tProc) return '';
      if (fProc.team.id !== journeyView.filterTeamId && tProc.team.id !== journeyView.filterTeamId) return '';
    }
    // Connection points: right edge of from, left edge of to
    const x1 = fromPos.x + COL_W;
    const y1 = fromPos.y + ROW_H / 2;
    const x2 = toPos.x;
    const y2 = toPos.y + ROW_H / 2;
    // Bezier control points for a smooth horizontal flow
    const dx = Math.max(40, (x2 - x1) * 0.45);
    const cp1x = x1 + dx, cp1y = y1;
    const cp2x = x2 - dx, cp2y = y2;
    const path = `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`;

    const isAsync = e.trigger && e.trigger.triggerType === 'async';
    const dash = isAsync ? 'stroke-dasharray="10 6"' : '';
    const stroke = e.trigger ? '#2a3a4d' : '#a89e80';
    const strokeWidth = e.trigger ? 3 : 2;
    const markerEnd = e.trigger ? 'url(#journeyArrow)' : 'url(#journeyArrowMuted)';

    // Edge label
    const handoffLabel = e.trigger ? formatHandoff(e.trigger.handoffTime) : '';
    const labelMidX = (x1 + x2) / 2;
    const labelMidY = (y1 + y2) / 2 - 8;
    const label = handoffLabel ? `
      <g class="journey-edge-label" onclick="openTriggerEdit('${e.from.processId}', '${e.trigger ? e.trigger.id : ''}')" style="cursor: pointer;">
        <rect x="${labelMidX - 28}" y="${labelMidY - 9}" width="56" height="18" rx="9" fill="#fff" stroke="${stroke}" stroke-width="1" />
        <text x="${labelMidX}" y="${labelMidY + 3}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="${stroke}" font-weight="600">${escapeHtml(handoffLabel)}</text>
      </g>
    ` : '';

    const tooltipParts = [];
    if (e.trigger) {
      tooltipParts.push(isAsync ? 'Async' : 'Sync handoff');
      if (e.trigger.initiatedBy) tooltipParts.push('by ' + e.trigger.initiatedBy);
      if (e.trigger.condition) tooltipParts.push(e.trigger.condition);
    } else {
      tooltipParts.push('Sub-process invocation');
    }
    const tooltip = tooltipParts.join(' · ');

    const editHandler = e.trigger
      ? `openTriggerEdit('${e.from.processId}', '${e.trigger.id}')`
      : `navigate('process', { teamId: '${state.teams.find(t=>t.processes.find(p=>p.id===e.from.processId)).id}', processId: '${e.from.processId}' })`;

    return `
      <g class="journey-edge" style="cursor: pointer;" onclick="${editHandler}">
        <title>${escapeHtml(tooltip)}</title>
        <path d="${path}" fill="none" stroke="${stroke}" stroke-width="${strokeWidth}" ${dash} marker-end="${markerEnd}" />
        ${label}
      </g>
    `;
  }).join('');

  // Render cards
  const cardSvg = procs.map(({ team, process: p }) => {
    const pos = cardPos(p.id);
    if (!pos) return '';
    const isFiltered = journeyView.filterTeamId && team.id !== journeyView.filterTeamId;
    if (isFiltered) return ''; // skip
    const accent = colorForProc(team, p);
    const hrs = processForecastedAnnualMinutes(p) / 60;
    const opts = (p.steps || []).filter(s => s.optimizable).length;
    const stepCount = (p.steps || []).length;
    const freq = p.frequency && p.frequency.count > 0
      ? `${p.frequency.count}× / ${p.frequency.period}`
      : '';
    const owner = p.owner ? escapeHtml(p.owner) : 'Unowned';
    const nameLines = wrapText(p.name, 26).slice(0, 2);
    const outgoingCount = (p.triggers || []).length +
      (p.steps || []).filter(s => s.shape === 'subprocess' && s.linkedProcessId).length;
    const incomingCount = edges.filter(e => e.to.processId === p.id).length;

    // + Connect button position (top-right corner of card)
    const btnX = pos.x + COL_W - 30;
    const btnY = pos.y + 11;

    return `
      <g class="journey-card">
        <g onclick="navigate('process', { teamId: '${team.id}', processId: '${p.id}' })" style="cursor: pointer;">
          <rect x="${pos.x}" y="${pos.y}" width="${COL_W}" height="${ROW_H}" rx="10" ry="10"
                fill="#fff" stroke="${accent}" stroke-width="1.75"
                filter="url(#journeyShadow)" />
          <rect x="${pos.x}" y="${pos.y}" width="6" height="${ROW_H}" rx="10" ry="10" fill="${accent}" />
          <rect x="${pos.x + 6}" y="${pos.y}" width="${COL_W - 6}" height="22" fill="${accent}" opacity="0.10" />
          <text x="${pos.x + 14}" y="${pos.y + 15}" font-family="IBM Plex Mono, monospace" font-size="9" fill="${accent}" letter-spacing="0.06em" font-weight="600" text-transform="uppercase">${escapeHtml(team.name.toUpperCase())}</text>
          ${nameLines.map((line, i) => `
            <text x="${pos.x + 14}" y="${pos.y + 42 + i * 17}" font-family="Fraunces, serif" font-size="14" font-weight="600" fill="#0d1b2a">${escapeHtml(line)}</text>
          `).join('')}
          <text x="${pos.x + 14}" y="${pos.y + 80}" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#6b7889">${owner}${freq ? ' · ' + freq : ''}</text>
          <g>
            <text x="${pos.x + 14}" y="${pos.y + ROW_H - 14}" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#6b7889">
              <tspan font-weight="600" fill="#0d1b2a">${stepCount}</tspan> steps
              ${hrs > 0 ? ` · <tspan font-weight="600" fill="#2f6b48">${escapeHtml(formatHours(hrs))}</tspan> forecast` : ''}
              ${opts > 0 ? ` · <tspan font-weight="600" fill="#c9961f">${opts}</tspan> opt` : ''}
            </text>
          </g>
          <text x="${pos.x + COL_W - 14}" y="${pos.y + ROW_H - 14}" text-anchor="end" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#6b7889">
            ${incomingCount > 0 ? `← ${incomingCount} in` : ''}${incomingCount > 0 && outgoingCount > 0 ? '  ·  ' : ''}${outgoingCount > 0 ? `${outgoingCount} out →` : ''}
          </text>
        </g>
        <g class="journey-card-add" onclick="openNewTriggerModal('${p.id}')" style="cursor: pointer;">
          <title>Add a trigger from this process</title>
          <circle cx="${btnX}" cy="${btnY}" r="11" fill="#fff" stroke="${accent}" stroke-width="1.5" />
          <text x="${btnX}" y="${btnY + 4}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="${accent}">+</text>
        </g>
      </g>
    `;
  }).join('');

  // Build team filter dropdown
  const teamFilterOpts = ['<option value="">All teams</option>'].concat(
    state.teams.map(t => `<option value="${t.id}" ${journeyView.filterTeamId === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`)
  ).join('');

  return `
    <div class="page-wide">
      <div class="journey-hero">
        <div>
          <div class="section-eyebrow">${lbl('journeyEyebrow')}</div>
          <h1 class="atlas-title">${lbl('journeyTitle')}</h1>
          <div class="atlas-sub">${lbl('journeySub')}</div>
        </div>
        <div class="journey-controls">
          <div class="journey-control">
            <label>Color by</label>
            <div class="pill-row">
              <button class="pill ${journeyView.colorBy === 'team' ? 'active' : ''}" onclick="setJourneyColorBy('team')">Team</button>
              <button class="pill ${journeyView.colorBy === 'forecast' ? 'active' : ''}" onclick="setJourneyColorBy('forecast')">Forecast hr/yr</button>
              <button class="pill ${journeyView.colorBy === 'optimization' ? 'active' : ''}" onclick="setJourneyColorBy('optimization')">Opt count</button>
            </div>
          </div>
          <div class="journey-control">
            <label>Filter</label>
            <select class="form-select" onchange="setJourneyFilter(this.value)">${teamFilterOpts}</select>
          </div>
        </div>
      </div>

      ${edges.length === 0 && procs.length >= 2 ? `
        <div class="journey-empty-banner">
          <div class="journey-empty-icon">↔</div>
          <div>
            <div class="journey-empty-title">No connections yet.</div>
            <div class="journey-empty-sub">Click the <strong style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1.5px solid #4a5e7a; border-radius: 50%; color: #4a5e7a; font-size: 12px; font-weight: 600;">+</strong> on any process card to add a trigger — that's how processes link into a journey. You can also add triggers from inside a process by going to the <strong>Triggers</strong> tab.</div>
          </div>
        </div>
      ` : ''}

      <div class="journey-canvas-shell" id="tut-journey">
        <div class="journey-canvas-scroll">
          <svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="journeyArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
                <path d="M 0 0 L 12 6 L 0 12 z" fill="#2a3a4d" />
              </marker>
              <marker id="journeyArrowMuted" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 12 6 L 0 12 z" fill="#a89e80" />
              </marker>
              <filter id="journeyShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10" />
              </filter>
            </defs>
            ${edgeSvg}
            ${cardSvg}
          </svg>
        </div>
      </div>

      <div class="journey-legend">
        <div class="journey-legend-item"><span class="journey-legend-line solid"></span> Sync handoff</div>
        <div class="journey-legend-item"><span class="journey-legend-line dashed"></span> Async / fire-and-forget</div>
        <div class="journey-legend-item"><span class="journey-legend-line muted"></span> Sub-process link (no metadata)</div>
        <div class="journey-legend-item" style="margin-left: auto; color: var(--muted);">${edges.length} ${edges.length === 1 ? 'connection' : 'connections'} · ${visibleProcs.length} ${visibleProcs.length === 1 ? 'process' : 'processes'}</div>
      </div>
    </div>
  `;
}

function selectTutorialMode(mode) {
  closeModal();
  tutorialState = { active: true, mode, step: 0 };
  _lockScroll(true);
  const step = TUTORIAL[mode][0];
  if (step.action) step.action();
  setTimeout(() => renderTutorialOverlay(), 150);
}

function tutNext() {
  const steps = TUTORIAL[tutorialState.mode];
  if (tutorialState.step >= steps.length - 1) { exitTutorial(); return; }
  tutorialState.step++;
  const step = steps[tutorialState.step];
  _clearTutorialDom();
  _lockScroll(false);  // unlock so the next step's action can navigate/scroll the canvas
  if (step.action) { step.action(); setTimeout(() => renderTutorialOverlay(), 400); }
  else renderTutorialOverlay();
}

function tutPrev() {
  if (tutorialState.step <= 0) return;
  tutorialState.step--;
  const step = TUTORIAL[tutorialState.mode][tutorialState.step];
  _clearTutorialDom();
  _lockScroll(false);
  if (step.action) { step.action(); setTimeout(() => renderTutorialOverlay(), 400); }
  else renderTutorialOverlay();
}

function exitTutorial() {
  tutorialState = { active: false, mode: null, step: 0 };
  _clearTutorialDom();
  _lockScroll(false);
}

// Lock body scroll during tutorial steps so the spotlighted element stays
// fixed in place. Without this, the user can scroll the page but the spotlight
// stays at fixed coordinates, ending up over empty space.
function _lockScroll(on) {
  if (on) {
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
  }
}

function _clearTutorialDom() {
  ['tutorialSpotlight','tutorialDimmer','tutorialCard'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.remove();
  });
}

function renderTutorialOverlay() {
  _clearTutorialDom();
  if (!tutorialState.active) return;

  const steps = TUTORIAL[tutorialState.mode];
  const step = steps[tutorialState.step];
  const total = steps.length;
  const isFirst = tutorialState.step === 0;
  const isLast = tutorialState.step === total - 1;
  const progress = Math.round((tutorialState.step / (total - 1)) * 100);

  // Unlock briefly so we can scroll the target into view, then re-lock to keep the spotlight static.
  _lockScroll(false);
  const target = step.spotlight ? document.getElementById(step.spotlight) : null;
  if (target) {
    target.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'nearest' });
  } else {
    // No target: just scroll to top so the centered card has clean negative space.
    window.scrollTo(0, 0);
  }
  _lockScroll(true);

  // Spotlight or dimmer (computed after scrollIntoView so coordinates are accurate)
  if (target) {
    const r = target.getBoundingClientRect();
    const pad = 10;
    const spot = document.createElement('div');
    spot.id = 'tutorialSpotlight';
    spot.style.cssText = `position:fixed;top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;border-radius:8px;z-index:9991;pointer-events:none;box-shadow:0 0 0 9999px rgba(13,27,42,0.80),0 0 0 3px #2d6a4f,0 0 0 6px rgba(45,106,79,0.25);transition:all 0.3s ease;`;
    document.body.appendChild(spot);
  } else {
    const dimmer = document.createElement('div');
    dimmer.id = 'tutorialDimmer';
    dimmer.style.cssText = 'position:fixed;inset:0;background:rgba(13,27,42,0.7);z-index:9990;pointer-events:none;';
    document.body.appendChild(dimmer);
  }

  // Card content
  let inner = '';
  if (step.isSummary) {
    inner = `
      <div class="tut-summary">
        <div class="tut-sq" onclick="navigate('dashboard');exitTutorial()">
          <span class="tut-sq-icon">📊</span>
          <div><div class="tut-sq-q">What should I prioritize?</div><div class="tut-sq-a">Dashboard → ROI ranking</div></div>
        </div>
        <div class="tut-sq" onclick="navigate('dashboard');exitTutorial()">
          <span class="tut-sq-icon">✓</span>
          <div><div class="tut-sq-q">What's already working?</div><div class="tut-sq-a">Dashboard → Realized so far</div></div>
        </div>
        <div class="tut-sq" onclick="navigate('journey');exitTutorial()">
          <span class="tut-sq-icon">→</span>
          <div><div class="tut-sq-q">Where does work get stuck?</div><div class="tut-sq-a">Journey → sync handoffs</div></div>
        </div>
      </div>`;
  } else if (step.isDone) {
    inner = `
      <div class="tut-done">
        <div class="tut-done-item">✓ Start with Quick Capture on a process you know</div>
        <div class="tut-done-item">✓ Get the frequency number from the process owner</div>
        <div class="tut-done-item">✓ Happy path first, exceptions second</div>
        <div class="tut-done-item">✓ Flag friction — don't solve it</div>
        <div class="tut-done-item">✓ Add variances for locations that differ</div>
        <div class="tut-done-cta">First capture takes 15 min. By the third, you're under 5.</div>
      </div>`;
  } else {
    inner = `<p class="tut-body">${escapeHtml(step.body)}</p>`;
  }

  const posClass = `tut-pos-${step.pos || 'bottom-right'}`;
  const modeLabel = tutorialState.mode === 'manager' ? 'Evaluating' : 'Capturing';

  const card = document.createElement('div');
  card.id = 'tutorialCard';
  card.className = `tut-card ${posClass}`;
  card.innerHTML = `
    <div class="tut-head">
      <span class="tut-mode-pill">${modeLabel}</span>
      <button class="tut-x" onclick="exitTutorial()" title="Exit">×</button>
    </div>
    <div class="tut-bar"><div class="tut-fill" style="width:${progress}%"></div></div>
    <div class="tut-step-label">Step ${tutorialState.step + 1} of ${total}</div>
    <h3 class="tut-title">${escapeHtml(step.title)}</h3>
    ${inner}
    <div class="tut-foot">
      ${!isFirst ? `<button class="btn btn-sm" style="background:rgba(255,255,255,0.12);color:#f8f4ec;border:1px solid rgba(255,255,255,0.2);" onclick="tutPrev()">← Back</button>` : '<div></div>'}
      ${isLast
        ? `<button class="btn btn-primary btn-sm" onclick="exitTutorial()">Done ✓</button>`
        : `<button class="btn btn-primary btn-sm" onclick="tutNext()">Next →</button>`}
    </div>
  `;
  document.body.appendChild(card);
}

function renderLocationsSettingsSection() {
  const locs = state.locations || [];
  const locsHtml = locs.length === 0
    ? `<div class="insight-empty">No locations yet. Add the first one below.</div>`
    : locs.map((l, i) => `
        <div class="loc-row">
          <input class="loc-input loc-input-code" placeholder="Code" value="${escapeHtml(l.code || '')}" oninput="updateLocation(${i}, 'code', this.value, true)" maxlength="6" />
          <input class="loc-input loc-input-name" placeholder="Location name" value="${escapeHtml(l.name || '')}" oninput="updateLocation(${i}, 'name', this.value, true)" />
          <input class="loc-input loc-input-region" placeholder="Region" value="${escapeHtml(l.region || '')}" oninput="updateLocation(${i}, 'region', this.value, true)" />
          <select class="loc-input loc-input-size" onchange="updateLocation(${i}, 'size', this.value)">
            <option value="">Size...</option>
            <option value="small" ${l.size === 'small' ? 'selected' : ''}>Small</option>
            <option value="medium" ${l.size === 'medium' ? 'selected' : ''}>Medium</option>
            <option value="large" ${l.size === 'large' ? 'selected' : ''}>Large</option>
          </select>
          <button class="lane-row-remove" onclick="removeLocation(${i})">×</button>
        </div>
      `).join('');
  return `
    <div class="settings-section settings-locations-section">
      <div class="settings-section-head">
        <div class="settings-section-title">Locations <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted-soft); letter-spacing: 0.06em; margin-left: 8px;">${locs.length} TOTAL</span></div>
        <div class="settings-section-sub">Sites where these processes run. Variances captured per step reference these locations. Add or edit anytime — changes save automatically.</div>
      </div>
      <div class="loc-rows">${locsHtml}</div>
      <button class="task-add" onclick="addLocation()">+ Add location</button>
    </div>
  `;
}

function addLocation() {
  if (!Array.isArray(state.locations)) state.locations = [];
  state.locations.push({
    id: uid('loc'),
    name: '',
    code: '',
    region: '',
    size: '',
    hrLead: '',
    notes: '',
    createdAt: nowISO()
  });
  saveState();
  // Re-open the modal to refresh the list
  closeModal();
  setTimeout(() => openSettingsModal(), 50);
}

function updateLocation(idx, key, val, skipReopen) {
  if (!state.locations || !state.locations[idx]) return;
  state.locations[idx][key] = val;
  saveState();
  if (!skipReopen) {
    closeModal();
    setTimeout(() => openSettingsModal(), 50);
  }
}

function removeLocation(idx) {
  if (!state.locations || !state.locations[idx]) return;
  const loc = state.locations[idx];
  if (!confirm(`Remove location "${loc.name || loc.code || 'unnamed'}"? Variances referencing this location will keep their other locations but lose this one.`)) return;
  state.locations.splice(idx, 1);
  // Strip this location from any variances that reference it
  state.teams.forEach(t => t.processes.forEach(p => p.steps.forEach(s => {
    (s.variances || []).forEach(v => {
      v.locationIds = (v.locationIds || []).filter(lid => lid !== loc.id);
    });
  })));
  saveState();
  closeModal();
  setTimeout(() => openSettingsModal(), 50);
}

function openSettingsModal() {
  const overrides = (state.settings && state.settings.labels) || {};

  const sectionsHtml = SETTINGS_SECTIONS.map((sec, secIdx) => {
    const fieldsHtml = sec.fields.map(f => {
      const currentVal = overrides[f.key] != null ? overrides[f.key] : '';
      const defaultVal = LABELS_DEFAULTS[f.key] || '';
      const inputId = 'lbl_' + f.key;
      const showResetBtn = currentVal !== '' && currentVal !== defaultVal;
      return `
        <div class="settings-field">
          <div class="settings-field-head">
            <label for="${inputId}">${escapeHtml(f.label)}</label>
            ${showResetBtn ? `<button type="button" class="settings-reset-link" onclick="settingsResetField('${f.key}')">Reset to default</button>` : ''}
          </div>
          ${f.type === 'textarea'
            ? `<textarea id="${inputId}" class="settings-input" rows="3" placeholder="${escapeHtml(defaultVal)}">${escapeHtml(currentVal)}</textarea>`
            : `<input id="${inputId}" type="text" class="settings-input" value="${escapeHtml(currentVal)}" placeholder="${escapeHtml(defaultVal)}" />`}
          ${f.help ? `<div class="settings-help">${f.help}</div>` : ''}
          <div class="settings-default-preview">Default: <code>${escapeHtml(defaultVal)}</code></div>
        </div>
      `;
    }).join('');
    return `
      <div class="settings-section">
        <div class="settings-section-head">
          <div class="settings-section-title">${escapeHtml(sec.title)}</div>
          <div class="settings-section-sub">${escapeHtml(sec.subtitle)}</div>
        </div>
        ${fieldsHtml}
      </div>
    `;
  }).join('');

  showModal({
    title: 'Settings & branding',
    size: 'large',
    body: `
      <div class="settings-intro">
        Manage locations and customize labels throughout the tool.
      </div>
      <div class="settings-body">
        ${renderLocationsSettingsSection()}
        ${sectionsHtml}
      </div>
    `,
    actions: [
      { label: 'Reset all to defaults', class: 'btn-secondary', onClick: () => {
        if (!confirm('Clear all label overrides and restore defaults? Your processes and data are not affected.')) return;
        state.settings.labels = {};
        saveState(); closeModal(); render();
        toast('All labels reset to defaults');
      }},
      { label: 'Cancel', class: 'btn-secondary', onClick: closeModal },
      { label: 'Save', class: 'btn-primary', onClick: () => {
        const newLabels = {};
        SETTINGS_SECTIONS.forEach(sec => {
          sec.fields.forEach(f => {
            const el = document.getElementById('lbl_' + f.key);
            if (!el) return;
            const v = el.value;
            // Only store overrides that differ from default (and aren't empty)
            if (v && v !== LABELS_DEFAULTS[f.key]) {
              newLabels[f.key] = v;
            }
          });
        });
        state.settings.labels = newLabels;
        saveState(); closeModal(); render();
        toast('Labels saved');
      }}
    ]
  });
}

function settingsResetField(key) {
  // Just clear the input — the actual reset happens on Save
  const el = document.getElementById('lbl_' + key);
  if (el) {
    el.value = '';
    el.focus();
  }
  // Hide the reset link since the field now matches default
  const link = el && el.parentElement && el.parentElement.querySelector('.settings-reset-link');
  if (link) link.style.display = 'none';
}

function openNewTriggerModal(fromProcessId) {
  // Stop any bubbling
  if (typeof event !== 'undefined' && event && event.stopPropagation) event.stopPropagation();

  const found = findProcessAnywhere(fromProcessId);
  if (!found) return;
  const fromProc = found.process;

  // Build target options (exclude self)
  const targetOptions = ['<option value="">— Pick a target process —</option>'].concat(
    state.teams.flatMap(t => t.processes
      .filter(pp => pp.id !== fromProcessId)
      .map(pp => `<option value="${pp.id}">${escapeHtml(t.name)} / ${escapeHtml(pp.name)}</option>`))
  ).join('');

  showModal({
    title: 'New trigger',
    body: `
      <div style="font-size: 13px; color: var(--ink); margin-bottom: 18px; padding: 12px 14px; background: var(--bg-soft); border-radius: 8px; border-left: 3px solid ${found.team.color};">
        From <strong>${escapeHtml(fromProc.name)}</strong> (${escapeHtml(found.team.name)}) → <strong>?</strong>
      </div>
      <div class="form-row">
        <label class="form-label">Target process <span style="color: var(--exception);">*</span></label>
        <select id="newTrigTarget" class="form-select" style="width: 100%;">
          ${targetOptions}
        </select>
        <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">What process does this kick off?</div>
      </div>
      <div class="form-row">
        <label class="form-label">Trigger type</label>
        <select id="newTrigType" class="form-select" style="width: 100%;">
          <option value="sync">Sync (work pauses until target completes)</option>
          <option value="async">Async (fire-and-forget)</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Initiated by <span style="color: var(--muted); font-weight: 400;">(optional)</span></label>
        <input id="newTrigInit" class="form-input" type="text" placeholder="e.g. HR Coord, Manager, System" />
      </div>
      <div class="form-row">
        <label class="form-label">Trigger condition <span style="color: var(--muted); font-weight: 400;">(optional)</span></label>
        <textarea id="newTrigCond" class="form-textarea" placeholder="When does this fire? e.g. 'After post-orientation step completes'"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">Average wait / handoff time</label>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input id="newTrigHoVal" class="form-input" type="number" min="0" step="0.5" value="0" style="max-width: 100px;" />
          <select id="newTrigHoUnit" class="form-select">
            <option value="min">minutes</option>
            <option value="hour">hours</option>
            <option value="day" selected>days</option>
          </select>
        </div>
        <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">Time between this process completing and the target picking up. Counts toward total lead time.</div>
      </div>
    `,
    actions: [
      { label: 'Cancel', class: 'btn-secondary', onClick: closeModal },
      { label: 'Create trigger', class: 'btn-primary', onClick: () => {
        const targetId = document.getElementById('newTrigTarget').value;
        if (!targetId) { alert('Pick a target process first.'); return; }
        if (fromProc.triggers && fromProc.triggers.some(tg => tg.toProcessId === targetId)) {
          alert('A trigger to that process already exists.'); return;
        }
        if (!Array.isArray(fromProc.triggers)) fromProc.triggers = [];
        fromProc.triggers.push({
          id: uidTrigger(),
          toProcessId: targetId,
          triggerType: document.getElementById('newTrigType').value,
          initiatedBy: document.getElementById('newTrigInit').value.trim(),
          condition: document.getElementById('newTrigCond').value.trim(),
          handoffTime: {
            value: Math.max(0, parseFloat(document.getElementById('newTrigHoVal').value) || 0),
            unit: document.getElementById('newTrigHoUnit').value
          },
          failureMode: '',
          createdAt: nowISO()
        });
        fromProc.updatedAt = nowISO();
        saveState(); closeModal(); render();
        toast('Trigger created');
      }}
    ]
  });
}

function openTriggerEdit(processId, triggerId) {
  if (!triggerId) return;
  const found = findProcessAnywhere(processId);
  if (!found) return;
  const tg = (found.process.triggers || []).find(x => x.id === triggerId);
  if (!tg) return;
  const tgt = findProcessAnywhere(tg.toProcessId);
  const tgtLabel = tgt ? `${tgt.team.name} / ${tgt.process.name}` : '(target deleted)';

  showModal({
    title: 'Edit trigger',
    body: `
      <div style="font-size: 12px; color: var(--muted); margin-bottom: 16px;">

      <div class="form-row">
        <label class="form-label">Initiated by</label>
        <input id="editTrigInit" class="form-input" type="text" value="${escapeHtml(tg.initiatedBy || '')}" placeholder="e.g. HR Coord" />
      </div>
      <div class="form-row">
        <label class="form-label">Trigger condition</label>
        <textarea id="editTrigCond" class="form-textarea" placeholder="When does this fire?">${escapeHtml(tg.condition || '')}</textarea>
      </div>
      <div class="form-row">
        <label class="form-label">Average wait / handoff time</label>
        <div style="display: flex; gap: 8px;">
          <input id="editTrigHoVal" class="form-input" type="number" min="0" step="0.5" value="${tg.handoffTime ? tg.handoffTime.value : 0}" style="max-width: 100px;" />
          <select id="editTrigHoUnit" class="form-select">
            <option value="min" ${tg.handoffTime && tg.handoffTime.unit === 'min' ? 'selected' : ''}>minutes</option>
            <option value="hour" ${tg.handoffTime && tg.handoffTime.unit === 'hour' ? 'selected' : ''}>hours</option>
            <option value="day" ${tg.handoffTime && tg.handoffTime.unit === 'day' ? 'selected' : ''}>days</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Failure mode</label>
        <textarea id="editTrigFail" class="form-textarea" placeholder="What goes wrong here?">${escapeHtml(tg.failureMode || '')}</textarea>
      </div>
    `,
    actions: [
      { label: 'Delete trigger', class: 'btn-danger', onClick: () => {
        if (!confirm('Remove this trigger?')) return;
        found.process.triggers = (found.process.triggers || []).filter(x => x.id !== triggerId);
        found.process.updatedAt = nowISO();
        saveState(); closeModal(); render();
        toast('Trigger removed');
      }},
      { label: 'Cancel', class: 'btn-secondary', onClick: closeModal },
      { label: 'Save', class: 'btn-primary', onClick: () => {
        tg.triggerType = document.getElementById('editTrigType').value;
        tg.initiatedBy = document.getElementById('editTrigInit').value.trim();
        tg.condition = document.getElementById('editTrigCond').value.trim();
        tg.handoffTime = {
          value: Math.max(0, parseFloat(document.getElementById('editTrigHoVal').value) || 0),
          unit: document.getElementById('editTrigHoUnit').value
        };
        tg.failureMode = document.getElementById('editTrigFail').value.trim();
        found.process.updatedAt = nowISO();
        saveState(); closeModal(); render();
        toast('Trigger updated');
      }}
    ]
  });
}

/* ==================================================================
   WIZARD VIEW
   ================================================================== */

function startWizard(opts = {}) {
  wizard = {
    step: 1,
    totalSteps: 5,
    data: {
      name: '',
      owner: '',
      teamId: opts.teamId || (state.teams[0] && state.teams[0].id) || null,
      description: '',
      parentProcessId: null,
      frequency: { count: 1, period: 'week' },
      lanes: [],
      steps: []
    }
  };
  view.name = 'wizard';
  render();
}

function wizardSetStep(n) {
  if (!wizard) return;
  if (n < 1) n = 1;
  if (n > wizard.totalSteps) n = wizard.totalSteps;
  wizard.step = n;
  window.scrollTo(0, 0);
  render();
}
function wizardCancel() {
  if (!confirm('Discard this capture?')) return;
  wizard = null;
  navigate('atlas');
}

// ---- wizard data updaters ----
function wzSet(key, val, skipRender = false) {
  wizard.data[key] = val;
  if (!skipRender) renderWizardOnly();
  else renderWizardActions();
}

// Bulletproof text-input handler: updates state + lightly toggles Next button.
// All DOM ops wrapped in try/catch so a transient error never breaks typing.
function wzText(key, val) {
  if (!wizard) return;
  wizard.data[key] = val;
  try {
    const btn = document.getElementById('wizardNextBtn');
    if (!btn) return;
    const can = !!wizardCanAdvance(wizard.step);
    if (btn.disabled !== !can) {
      btn.disabled = !can;
      btn.classList.toggle('btn-disabled', !can);
    }
  } catch (e) { /* never let validation crash typing */ }
}
function wzSetFreq(key, val, skipRender = false) {
  wizard.data.frequency[key] = key === 'count' ? Math.max(0, parseFloat(val) || 0) : val;
  if (!skipRender) renderWizardOnly();
  else renderWizardActions();
}
function wzAddLane() {
  const colors = ['#4a5e7a', '#5e7d57', '#b58c3a', '#b3543b', '#7a4f6e', '#3a6d6e'];
  const idx = wizard.data.lanes.length;
  wizard.data.lanes.push({
    tempId: 'wlane_' + Date.now() + '_' + idx,
    name: '',
    color: colors[idx % colors.length]
  });
  renderWizardOnly();
}
function wzUpdateLane(tid, key, val) {
  const l = wizard.data.lanes.find(x => x.tempId === tid);
  if (!l) return;
  l[key] = val;
}
function wzRemoveLane(tid) {
  wizard.data.lanes = wizard.data.lanes.filter(x => x.tempId !== tid);
  // Unassign steps that pointed to it
  wizard.data.steps.forEach(s => { if (s.laneTid === tid) s.laneTid = null; });
  renderWizardOnly();
}
function wzAddStep() {
  const idx = wizard.data.steps.length;
  wizard.data.steps.push({
    tempId: 'wstep_' + Date.now() + '_' + idx,
    title: '',
    laneTid: wizard.data.lanes[0] ? wizard.data.lanes[0].tempId : null,
    type: 'happy',
    shape: 'step',
    system: '',
    optimizable: false,
    optimizationNote: '',
    currentMinutes: 0,
    targetMinutes: 0
  });
  renderWizardOnly();
}
function wzUpdateStep(tid, key, val) {
  const s = wizard.data.steps.find(x => x.tempId === tid);
  if (!s) return;
  if (key === 'currentMinutes' || key === 'targetMinutes') val = Math.max(0, parseFloat(val) || 0);
  if (key === 'optimizable') val = !!val;
  s[key] = val;
}
function wzRemoveStep(tid) {
  wizard.data.steps = wizard.data.steps.filter(x => x.tempId !== tid);
  renderWizardOnly();
}
function wzMoveStep(tid, dir) {
  const arr = wizard.data.steps;
  const i = arr.findIndex(x => x.tempId === tid);
  if (i < 0) return;
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderWizardOnly();
}

function renderWizardOnly() {
  const root = document.getElementById('app');
  if (root) root.innerHTML = renderWizard();
}

// ---- wizard rendering ----
function renderWizard() {
  if (!wizard) return '';
  const { step, totalSteps, data } = wizard;
  const stepLabels = ['Set the scene', 'The cast', 'The story', 'The friction', 'Review & launch'];

  const pipsHtml = stepLabels.map((_, i) => {
    const cls = i + 1 < step ? 'done' : (i + 1 === step ? 'current' : '');
    return `<div class="pip ${cls}"></div>`;
  }).join('');

  let bodyHtml = '';
  if (step === 1) bodyHtml = renderWizardStep1();
  else if (step === 2) bodyHtml = renderWizardStep2();
  else if (step === 3) bodyHtml = renderWizardStep3();
  else if (step === 4) bodyHtml = renderWizardStep4();
  else bodyHtml = renderWizardStep5();

  const canAdvance = wizardCanAdvance(step);

  return `
    <div class="wizard-shell">
      <div class="wizard-progress">${pipsHtml}</div>
      <div class="wizard-step-label">Step ${step} of ${totalSteps} — ${stepLabels[step - 1]}</div>
      ${bodyHtml}
      <div class="wizard-actions">
        <div>
          <button class="btn btn-secondary btn-sm" onclick="wizardCancel()">Cancel</button>
        </div>
        <div style="display: flex; gap: 8px;">
          ${step > 1 ? `<button class="btn btn-secondary btn-sm" onclick="wizardSetStep(${step - 1})">← Back</button>` : ''}
          ${step < totalSteps
            ? `<button id="wizardNextBtn" class="btn btn-primary btn-sm ${canAdvance ? '' : 'btn-disabled'}" ${canAdvance ? '' : 'disabled'} onclick="if (!this.disabled) wizardSetStep(${step + 1})">Next →</button>`
            : `<button id="wizardNextBtn" class="btn btn-primary btn-sm" onclick="wizardFinish()">Build it →</button>`}
        </div>
      </div>
    </div>
  `;
}

function wizardCanAdvance(step) {
  const d = wizard.data;
  if (step === 1) return d.name.trim().length > 0 && d.teamId;
  if (step === 2) return d.lanes.length >= 1 && d.lanes.every(l => l.name.trim().length > 0);
  if (step === 3) return d.steps.length >= 2 && d.steps.every(s => s.title.trim().length > 0 && s.laneTid);
  if (step === 4) return true;
  return true;
}

function renderWizardStep1() {
  const d = wizard.data;
  const teamOptions = state.teams.map(t =>
    `<option value="${t.id}" ${t.id === d.teamId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('');

  // Parent process options — exclude none yet
  const parentOptions = ['<option value="">— None (top-level process) —</option>'].concat(
    state.teams.flatMap(t => t.processes.map(p =>
      `<option value="${p.id}" ${p.id === d.parentProcessId ? 'selected' : ''}>${escapeHtml(t.name)} / ${escapeHtml(p.name)}</option>`))
  ).join('');

  return `
    <h1 class="wizard-title">Set the scene.</h1>
    <p class="wizard-lede">Tell us what you're mapping. We'll use this to build the right framing — and surface this process correctly in the Atlas and dashboard.</p>

    <div class="wizard-card">
      <div class="wizard-row full">
        <div>
          <label>Process name *</label>
          <input type="text" value="${escapeHtml(d.name)}" placeholder="e.g., New Hire Onboarding" oninput="wzText('name', this.value)" />
        </div>
      </div>
      <div class="wizard-row">
        <div>
          <label>Team *</label>
          <select onchange="wzText('teamId', this.value)">${teamOptions}</select>
        </div>
        <div>
          <label>Process owner</label>
          <input type="text" value="${escapeHtml(d.owner)}" placeholder="Your name or role" oninput="wzText('owner', this.value)" />
        </div>
      </div>
      <div class="wizard-row full">
        <div>
          <label>Short description</label>
          <input type="text" value="${escapeHtml(d.description)}" placeholder="One sentence — what does this process do?" oninput="wzText('description', this.value)" />
        </div>
      </div>

      <div class="wizard-coach">
        <div class="coach-icon">💡</div>
        <div><strong>Pick the most specific team.</strong> If this process spans teams, pick the one that owns it. You can always change this later.</div>
      </div>

      <div class="wizard-row" id="tut-wizard-freq">
        <div>
          <label>Part of a larger process?</label>
          <select onchange="wizard.data.parentProcessId = this.value || null">${parentOptions}</select>
        </div>
        <div>
          <label>How often does this run?</label>
          <div class="frequency-input">
            <input type="number" min="0" value="${d.frequency.count}" oninput="wzSetFreq('count', this.value)" />
            <span style="color: var(--ink-soft); font-size: 12px;">times per</span>
            <select onchange="wzSetFreq('period', this.value)">
              <option value="day" ${d.frequency.period === 'day' ? 'selected' : ''}>day</option>
              <option value="week" ${d.frequency.period === 'week' ? 'selected' : ''}>week</option>
              <option value="month" ${d.frequency.period === 'month' ? 'selected' : ''}>month</option>
              <option value="quarter" ${d.frequency.period === 'quarter' ? 'selected' : ''}>quarter</option>
              <option value="year" ${d.frequency.period === 'year' ? 'selected' : ''}>year</option>
            </select>
          </div>
        </div>
      </div>

      <div class="wizard-coach">
        <div class="coach-icon">⏱</div>
        <div><strong>Frequency matters for ROI.</strong> A 10-minute step that runs 100 times a month is bigger ROI than a 2-hour step that runs once a year. Rough estimates are fine — round to the nearest realistic number.</div>
      </div>
    </div>
  `;
}

function renderWizardStep2() {
  const d = wizard.data;
  const colors = ['#4a5e7a', '#5e7d57', '#b58c3a', '#b3543b', '#7a4f6e', '#3a6d6e'];
  const lanesHtml = d.lanes.map((l, i) => `
    <div class="wizard-lane-row">
      <div style="width: 22px; height: 22px; border-radius: 4px; background: ${l.color};"></div>
      <input type="text" value="${escapeHtml(l.name)}" placeholder="e.g., HR Coord, IT, Manager"
        oninput="wzUpdateLane('${l.tempId}', 'name', this.value)" />
      <select onchange="wzUpdateLane('${l.tempId}', 'color', this.value); renderWizardOnly()">
        ${colors.map(c => `<option value="${c}" ${c === l.color ? 'selected' : ''} style="background:${c}">${c}</option>`).join('')}
      </select>
      <button class="wizard-tiny-x" onclick="wzRemoveLane('${l.tempId}')">×</button>
    </div>
  `).join('');

  let feedback = '';
  const n = d.lanes.length;
  if (n === 0) feedback = `<div class="wizard-feedback alert">Add at least 1 lane to continue</div>`;
  else if (n === 1) feedback = `<div class="wizard-feedback warn">Just 1 lane — that's fine, but most processes have 2+</div>`;
  else if (n <= 4) feedback = `<div class="wizard-feedback good">✓ ${n} lanes — healthy range</div>`;
  else if (n === 5) feedback = `<div class="wizard-feedback warn">${n} lanes — getting wide. Still workable.</div>`;
  else feedback = `<div class="wizard-feedback alert">${n} lanes — consider whether this is actually multiple processes</div>`;

  return `
    <h1 class="wizard-title">Who's involved?</h1>
    <p class="wizard-lede">Lanes are the roles, teams, or systems that take part in this process. Each step will live in one lane.</p>

    <div class="wizard-card" id="tut-wizard-lanes">
      <label>Lanes</label>
      <div class="wizard-lane-list">${lanesHtml || '<div style="color: var(--ink-soft); font-size: 13px; padding: 8px 0;">No lanes yet — add the first one below.</div>'}</div>
      <button class="wizard-add-btn" onclick="wzAddLane()">+ Add lane</button>
      ${feedback}

      <div class="wizard-coach">
        <div class="coach-icon">💡</div>
        <div><strong>Sweet spot is 2–4 lanes.</strong> Too few and the handoffs aren't visible. Too many and the diagram gets unreadable — that's usually a sign you're trying to map multiple processes at once. If you hit 6+, consider whether some of those lanes are <em>doing</em> different processes vs. participating in this one.</div>
      </div>

      <div class="wizard-coach">
        <div class="coach-icon">📋</div>
        <div><strong>Examples:</strong> For New Hire Onboarding: HR Coord, IT, Manager. For a Comp Change: Manager, HRBP, Comp Team, Payroll. For a Position Request: Hiring Manager, HRBP, Finance, Talent Acquisition.</div>
      </div>
    </div>
  `;
}

function renderWizardStep3() {
  const d = wizard.data;
  const laneOpts = d.lanes.map(l =>
    `<option value="${l.tempId}">${escapeHtml(l.name || 'Untitled lane')}</option>`).join('');

  const stepsHtml = d.steps.map((s, i) => `
    <div class="wizard-step-row">
      <div class="num">${i + 1}</div>
      <input type="text" value="${escapeHtml(s.title)}" placeholder="e.g., Provision system access"
        oninput="wzUpdateStep('${s.tempId}', 'title', this.value)" />
      <select onchange="wzUpdateStep('${s.tempId}', 'laneTid', this.value); renderWizardOnly()">
        ${d.lanes.map(l => `<option value="${l.tempId}" ${s.laneTid === l.tempId ? 'selected' : ''}>${escapeHtml(l.name || 'Untitled')}</option>`).join('')}
      </select>
      <select onchange="wzUpdateStep('${s.tempId}', 'shape', this.value); renderWizardOnly()">
        <option value="start" ${s.shape === 'start' ? 'selected' : ''}>Start</option>
        <option value="step" ${s.shape === 'step' ? 'selected' : ''}>Step</option>
        <option value="decision" ${s.shape === 'decision' ? 'selected' : ''}>Decision</option>
        <option value="subprocess" ${s.shape === 'subprocess' ? 'selected' : ''}>Sub-process</option>
        <option value="end" ${s.shape === 'end' ? 'selected' : ''}>End</option>
      </select>
      <select onchange="wzUpdateStep('${s.tempId}', 'type', this.value); renderWizardOnly()">
        <option value="happy" ${s.type === 'happy' ? 'selected' : ''}>Happy</option>
        <option value="exception" ${s.type === 'exception' ? 'selected' : ''}>Exception</option>
      </select>
      <button class="wizard-tiny-x" onclick="wzRemoveStep('${s.tempId}')">×</button>
    </div>
  `).join('');

  let feedback = '';
  const n = d.steps.length;
  if (n < 2) feedback = `<div class="wizard-feedback alert">Add at least 2 steps to continue</div>`;
  else if (n < 5) feedback = `<div class="wizard-feedback warn">${n} steps — fine for a quick sketch, you might want more detail</div>`;
  else if (n <= 12) feedback = `<div class="wizard-feedback good">✓ ${n} steps — sweet spot</div>`;
  else if (n <= 15) feedback = `<div class="wizard-feedback warn">${n} steps — getting long, but workable</div>`;
  else feedback = `<div class="wizard-feedback alert">${n} steps — consider breaking into a parent process + sub-processes</div>`;

  return `
    <h1 class="wizard-title">What happens?</h1>
    <p class="wizard-lede">Brain-dump the steps in order. Don't worry about getting it perfect — you'll refine in the editor. Just get them down.</p>

    <div class="wizard-card">
      <div class="wizard-step-list">
        ${d.steps.length > 0 ? `
          <div class="wizard-step-row" style="background: transparent; border: none; padding: 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);">
            <div>#</div>
            <div>Title</div>
            <div>Lane</div>
            <div>Shape</div>
            <div>Type</div>
            <div></div>
          </div>
        ` : ''}
        ${stepsHtml || '<div style="color: var(--ink-soft); font-size: 13px; padding: 8px 0;">No steps yet — add the first one below.</div>'}
      </div>
      <button class="wizard-add-btn" onclick="wzAddStep()">+ Add step</button>
      ${feedback}

      <div class="wizard-coach">
        <div class="coach-icon">🎯</div>
        <div><strong>Aim for 5–12 steps.</strong> If you go below 5, you're probably skipping handoffs that matter. If you go above 15, you're probably trying to map a parent process + its sub-processes at the same time. Use the <em>Sub-process</em> shape to point at a separate process you'll map next.</div>
      </div>

        <div class="coach-icon">🔀</div>

      </div>
    </div>
  `;
}

function renderWizardStep4() {
  const d = wizard.data;
  const optSteps = d.steps.filter(s => s.optimizable);
  const totalForecastMin = optSteps.reduce((a, s) => a + Math.max(0, s.currentMinutes - s.targetMinutes), 0);
  const annualExec = (d.frequency.count || 0) * (PERIOD_TO_YEAR[d.frequency.period] || 1);
  const totalForecastHours = (totalForecastMin * annualExec) / 60;
  const team = state.teams.find(t => t.id === d.teamId);
  const rate = laborRateForTeam(team);
  const totalForecastDollars = totalForecastHours * rate;

  const stepsHtml = d.steps.map((s, i) => {
    const lane = d.lanes.find(l => l.tempId === s.laneTid);
    const minSaved = Math.max(0, s.currentMinutes - s.targetMinutes);
    const yrHours = (minSaved * annualExec) / 60;
    return `
      <div class="wizard-step-row" style="grid-template-columns: 24px 1fr 110px 80px 80px 80px;">
        <div class="num">${i + 1}</div>
        <div>
          <div style="font-weight: 500; color: var(--ink); font-size: 13px;">${escapeHtml(s.title || '(untitled)')}</div>
          <div style="font-size: 11px; color: var(--ink-soft); margin-top: 2px;">${escapeHtml(lane ? lane.name : '')}</div>
        </div>
        <input type="text" value="${escapeHtml(s.system)}" placeholder="System" oninput="wzUpdateStep('${s.tempId}', 'system', this.value)" />
        <input type="number" min="0" value="${s.currentMinutes}" placeholder="now (min)" title="Current minutes per execution"
          oninput="wzUpdateStep('${s.tempId}', 'currentMinutes', this.value); renderWizardOnly()" />
        <input type="number" min="0" value="${s.targetMinutes}" placeholder="goal (min)" title="Target minutes after optimization"
          oninput="wzUpdateStep('${s.tempId}', 'targetMinutes', this.value); renderWizardOnly()" />
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: ${s.optimizable ? '#8a6520' : 'var(--ink-soft)'};">
          <input type="checkbox" ${s.optimizable ? 'checked' : ''} onchange="wzUpdateStep('${s.tempId}', 'optimizable', this.checked); renderWizardOnly()" />
          ${s.optimizable && yrHours > 0 ? '<strong>' + formatHours(yrHours) + '/yr</strong>' : 'flag'}
        </label>
      </div>
      ${s.optimizable ? `
        <div style="padding: 8px 12px 14px; margin-top: -6px; margin-bottom: 8px; background: #fdf6ea; border: 1px solid #e0c890; border-top: none; border-radius: 0 0 6px 6px;">
          <textarea rows="2" placeholder="What's the problem? What's the optimization idea? (e.g., 'Manual ticket today — could be auto-provisioned from Workday')" style="width: 100%; font-size: 12px;" oninput="wzUpdateStep('${s.tempId}', 'optimizationNote', this.value)">${escapeHtml(s.optimizationNote)}</textarea>
        </div>
      ` : ''}
    `;
  }).join('');

  const flagged = optSteps.length;
  let feedback = '';
  if (flagged === 0) feedback = `<div class="wizard-feedback warn">No optimizations flagged yet — that's OK, you can still map without flagging</div>`;
  else if (flagged <= 3) feedback = `<div class="wizard-feedback good">✓ ${flagged} ${flagged === 1 ? 'opportunity' : 'opportunities'} flagged</div>`;
  else feedback = `<div class="wizard-feedback warn">${flagged} flagged — focus is good. Top 1–3 will get the most traction.</div>`;

  return `
    <h1 class="wizard-title">Where's the friction?</h1>
    <p class="wizard-lede">For each step, capture the system used and how long it takes today. Then flag the ones that are broken — and estimate how long they <em>should</em> take.</p>

    <div class="wizard-card">
      <div class="wizard-step-row" style="grid-template-columns: 24px 1fr 110px 80px 80px 80px; background: transparent; border: none; padding: 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);">
        <div>#</div>
        <div>Step</div>
        <div>System</div>
        <div>Now (min)</div>
        <div>Goal (min)</div>
        <div>Flag?</div>
      </div>
      <div class="wizard-step-list" style="gap: 0;">
        ${stepsHtml}
      </div>
      ${feedback}

      ${totalForecastHours > 0 ? `
        <div class="savings-callout">
          <span class="big">${formatHours(totalForecastHours)}</span> per year forecasted savings
          (≈ ${formatDollars(totalForecastDollars)} at $${rate}/hr loaded rate). This is the upside if all flagged optimizations land at their target time.
        </div>
      ` : ''}

      <div class="wizard-coach">
        <div class="coach-icon">🧭</div>
        <div><strong>Don't flag everything.</strong> Real Lean discipline = pick the 1–3 steps where the gap between current and target is biggest, and where the change is feasible. Everything else can stay marked as "current-state acceptable."</div>
      </div>

      <div class="wizard-coach">
        <div class="coach-icon">📐</div>

function renderWizardStep5() {
  const d = wizard.data;
  const team = state.teams.find(t => t.id === d.teamId);
  const optSteps = d.steps.filter(s => s.optimizable);
  const totalForecastMin = optSteps.reduce((a, s) => a + Math.max(0, s.currentMinutes - s.targetMinutes), 0);
  const annualExec = (d.frequency.count || 0) * (PERIOD_TO_YEAR[d.frequency.period] || 1);
  const totalForecastHours = (totalForecastMin * annualExec) / 60;
  const rate = laborRateForTeam(team);
  const totalForecastDollars = totalForecastHours * rate;

  const parentName = d.parentProcessId ? (() => {
    const p = findProcessAnywhere(d.parentProcessId);
    return p ? p.process.name : '';
  })() : '';

  return `
    <h1 class="wizard-title">Looking good. Ready to ship?</h1>
    <p class="wizard-lede">Quick review of what you've captured. When you click <em>Build it</em>, we'll create the process, lay out the swimlane diagram, and drop you into the full editor where you can refine connections, add notes, and adjust branching.</p>

    <div class="wizard-card">
      <h3 style="font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; margin: 0 0 4px;">${escapeHtml(d.name || '(untitled process)')}</h3>
      <div style="font-size: 12px; color: var(--ink-soft); margin-bottom: 14px;">
        ${escapeHtml(team ? team.name : '')} ${d.owner ? '· ' + escapeHtml(d.owner) : ''}
        ${parentName ? '· part of <strong>' + escapeHtml(parentName) + '</strong>' : ''}
      </div>
      ${d.description ? `<p style="font-size: 13px; color: var(--ink); margin: 0 0 14px;">${escapeHtml(d.description)}</p>` : ''}

      <div class="wizard-review-grid">
        <div class="wizard-review-stat">
          <div class="label">Lanes</div>
          <div class="value">${d.lanes.length}</div>
        </div>
        <div class="wizard-review-stat">
          <div class="label">Steps</div>
          <div class="value">${d.steps.length}</div>
          <div class="value-sub">${d.steps.filter(s => s.shape === 'decision').length} decisions · ${d.steps.filter(s => s.type === 'exception').length} exceptions</div>
        </div>
        <div class="wizard-review-stat">
          <div class="label">Optimizations</div>
          <div class="value">${optSteps.length}</div>
        </div>
        <div class="wizard-review-stat savings">
          <div class="label">Forecast / year</div>
          <div class="value">${formatHours(totalForecastHours)}</div>
          <div class="value-sub">${formatDollars(totalForecastDollars)} @ $${rate}/hr</div>
        </div>
      </div>

      <div style="font-size: 12px; color: var(--ink-soft); line-height: 1.6;">
        Runs <strong>${d.frequency.count}× per ${d.frequency.period}</strong> · ${annualExec.toLocaleString()} executions/year ·
        Lanes: ${d.lanes.map(l => escapeHtml(l.name)).join(', ') || '—'}
      </div>

      <div class="wizard-coach">
        <div class="coach-icon">🚀</div>
        <div><strong>What happens next:</strong> the swimlane diagram gets built with steps connected sequentially in the order you listed them. You'll land in the editor where you can adjust branching (especially for any decisions you flagged), add detail to each step, and turn on Notes mode for context.</div>
      </div>
    </div>
  `;
}

// re-render just the action button visibility after typing
function renderWizardActions() {
  // Truly lightweight: only update the Next/Build button's disabled state,
  // leaving the rest of the DOM (and any focused input) intact.
  if (!wizard) return;
  const btn = document.getElementById('wizardNextBtn');
  if (!btn) return;
  const can = !!wizardCanAdvance(wizard.step);
  btn.disabled = !can;
  if (can) btn.classList.remove('btn-disabled');
  else btn.classList.add('btn-disabled');
}

function wizardFinish() {
  const d = wizard.data;
  const team = state.teams.find(t => t.id === d.teamId);
  if (!team) { alert('No team selected.'); return; }

  // Build lanes with real ids
  const laneIdMap = {};
  const newLanes = d.lanes.map(l => {
    const newId = uid('lane');
    laneIdMap[l.tempId] = newId;
    return { id: newId, name: l.name.trim(), color: l.color };
  });

  // Build steps with sequential connections.
  // Auto-classify shape: if user left shape=='step', promote first to 'start' and last to 'end'.
  // Don't override if user explicitly chose decision/subprocess/start/end.
  const stepIdMap = {};
  d.steps.forEach(s => { stepIdMap[s.tempId] = uid('s'); });
  const newSteps = d.steps.map((s, i) => {
    const next = d.steps[i + 1];
    const connections = next ? [{ toId: stepIdMap[next.tempId], label: '' }] : [];
    let shape = s.shape;
    if (shape === 'step') {
      if (i === 0) shape = 'start';
      else if (i === d.steps.length - 1 && d.steps.length > 1) shape = 'end';
    }
    return {
      id: stepIdMap[s.tempId],
      title: s.title.trim(),
      description: '',
      shape,
      type: s.type,
      laneId: laneIdMap[s.laneTid] || (newLanes[0] && newLanes[0].id) || null,
      column: i,
      system: (s.system || '').trim(),
      optimizable: !!s.optimizable,
      optimizationNote: s.optimizationNote || '',
      optimizationStatus: s.optimizable ? 'identified' : 'identified',
      currentMinutes: s.currentMinutes || 0,
      targetMinutes: s.targetMinutes || 0,
      realizedMinutes: null,
      implementedAt: null,
      linkedProcessId: null,
      notes: '',
      tasks: [],
      connections
    };
  });

  const newProcess = {
    id: uid('p'),
    name: d.name.trim(),
    description: d.description.trim(),
    owner: d.owner.trim(),
    parentProcessId: d.parentProcessId || null,
    frequency: { count: d.frequency.count, period: d.frequency.period },
    createdAt: nowISO(),
    updatedAt: nowISO(),
    lanes: newLanes,
    steps: newSteps
  };
  team.processes.push(newProcess);
  saveState();
  wizard = null;
  toast('Process created');
  navigate('process', { teamId: team.id, processId: newProcess.id });
}

   ================================================================== */

let stepDrag = { id: null, overId: null, before: false };

function renderStepList(proc) {
  // Sort by column, then by array index for stable order within column
  const indexed = proc.steps.map((s, i) => ({ s, i }));
  indexed.sort((a, b) => {
    const ca = a.s.column || 0;
    const cb = b.s.column || 0;
    if (ca !== cb) return ca - cb;
    return a.i - b.i;
  });

  const shapeIcon = (sh) => sh === 'decision' ? '◇'
                          : sh === 'subprocess' ? '⊞'
                          : sh === 'start' ? '▶'
                          : sh === 'end' ? '⊙'
                          : '●';
  const shapeName = (sh) => sh === 'decision' ? 'decision'
                          : sh === 'subprocess' ? 'sub-process'
                          : sh === 'start' ? 'start'
                          : sh === 'end' ? 'end'
                          : 'step';
  const typeLabel = (s) => s.type === 'exception' ? 'Exception' : 'Happy';

  const rowsHtml = indexed.map(({ s }, idx) => {
    const lane = proc.lanes.find(l => l.id === s.laneId);
    const laneName = lane ? lane.name : '(no lane)';
    const laneColor = lane ? lane.color : '#a89e80';
    const isSelected = editor.selectedStepId === s.id;
    const isException = s.type === 'exception';
    const isDecision = s.shape === 'decision';
    const isSubproc = s.shape === 'subprocess';
    const linkedTarget = isSubproc && s.linkedProcessId ? findProcessAnywhere(s.linkedProcessId) : null;
    const linkedLabel = linkedTarget ? ` → ${escapeHtml(linkedTarget.process.name)}` : (isSubproc ? ' → (unlinked)' : '');
    const optimizable = s.optimizable;

    return `
      <div class="step-row ${isSelected ? 'selected' : ''} ${isException ? 'exception' : ''}"
           draggable="true"
           data-step-id="${s.id}"
           ondragstart="stepDragStart(event, '${s.id}')"
           ondragover="stepDragOver(event, '${s.id}')"
           ondragleave="stepDragLeave(event)"
           ondrop="stepDragDrop(event, '${s.id}')"
           ondragend="stepDragEnd(event)"
           onclick="selectStepFromList('${s.id}')">
        <div class="step-row-handle" title="Drag to reorder">⋮⋮</div>
        <div class="step-row-num">${idx + 1}</div>
        <div class="step-row-shape" title="${typeLabel(s)} ${shapeName(s.shape)}">
          <span class="step-row-shape-icon ${isException ? 'exc' : ''} ${s.shape === 'start' ? 'start' : ''} ${s.shape === 'end' ? 'end' : ''}">${shapeIcon(s.shape)}</span>
        </div>
        <input class="step-row-title" type="text" value="${escapeHtml(s.title)}"
               placeholder="Step title…"
               oninput="updateStepFromList('${s.id}', 'title', this.value)"
               onclick="event.stopPropagation()" />
        <select class="step-row-lane" onchange="updateStepFromList('${s.id}', 'laneId', this.value)" onclick="event.stopPropagation()" style="border-left: 3px solid ${laneColor};">
          ${proc.lanes.map(l => `<option value="${l.id}" ${s.laneId === l.id ? 'selected' : ''}>${escapeHtml(l.name)}</option>`).join('')}
        </select>
        <select class="step-row-type" onchange="updateStepFromList('${s.id}', 'type', this.value)" onclick="event.stopPropagation()">
          <option value="happy" ${s.type === 'happy' ? 'selected' : ''}>Happy</option>
          <option value="exception" ${s.type === 'exception' ? 'selected' : ''}>Exception</option>
        </select>
        <div class="step-row-flags">
          ${optimizable ? '<span class="step-row-flag opt" title="Optimization opportunity">⚡</span>' : ''}
          ${linkedLabel ? `<span class="step-row-flag link" title="Sub-process link">${escapeHtml(linkedLabel)}</span>` : ''}
        </div>
        <button class="step-row-delete" onclick="event.stopPropagation(); deleteStep('${s.id}')" title="Delete step">×</button>
      </div>
    `;
  }).join('');

  return `
    <div class="step-list-shell">
      <div class="step-list-head">
        <div class="step-list-title">Steps in this process</div>
        <div class="step-list-sub">Drag rows to reorder. Click a row to select it on the canvas. Edit inline; changes save automatically.</div>
        <div style="flex: 1"></div>
        <button class="btn btn-secondary btn-sm" onclick="addStepFlow('step')">+ Step</button>
        <button class="btn btn-secondary btn-sm" onclick="addStepFlow('decision')">+ Decision</button>
        <button class="btn btn-secondary btn-sm" onclick="addStepFlow('subprocess')">+ Sub-process</button>
