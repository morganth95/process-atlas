<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Process Atlas — Sprint Forward Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ==============================================================
     PROCESS ATLAS  —  v1.0
     A single-file process mapping tool with swimlanes,
     happy/exception paths, system tags, optimization flags,
     and attached step notes.
     ============================================================== */

  :root {
    --bg: #f8f4ec;
    --bg-grain: #f4efe4;
    --surface: #ffffff;
    --surface-alt: #fbf8f1;
    --ink: #0d1b2a;
    --ink-soft: #2a3a4d;
    --muted: #6b7889;
    --muted-2: #97a2b1;
    --line: #e6dfce;
    --line-strong: #d6cdb8;

    --happy: #2d6a4f;
    --happy-soft: #e6efe9;
    --happy-tint: #f3f7f4;

    --exception: #9d2d2d;
    --exception-soft: #f3e0e0;
    --exception-tint: #faf0ef;

    --highlight: #c9961f;
    --highlight-soft: #fbf1d8;

    /* Lane palette — muted, professional */
    --lane-1: #4a5e7a;
    --lane-2: #b3543b;
    --lane-3: #5e7d57;
    --lane-4: #6b4c6e;
    --lane-5: #b58c3a;
    --lane-6: #6b7a8c;
    --lane-7: #7a4a3c;
    --lane-8: #45685e;

    --shadow-sm: 0 1px 2px rgba(13, 27, 42, 0.05), 0 0 0 1px rgba(13, 27, 42, 0.04);
    --shadow-md: 0 4px 12px rgba(13, 27, 42, 0.07), 0 0 0 1px rgba(13, 27, 42, 0.05);
    --shadow-lg: 0 12px 32px rgba(13, 27, 42, 0.10), 0 0 0 1px rgba(13, 27, 42, 0.06);

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(232, 220, 195, 0.4) 0%, transparent 60%),
      var(--bg);
  }

  h1, h2, h3, h4 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: var(--ink);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 6px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

  /* ============== TOP BAR ============== */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--ink);
    color: #f3ead7;
    border-bottom: 1px solid #1c2c40;
  }
  .topbar-inner {
    max-width: 1600px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, #c9961f 0%, #b3543b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 16px;
    color: #f8f4ec;
  }
  .brand-name {
    font-family: "Fraunces", serif;
    font-size: 18px;
    font-weight: 500;
    color: #f8f4ec;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #97a2b1;
    margin-left: 8px;
    border-left: 1px solid #2a3a4d;
    padding-left: 10px;
  }

  .crumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #97a2b1;
    margin-left: 8px;
  }
  .crumbs a {
    color: #c9d3e0;
    text-decoration: none;
    cursor: pointer;
  }
  .crumbs a:hover { color: #f8f4ec; }
  .crumbs .sep { color: #56636e; }
  .crumbs .current { color: #f8f4ec; font-weight: 500; }

  .topbar-spacer { flex: 1; }

  .topbar-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--ink);
    color: #f3ead7;
    border-color: var(--ink);
  }
  .btn-primary:hover { background: #1c2c40; }
  .btn-disabled,
  .btn-disabled:hover {
    opacity: 0.45;
    cursor: not-allowed;
    background: var(--ink);
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--line-strong);
  }
  .btn-secondary:hover { background: var(--surface-alt); border-color: var(--muted-2); }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
  }
  .btn-ghost:hover { background: rgba(13, 27, 42, 0.05); }
  .btn-topbar {
    background: transparent;
    color: #c9d3e0;
    border-color: #2a3a4d;
  }
  .btn-topbar:hover {
    background: #1c2c40;
    color: #f8f4ec;
    border-color: #3d5066;
  }
  .btn-danger {
    background: transparent;
    color: var(--exception);
    border-color: var(--exception-soft);
  }
  .btn-danger:hover { background: var(--exception-tint); }

  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 20px; font-size: 14px; }

  /* ============== MAIN LAYOUT ============== */

  .page {
    max-width: 1600px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }

  .page-narrow {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }

  .section-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 8px;
  }

  /* ============== ATLAS (TEAMS) ============== */

  .atlas-hero {
    margin-bottom: 40px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .atlas-title {
    font-family: "Fraunces", serif;
    font-size: 44px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .atlas-title em {
    font-style: italic;
    color: var(--happy);
  }
  .atlas-sub {
    color: var(--muted);
    font-size: 14px;
    margin-top: 10px;
    max-width: 540px;
  }

  .atlas-stats {
    display: flex;
    gap: 28px;
  }
  .atlas-stat {
    text-align: right;
  }
  .atlas-stat-num {
    font-family: "Fraunces", serif;
    font-size: 32px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
  }
  .atlas-stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ============== TOUR VIEW ============== */
  .tour-page { padding-bottom: 80px; }
  .tour-hero {
    padding: 30px 0 60px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 60px;
  }
  .tour-lead {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 720px;
    margin: 18px 0 36px;
  }
  .tour-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 24px;
    padding: 24px 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .tour-stat-num {
    font-family: 'Fraunces', serif;
    font-size: 38px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
  }
  .tour-stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 6px;
  }

  .tour-section { margin-bottom: 70px; }
  .tour-h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.15;
    color: var(--ink);
    margin: 6px 0 8px;
    letter-spacing: -0.005em;
  }
  .tour-section-sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
    max-width: 640px;
    line-height: 1.55;
  }

  .tour-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }
  .tour-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.15s ease;
  }
  .tour-card:hover { border-color: var(--line-soft, #d8d2bc); }
  .tour-card-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted-soft);
    letter-spacing: 0.12em;
  }
  .tour-card-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
  }
  .tour-card-body {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    flex: 1;
  }
  .tour-card-link {
    background: transparent;
    border: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--happy);
    padding: 4px 0;
    cursor: pointer;
    text-align: left;
    margin-top: 4px;
  }
  .tour-card-link:hover { text-decoration: underline; }

  .tour-steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tour-step {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .tour-step:hover {
    border-color: var(--happy);
    background: #fbfdfb;
  }
  .tour-step-num {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--happy);
    line-height: 1;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }
  .tour-step-body { flex: 1; }
  .tour-step-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .tour-step-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
  }
  .tour-step-desc em {
    font-style: italic;
    color: var(--ink-soft);
  }
  .tour-step-arrow {
    font-size: 18px;
    color: var(--muted-soft);
    flex-shrink: 0;
    align-self: center;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .tour-step:hover .tour-step-arrow {
    color: var(--happy);
    transform: translateX(4px);
  }

  .tour-bullets {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px 28px;
  }
  .tour-bullets li {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    padding-left: 22px;
    position: relative;
  }
  .tour-bullets li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--happy);
    font-weight: 600;
  }
  .tour-bullets strong {
    color: var(--ink);
    font-weight: 600;
  }

  .tour-cta {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 36px 40px;
    text-align: center;
    margin-top: 30px;
  }
  .tour-cta .tour-h2 {
    text-align: center;
    margin-bottom: 8px;
  }
  .tour-cta .tour-section-sub {
    text-align: center;
    margin: 0 auto 24px;
  }
  .tour-cta-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  /* Tour button in topbar gets a subtle highlight to draw the eye */
  .btn-tour {
    background: rgba(255, 255, 255, 0.08) !important;
    border-color: rgba(255, 255, 255, 0.25) !important;
  }
  .btn-tour:hover {
    background: rgba(255, 255, 255, 0.15) !important;
    border-color: rgba(255, 255, 255, 0.4) !important;
  }

  /* How to use button — slightly warmer than Tour */
  .btn-how-to-use {
    background: rgba(45,106,79,0.25) !important;
    border-color: rgba(45,106,79,0.5) !important;
    color: #a8d4bb !important;
  }
  .btn-how-to-use:hover {
    background: rgba(45,106,79,0.4) !important;
    border-color: rgba(45,106,79,0.7) !important;
  }

  /* ============== TUTORIAL OVERLAY ============== */
  .tut-card {
    position: fixed;
    z-index: 9995;
    width: 340px;
    background: #0d1b2a;
    color: #f8f4ec;
    border-radius: 14px;
    padding: 22px 24px 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .tut-pos-bottom-right { bottom: 28px; right: 28px; }
  .tut-pos-bottom-left  { bottom: 28px; left:  28px; }
  .tut-pos-top-right    { top: 72px;    right: 28px; }
  .tut-pos-top-left     { top: 72px;    left:  28px; }
  .tut-pos-center {
    width: 480px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .tut-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .tut-mode-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: rgba(45,106,79,0.35);
    color: #a8d4bb;
    padding: 3px 8px;
    border-radius: 10px;
  }
  .tut-x {
    background: transparent;
    border: none;
    color: rgba(248,244,236,0.4);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px;
    transition: color 0.15s;
  }
  .tut-x:hover { color: #f8f4ec; }

  .tut-bar {
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .tut-fill {
    height: 100%;
    background: #2d6a4f;
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .tut-step-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(248,244,236,0.4);
    margin-bottom: 8px;
  }
  .tut-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    color: #f8f4ec;
    margin: 0 0 10px;
    line-height: 1.25;
  }
  .tut-body {
    font-size: 13.5px;
    color: rgba(248,244,236,0.75);
    line-height: 1.6;
    margin: 0 0 16px;
  }
  .tut-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  /* Summary card */
  .tut-summary { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .tut-sq {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .tut-sq:hover { background: rgba(45,106,79,0.25); border-color: rgba(45,106,79,0.5); }
  .tut-sq-icon { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .tut-sq-q { font-weight: 600; font-size: 13px; color: #f8f4ec; margin-bottom: 2px; }
  .tut-sq-a { font-size: 11px; color: rgba(248,244,236,0.5); font-family: 'IBM Plex Mono', monospace; }

  /* Done card */
  .tut-done { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  .tut-done-item {
    font-size: 13px;
    color: rgba(248,244,236,0.8);
    padding: 6px 10px;
    background: rgba(45,106,79,0.2);
    border-radius: 6px;
    border-left: 3px solid #2d6a4f;
  }
  .tut-done-cta {
    font-size: 12px;
    color: rgba(248,244,236,0.45);
    font-style: italic;
    margin-top: 6px;
    text-align: center;
  }

  /* Mode selector cards in modal */
  .tut-mode-card {
    background: var(--bg-soft);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .tut-mode-card:hover { border-color: var(--happy); background: #ecf3ee; }
  .tut-mode-icon { font-size: 28px; margin-bottom: 10px; }
  .tut-mode-title { font-weight: 600; font-size: 15px; color: var(--ink); margin-bottom: 6px; }
  .tut-mode-sub { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .tut-mode-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted-soft);
  }

  /* Timeline comparison card in "What this changes" section */
  .tour-timeline-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 28px 32px;
    margin: 8px 0 32px;
  }

  /* Impact prose paragraphs */
  .tour-impact-prose {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px 36px;
    margin-top: 8px;
  }
  .tour-impact-prose p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
  }
  .tour-impact-prose p em {
    color: var(--ink-soft);
    font-style: italic;
  }

  /* ============== VARIANCE UI ============== */
  .variance-count-badge {
    display: inline-block;
    background: var(--exception);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    font-weight: 500;
  }
  .variance-row {
    background: #fbf6e9;
    border: 1px solid #e6dfce;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .variance-row-head {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .variance-type-select {
    border: 1px solid var(--line);
    background: white;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .variance-delta-input {
    width: 60px;
    border: 1px solid var(--line);
    background: white;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
  }
  .variance-loc-count {
    flex: 1;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .variance-loc-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    margin-bottom: 6px;
  }
  .variance-loc-chip {
    display: inline-block;
    background: #4a5e7a;
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.04em;
  }
  .variance-edit-locs {
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--happy);
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .variance-edit-locs:hover { background: var(--bg-soft); }
  .variance-desc {
    width: 100%;
    border: 1px solid var(--line);
    background: white;
    border-radius: 4px;
    padding: 6px 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    color: var(--ink);
    resize: vertical;
    min-height: 36px;
    line-height: 1.45;
  }
  .variance-delta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .variance-delta-pos { background: #faece1; color: #b3543b; }
  .variance-delta-neg { background: #e8f0e7; color: #2d6a4f; }

  .variance-loc-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
  }
  .variance-loc-checkbox:hover { background: var(--bg-soft); border-color: var(--line); }
  .variance-loc-checkbox input { margin: 0; }
  .variance-loc-checkbox-code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--bg-soft);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--ink-soft);
    min-width: 36px;
    text-align: center;
  }
  .variance-loc-checkbox-name { flex: 1; color: var(--ink); }
  .variance-loc-checkbox-meta {
    font-size: 11px;
    color: var(--muted-soft);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Locations section in Settings modal */
  .settings-locations-section { background: var(--bg-soft); padding: 18px 20px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 24px; }
  .loc-rows { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 8px; }
  .loc-row { display: flex; gap: 6px; align-items: center; }
  .loc-input { border: 1px solid var(--line); background: white; border-radius: 4px; padding: 6px 8px; font-size: 12px; font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); }
  .loc-input-code { width: 60px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; text-align: center; }
  .loc-input-name { flex: 1; min-width: 140px; }
  .loc-input-region { width: 110px; }
  .loc-input-size { width: 90px; }

  /* Variance hotspot card in Insights */
  .variance-hotspot-card { border-left: 3px solid #9d2d2d; }
  .variance-hotspot-card:hover { background: #fbf5f5; }

  /* Tour capture-step list (How a capture works section) */
  .tour-capture-steps {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 8px 0 24px;
  }
  .tour-capture-step {
    display: flex;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--happy);
    border-radius: 8px;
    padding: 18px 22px 16px;
  }
  .tour-capture-num {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    color: var(--happy);
    line-height: 1;
    flex-shrink: 0;
    width: 38px;
  }
  .tour-capture-body { flex: 1; min-width: 0; }
  .tour-capture-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .tour-capture-what,
  .tour-capture-why {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 6px;
  }
  .tour-capture-what strong,
  .tour-capture-why strong {
    color: var(--ink-soft);
    font-weight: 600;
  }
  .tour-capture-cta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  /* Multi-site tour card */
  .tour-multisite-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 32px;
    margin: 8px 0 32px;
  }
  .tour-multisite-comparison {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    align-items: stretch;
  }
  .tour-multisite-col {
    padding: 18px 20px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .tour-multisite-col-bad { background: #fbf2ef; border-color: #e8c9c0; }
  .tour-multisite-col-good { background: #ecf3ee; border-color: #b8cfbf; }
  .tour-multisite-col-head {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .tour-multisite-col-num {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    font-weight: 500;
    line-height: 1.1;
    color: var(--ink);
  }
  .tour-multisite-col-bad .tour-multisite-col-num { color: #9d2d2d; }
  .tour-multisite-col-good .tour-multisite-col-num { color: #2d6a4f; font-size: 26px; }
  .tour-multisite-col-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .tour-multisite-col-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .tour-multisite-col-list li {
    font-size: 13px;
    color: var(--ink-soft);
    padding: 4px 0 4px 16px;
    position: relative;
    line-height: 1.45;
  }
  .tour-multisite-col-bad .tour-multisite-col-list li::before {
    content: '×';
    position: absolute;
    left: 0;
    color: #9d2d2d;
    font-weight: 600;
  }
  .tour-multisite-col-good .tour-multisite-col-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: #2d6a4f;
    font-weight: 600;
  }
  .tour-multisite-divider {
    align-self: center;
    font-family: 'Fraunces', serif;
    font-size: 32px;
    color: var(--muted-soft);
  }
  @media (max-width: 720px) {
    .tour-multisite-comparison { grid-template-columns: 1fr; }
    .tour-multisite-divider { transform: rotate(90deg); }
  }

  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .team-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 22px 22px 20px;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 180px;
  }
  .team-card:hover {
    border-color: var(--ink-soft);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .team-card-stripe {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--lane-1);
  }
  .team-card-name {
    font-family: "Fraunces", serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .team-card-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    flex: 1;
  }
  .team-card-foot {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .team-card-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .add-card {
    background: transparent;
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--r-md);
    padding: 22px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 180px;
    color: var(--muted);
  }
  .add-card:hover {
    border-color: var(--ink-soft);
    color: var(--ink-soft);
    background: var(--surface-alt);
  }
  .add-card-plus {
    font-size: 24px;
    line-height: 1;
    font-family: "Fraunces", serif;
    font-weight: 300;
  }
  .add-card-label {
    font-size: 13px;
    font-weight: 500;
  }

  /* ============== TEAM DETAIL ============== */

  .team-hero {
    margin-bottom: 36px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .team-hero-stripe-wrap {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .team-hero-stripe {
    width: 6px;
    align-self: stretch;
    border-radius: 2px;
    background: var(--lane-1);
    margin-top: 6px;
  }
  .team-hero-title {
    font-family: "Fraunces", serif;
    font-size: 38px;
    line-height: 1.05;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .team-hero-sub {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
    max-width: 600px;
  }

  .processes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }

  .process-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 20px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    min-height: 160px;
  }
  .process-card:hover {
    border-color: var(--ink-soft);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .process-card-name {
    font-family: "Fraunces", serif;
    font-size: 19px;
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: -0.005em;
  }
  .process-card-desc {
    color: var(--muted);
    font-size: 13px;
    flex: 1;
    line-height: 1.45;
  }
  .process-card-meta {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    display: flex;
    gap: 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .process-card-meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .process-card-meta-num {
    color: var(--ink);
    font-weight: 500;
  }
  .process-card-meta-num.exc { color: var(--exception); }
  .process-card-meta-num.opt { color: var(--highlight); }

  .process-card-parent {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .process-card-strip {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pcs-tag {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .pcs-tag.pcs-savings {
    background: #e8f3ec;
    border-color: #bcd9c7;
    color: #2f6b48;
  }
  .pcs-tag.pcs-link {
    background: #f3f0e3;
    border-color: #d8d2bc;
    color: #6b5d3a;
  }

  /* ============== PROCESS EDITOR ============== */

  .editor-bar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 16px 20px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .editor-title-input {
    font-family: "Fraunces", serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.01em;
    border: none;
    background: transparent;
    width: 100%;
    padding: 4px 0;
    color: var(--ink);
    outline: none;
    border-bottom: 1px dashed transparent;
  }
  .editor-title-input:hover, .editor-title-input:focus {
    border-bottom-color: var(--line-strong);
  }
  .editor-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  .editor-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    align-items: start;
  }
  .editor-layout.notes-open {
    grid-template-columns: 1fr 360px;
  }
  .editor-layout.right-collapsed {
    grid-template-columns: 1fr 48px;
  }

  .canvas-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .canvas-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-alt);
    flex-wrap: wrap;
  }
  .canvas-toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .canvas-toolbar-divider {
    width: 1px;
    height: 18px;
    background: var(--line-strong);
    margin: 0 4px;
  }
  .canvas-toolbar-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 500;
    margin-right: 4px;
    pointer-events: none;
    user-select: none;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    background: var(--surface);
    color: var(--ink-soft);
    transition: all 0.12s;
  }
  .toggle:hover { border-color: var(--muted-2); }
  .toggle.active {
    background: var(--ink);
    color: #f3ead7;
    border-color: var(--ink);
  }
  .toggle-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted-2);
  }
  .toggle.active .toggle-dot { background: #f3ead7; }

  .canvas-scroll {
    overflow: auto;
    background:
      linear-gradient(var(--bg-grain) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--bg-grain) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--surface);
    min-height: 540px;
    max-height: calc(100vh - 220px);
    padding: 24px;
    position: relative;
  }
  .canvas-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 480px;
    text-align: center;
    color: var(--muted);
  }
  .canvas-empty-title {
    font-family: "Fraunces", serif;
    font-size: 22px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .canvas-empty-sub {
    font-size: 13px;
    margin-bottom: 18px;
    max-width: 360px;
  }

  /* SVG step styles via CSS (the SVG itself uses fills/strokes set inline) */
  .step-group { cursor: pointer; }
  .step-group:hover .step-shape {
    filter: drop-shadow(0 4px 10px rgba(13, 27, 42, 0.10));
  }
  .step-group.selected .step-shape {
    stroke-width: 2.25 !important;
    filter: drop-shadow(0 6px 14px rgba(13, 27, 42, 0.14));
  }
  .step-title-text {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 600;
    fill: var(--ink);
    pointer-events: none;
  }
  .step-desc-text {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11px;
    fill: var(--muted);
    pointer-events: none;
  }
  .step-system-text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    fill: var(--ink-soft);
    pointer-events: none;
    letter-spacing: 0.04em;
  }
  .lane-label-text {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12px;
    font-weight: 600;
    fill: #f8f4ec;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .conn-label-text {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 10px;
    fill: var(--ink-soft);
    pointer-events: none;
  }
  .conn-label-bg {
    fill: var(--surface);
    stroke: var(--line);
  }
  .opt-flag {
    pointer-events: none;
  }

  /* ============== RIGHT PANEL ============== */

  .right-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 80px;
    max-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .right-panel.collapsed {
    align-items: center;
  }
  .right-panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: var(--surface-alt);
  }
  .right-tab {
    flex: 1;
    padding: 12px 8px;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.12s;
  }
  .right-tab:hover { color: var(--ink-soft); }
  .right-tab.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
    background: var(--surface);
  }
  .right-panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
  }

  .panel-collapse-btn {
    width: 100%;
    padding: 10px;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .panel-collapse-btn:hover { color: var(--ink); }

  /* === Insights tab === */
  .insight-section { margin-bottom: 22px; }
  .insight-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .insight-count {
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink);
    background: var(--surface-alt);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
    font-size: 11px;
  }
  .insight-card {
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-left: 3px solid var(--highlight);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .insight-card:hover { background: var(--highlight-soft); border-color: var(--highlight); }
  .insight-card.exc { border-left-color: var(--exception); }
  .insight-card.exc:hover { background: var(--exception-tint); border-color: var(--exception); }
  .insight-card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .insight-card-meta {
    font-size: 11px;
    color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .insight-card-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    font-style: italic;
  }

  .system-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .system-chip {
    background: var(--surface-alt);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.12s;
  }
  .system-chip:hover { background: var(--ink); color: #f3ead7; border-color: var(--ink); }
  .system-chip-count {
    color: var(--muted);
    margin-left: 4px;
  }

  .insight-empty {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
  }

  /* === Step editor tab === */
  .step-form-empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 16px;
  }
  .step-form-empty-icon {
    font-family: "Fraunces", serif;
    font-size: 36px;
    color: var(--line-strong);
    margin-bottom: 8px;
    line-height: 1;
  }
  .step-form-empty-title {
    font-family: "Fraunces", serif;
    font-size: 17px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .step-form-empty-sub {
    font-size: 12px;
  }

  .form-row { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.12s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--ink-soft);
    background: var(--surface);
  }
  .form-textarea {
    min-height: 70px;
    resize: vertical;
    font-family: inherit;
  }

  .pill-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    padding: 6px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pill:hover { border-color: var(--muted-2); }
  .pill.active {
    background: var(--ink);
    color: #f3ead7;
    border-color: var(--ink);
  }
  .pill.happy.active { background: var(--happy); border-color: var(--happy); }
  .pill.exception.active { background: var(--exception); border-color: var(--exception); }
  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .lane-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink-soft);
    transition: all 0.12s;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .lane-pill:hover { border-color: var(--muted-2); }
  .lane-pill.active {
    background: var(--ink);
    color: #f3ead7;
    border-color: var(--ink);
  }
  .lane-pill-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .checkbox-row:hover { background: var(--highlight-soft); border-color: var(--highlight); }
  .checkbox-row.active { background: var(--highlight-soft); border-color: var(--highlight); }
  .checkbox-row input { margin: 0; cursor: pointer; }
  .checkbox-row label {
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    flex: 1;
  }
  .checkbox-row.active label { color: var(--ink); font-weight: 500; }

  .tasks-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
  }
  .task-item:last-child { border-bottom: none; }
  .task-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 4px 0;
    font-size: 12px;
    outline: none;
    color: var(--ink);
  }
  .task-input:focus { border-bottom: 1px solid var(--ink-soft); }
  .task-bullet {
    color: var(--muted);
    font-size: 11px;
    flex-shrink: 0;
  }
  .task-remove {
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .task-remove:hover { color: var(--exception); }

  .task-add {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    border: 1px dashed var(--line-strong);
    padding: 6px 10px;
    border-radius: 6px;
    width: 100%;
    background: transparent;
    text-align: left;
    transition: all 0.12s;
  }
  .task-add:hover {
    color: var(--ink);
    border-color: var(--muted-2);
    background: var(--surface-alt);
  }

  .form-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .form-actions-left { flex: 1; display: flex; gap: 8px; }
  .form-actions-right { display: flex; gap: 8px; }

  /* === Lanes tab === */
  .lanes-list { margin-bottom: 16px; }
  .lane-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 6px;
    background: var(--surface-alt);
  }
  .lane-row-swatch {
    width: 14px;
    height: 24px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .lane-row-input {
    flex: 1;
    background: transparent;
    border: none;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    padding: 4px 0;
    border-bottom: 1px dashed transparent;
  }
  .lane-row-input:focus { border-bottom-color: var(--line-strong); }
  .lane-row-color {
    border: none;
    width: 24px;
    height: 24px;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  .lane-row-remove {
    color: var(--muted);
    padding: 4px;
    font-size: 14px;
    line-height: 1;
  }
  .lane-row-remove:hover { color: var(--exception); }

  /* === Notes drawer === */
  .notes-callout {
    pointer-events: none;
  }

  /* ============== MODAL ============== */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 27, 42, 0.55);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal {
    background: var(--surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-head {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: "Fraunces", serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .modal-close {
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .modal-close:hover { background: var(--surface-alt); color: var(--ink); }
  .modal-body { padding: 22px 24px; }
  .modal-foot {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: var(--surface-alt);
  }

  /* Large modal variant for settings */
  .modal.modal-lg {
    max-width: 720px;
    width: 92vw;
    max-height: 86vh;
  }
  .modal.modal-lg .modal-body {
    overflow-y: auto;
    max-height: calc(86vh - 130px);
  }

  /* ============== SETTINGS MODAL ============== */
  .settings-intro {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .settings-intro code {
    background: var(--surface);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
    border: 1px solid var(--line);
  }
  .settings-section {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .settings-section-head {
    padding: 12px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
  }
  .settings-section-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }
  .settings-section-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .settings-field {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .settings-field:last-child {
    border-bottom: none;
  }
  .settings-field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .settings-field-head label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .settings-reset-link {
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .settings-reset-link:hover {
    color: var(--ink);
  }
  .settings-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--ink);
  }
  .settings-input:focus {
    outline: none;
    border-color: var(--accent-blue, #4a5e7a);
    box-shadow: 0 0 0 2px rgba(74, 94, 122, 0.15);
  }
  textarea.settings-input {
    resize: vertical;
    min-height: 60px;
    font-family: inherit;
  }
  .settings-help {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }
  .settings-default-preview {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .settings-default-preview code {
    color: var(--ink-soft);
  }
  .btn-topbar-icon {
    padding: 6px 8px !important;
    min-width: 32px;
    font-size: 16px;
  }

  .color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.selected {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink);
  }

  /* ============== EMPTY STATES ============== */
  .empty-block {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-block-icon {
    font-family: "Fraunces", serif;
    font-size: 56px;
    color: var(--line-strong);
    line-height: 1;
    margin-bottom: 16px;
  }
  .empty-block-title {
    font-family: "Fraunces", serif;
    font-size: 22px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .empty-block-sub {
    font-size: 13px;
    margin-bottom: 18px;
    max-width: 360px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ============== WIZARD ============== */
  .wizard-shell {
    max-width: 920px;
    margin: 28px auto 80px;
    padding: 0 32px;
  }
  .wizard-progress {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
  }
  .wizard-progress .pip {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  .wizard-progress .pip.done { background: #5e7d57; }
  .wizard-progress .pip.current { background: var(--accent, #b58c3a); }
  .wizard-step-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .wizard-title {
    font-family: "Fraunces", serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .wizard-lede {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 24px;
    max-width: 680px;
    line-height: 1.55;
  }
  .wizard-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 28px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }
  .wizard-coach {
    display: flex;
    gap: 12px;
    background: #fff8d8;
    border: 1px solid #d6c97c;
    border-radius: var(--r-md);
    padding: 12px 16px;
    margin: 16px 0 18px;
    font-size: 13px;
    color: #4a3f12;
    line-height: 1.5;
  }
  .wizard-coach .coach-icon {
    flex: 0 0 18px;
    font-size: 14px;
    line-height: 1.25;
  }
  .wizard-coach strong { color: #2a2308; }
  .wizard-feedback {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .wizard-feedback.good { background: #e6efe2; color: #3d5a36; }
  .wizard-feedback.warn { background: #fdf0d8; color: #8a6520; }
  .wizard-feedback.alert { background: #fbe6e0; color: #7a3023; }
  .wizard-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding: 0 4px;
  }
  .wizard-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 14px;
  }
  .wizard-row.three { grid-template-columns: 2fr 1fr 1fr; }
  .wizard-row.full { grid-template-columns: 1fr; }
  .wizard-lane-list, .wizard-step-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 14px 0;
  }
  .wizard-lane-row, .wizard-step-row {
    display: grid;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #fbf8f1;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .wizard-lane-row {
    grid-template-columns: 28px 1fr 80px 32px;
  }
  .wizard-step-row {
    grid-template-columns: 28px 1fr 130px 110px 110px 32px;
  }
  .wizard-step-row.opt {
    grid-template-columns: 1fr 130px 80px 80px 32px;
    background: #fdf6ea;
    border-color: #e0c890;
  }
  .wizard-step-row .num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .swatch-pick {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch-pick.active { border-color: var(--ink); }
  .swatch-row {
    display: flex;
    gap: 6px;
  }
  .wizard-add-btn {
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--ink-soft);
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    font-size: 13px;
    transition: all 0.15s;

  .wizard-add-btn:hover {
    border-color: var(--ink-soft);

  .wizard-tiny-x {

    height: 24px;
    border-radius: 4px;

  .wizard-review-stat .label {

    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

    font-family: "Fraunces", serif;
    font-size: 26px;
    color: var(--ink);
    line-height: 1.1;
  }
  .wizard-review-stat .value-sub {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .wizard-review-stat.savings .value { color: #3d5a36; }

  /* ============== DASHBOARD ============== */
  .dash-shell {
    max-width: 1280px;
    margin: 28px auto 80px;
    padding: 0 32px;
  }
  .dash-header {
    display: flex;
    align-items: flex-end;

    margin-bottom: 28px;
    padding-bottom: 18px;

  }

    font-size: 32px;
    line-height: 1.1;

  .dash-card h3 {

    margin: 0 0 4px;

  .dash-card .card-sub {

  .system-hot-row {

  .system-hot-row:last-child { border-bottom: none; }
  .system-hot-row .sys {

  .system-hot-row .count {

    color: var(--ink-soft);

  .system-hot-row .pain-fill {
    height: 100%;
    background: linear-gradient(90deg, #b58c3a, #9d2d2d);
  }
  .opt-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-top: 8px;
  }
  .opt-col {
    background: #fbf8f1;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    min-height: 200px;
  }
  .opt-col-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .opt-col-head .name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink);
  }
  .opt-col-head .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .opt-col.identified .opt-col-head { border-bottom-color: #b58c3a; }
  .opt-col.planned .opt-col-head { border-bottom-color: #4a5e7a; }
  .opt-col.in_progress .opt-col-head { border-bottom-color: #5e7d57; }
  .opt-col.done .opt-col-head { border-bottom-color: #2d6a4f; }
  .opt-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .opt-card:hover {
    border-color: var(--ink-soft);
    box-shadow: var(--shadow-sm);
  }
  .opt-card .step-name {
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .opt-card .proc-name {
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .opt-card .savings-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: #3d5a36;
    font-weight: 600;
  }
  .opt-card.done .savings-tag { color: #2d6a4f; }
  .opt-empty {
    color: var(--ink-soft);
    font-size: 11px;
    text-align: center;
    padding: 20px 8px;
    font-style: italic;
  }

  /* ============== SUBPROCESS / HIERARCHY ============== */
  .subproc-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: #4a5e7a;
    color: #f8f4ec;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
  }
  .parent-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .parent-link:hover { color: var(--ink); }
  .parent-link .chev { font-size: 11px; }

  .frequency-input {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .frequency-input input { flex: 1; max-width: 80px; }

  .opt-status-pill {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 6px;
  }
  .opt-status-pill.identified { background: #fdf0d8; color: #8a6520; }
  .opt-status-pill.planned { background: #e1e8ee; color: #3d4f6a; }
  .opt-status-pill.in_progress { background: #e6efe2; color: #3d5a36; }
  .opt-status-pill.done { background: #cde0c5; color: #2d6a4f; }

  .savings-callout {
    background: #e6efe2;
    border: 1px solid #5e7d57;
    border-radius: 6px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 12px;
    color: #2a3a2d;
    line-height: 1.5;
  }
  .savings-callout .big {
    font-family: "Fraunces", serif;
    font-size: 24px;
    color: #2d6a4f;
    margin-right: 6px;
  }

  /* ============== JOURNEY VIEW ============== */
  .page-wide {
    max-width: 1500px;
    margin: 0 auto;
    padding: 24px 32px 80px;
  }
  .journey-hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-end;
    justify-content: space-between;
  }
  .journey-controls {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .journey-control {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .journey-control label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
  }
  .journey-canvas-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    overflow: hidden;
  }
  .journey-canvas-scroll {
    overflow: auto;
    max-height: 70vh;
    background: linear-gradient(0deg, #f8f4ec 0%, #fcfaf3 100%);
    border-radius: 8px;
    padding: 4px;
  }
  .journey-card:hover rect:first-child {
    stroke-width: 2.5;
  }
  .journey-edge:hover path {
    stroke-width: 3;
  }
  .journey-legend {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-top: 12px;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .journey-legend-item {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .journey-legend-line {
    display: inline-block;
    width: 24px;
    height: 2px;
    background: #4a5e7a;
  }
  .journey-legend-line.dashed {
    background: repeating-linear-gradient(to right, #4a5e7a 0, #4a5e7a 4px, transparent 4px, transparent 8px);
    height: 2px;
  }
  .journey-legend-line.muted {
    background: #a89e80;
  }
  .journey-empty-banner {
    display: flex;
    gap: 18px;
    align-items: center;
    background: #fff8e6;
    border: 1px solid #e9d6a8;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .journey-empty-icon {
    font-size: 26px;
    color: #8a6a1e;
    flex-shrink: 0;
  }
  .journey-empty-title {
    font-weight: 600;
    color: #6b5d3a;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .journey-empty-sub {
    font-size: 13px;
    color: #6b5d3a;
    line-height: 1.5;
  }
  .journey-card-add:hover circle {
    fill: #4a5e7a;
    stroke: #4a5e7a;
  }
  .journey-card-add:hover text {
    fill: #fff !important;
  }

  /* ============== CANVAS FULL-SCREEN MODE ============== */
  /* When active, the page takes over the viewport: topbar/crumbs/editor-bar/right-panel/step-list hidden,
     canvas + toolbar visible, occupying full window height. */
  .canvas-fullscreen-mode {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 100;
    margin: 0;
    padding: 0;
    max-width: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-fullscreen-mode .editor-bar {
    margin: 0;
    border-radius: 0;
    border-left: none;
    border-right: none;
    border-top: none;
    flex-shrink: 0;
  }
  .canvas-fullscreen-mode .editor-layout {
    grid-template-columns: 1fr !important;
    flex: 1;
    min-height: 0;
  }
  .canvas-fullscreen-mode .canvas-shell {
    border-radius: 0;
    border-left: none;
    border-right: none;
    border-bottom: none;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .canvas-fullscreen-mode .canvas-toolbar {
    border-radius: 0;
    flex-shrink: 0;
  }
  .canvas-fullscreen-mode .canvas-scroll {
    flex: 1;
    max-height: none !important;
  }
  .canvas-fullscreen-mode .right-panel,
  .canvas-fullscreen-mode .step-list-shell {
    display: none !important;
  }
  /* Hide topbar and crumbs when in fullscreen-mode (the .page is fixed, but topbar lives outside) */
  body.fullscreen-active > .topbar { display: none; }

  /* ============== PROCESS INTEGRITY CALLOUT ============== */
  .integrity-callout {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    border: 1px solid;
  }
  .integrity-callout.integrity-ok {
    background: #eef5f0;
    border-color: #bcd9c7;
    color: #2d6a4f;
  }
  .integrity-callout.integrity-warn {
    background: #fff8e6;
    border-color: #e9d6a8;
    color: #6b5d3a;
  }
  .integrity-icon {
    font-size: 18px;
    line-height: 1.2;
    flex-shrink: 0;
  }
  .integrity-callout.integrity-ok .integrity-icon { color: #2d6a4f; }
  .integrity-callout.integrity-warn .integrity-icon { color: #c9961f; }
  .integrity-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .integrity-sub {
    font-size: 12px;
    opacity: 0.85;
  }
  .integrity-list {
    font-size: 12px;
    margin: 0;
    padding-left: 18px;
    line-height: 1.55;
  }
  .integrity-list li { margin-bottom: 3px; }

  /* ============== STEP LIST EDITOR (under canvas) ============== */
  .step-list-shell {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    margin-top: 14px;
    overflow: hidden;
  }
  .step-list-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .step-list-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }
  .step-list-sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    flex-basis: 100%;
    margin-top: -4px;
  }
  .step-list-rows {
    padding: 4px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .step-row {
    display: grid;
    grid-template-columns: 28px 32px 30px 1fr 130px 100px auto 32px;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    transition: background 0.12s, box-shadow 0.12s;
    cursor: pointer;
    border: 1px solid transparent;
    position: relative;
  }
  .step-row:hover {
    background: var(--bg-soft);
  }
  .step-row.selected {
    background: #f3f0e3;
    border-color: #d8d2bc;
  }
  .step-row.exception {
    background: linear-gradient(90deg, #fdf6f4 0%, transparent 70%);
  }
  .step-row.exception.selected {
    background: linear-gradient(90deg, #f8e6e1 0%, #f3f0e3 70%);
  }
  .step-row.dragging {
    opacity: 0.4;
  }
  .step-row.drop-before::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 8px;
    right: 8px;
    height: 2px;
    background: var(--accent-blue, #4a5e7a);
    border-radius: 2px;
  }
  .step-row.drop-after::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 8px;
    right: 8px;
    height: 2px;
    background: var(--accent-blue, #4a5e7a);
    border-radius: 2px;
  }
  .step-row-handle {
    color: var(--muted);
    cursor: grab;
    font-size: 16px;
    text-align: center;
    user-select: none;
    line-height: 1;
    letter-spacing: -2px;
  }
  .step-row-handle:active { cursor: grabbing; }
  .step-row-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .step-row-shape {
    text-align: center;
  }
  .step-row-shape-icon {
    font-size: 16px;
    color: var(--ink-soft);
  }
  .step-row-shape-icon.exc { color: var(--exception); }
  .step-row-shape-icon.start { color: #2d6a4f; font-size: 14px; }
  .step-row-shape-icon.end { color: #2d6a4f; font-size: 18px; font-weight: 700; }
  .step-row-shape-icon.end.exc { color: #9d2d2d; }
  .step-row-title {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 13px;
    color: var(--ink);
    font-family: inherit;
    font-weight: 500;
    width: 100%;
  }
  .step-row-title:hover { border-color: var(--line); background: var(--surface); }
  .step-row-title:focus {
    border-color: var(--accent-blue, #4a5e7a);
    outline: none;
    background: var(--surface);
  }
  .step-row-lane, .step-row-type {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    color: var(--ink);
    font-family: inherit;
  }
  .step-row-flags {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .step-row-flag {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-soft);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .step-row-flag.opt {
    background: #fdf6ea;
    color: #8a6a1e;
    border: 1px solid #e9d6a8;
  }
  .step-row-flag.link {
    background: #f3f0e3;
    color: #6b5d3a;
  }
  .step-row-delete {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    border-radius: 4px;
    width: 24px;
    height: 24px;
  }
  .step-row-delete:hover { color: var(--exception); background: #f8e6e1; }

  /* ============== TRIGGER EDITOR ============== */
  .trigger-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .trigger-card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .trigger-card-arrow {
    font-size: 18px;
    color: var(--accent-blue, #4a5e7a);
    font-weight: 700;
  }
  .trigger-card-target {
    font-weight: 600;
    color: var(--ink);
    font-size: 13px;
    flex: 1;
  }
  .trigger-card-remove {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 0 6px;
    line-height: 1;
  }
  .trigger-card-remove:hover { color: var(--exception); }
  .trigger-card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .trigger-pill {
    font-size: 10px;
    padding: 3px 8px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .trigger-pill-sync {
    background: #e8f3ec;
    border-color: #bcd9c7;
    color: #2f6b48;
  }
  .trigger-pill-async {
    background: #fff4e0;
    border-color: #e9d6a8;
    color: #8a6a1e;
  }
  .trigger-card-body {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .trigger-row label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .trigger-row input,
  .trigger-row textarea,
  .trigger-row select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--ink);
  }
  .trigger-row textarea {
    min-height: 50px;
    resize: vertical;
  }
  .trigger-row .pill-row {
    display: flex;
    gap: 6px;
  }
  .handoff-input {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ============== RESPONSIVE ============== */
  @media (max-width: 1100px) {
    .editor-layout { grid-template-columns: 1fr; }
    .right-panel { position: static; max-height: none; }
  }

  /* ============== MOBILE (<= 720px) ==============
     The app is desktop-first — mobile is a "good enough to read and demo" experience.
     The process editor SVG canvas remains horizontally scrollable; everything else
     stacks vertically with appropriate type sizing. */
  @media (max-width: 720px) {
    body { font-size: 14px; }

    /* Topbar wraps to two lines on phone, with smaller buttons */
    .topbar {
      padding: 10px 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .topbar-actions {
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
    }
    .btn-topbar.btn-sm {
      font-size: 11px;
      padding: 5px 8px;
    }
    .brand-name { font-size: 14px; }
    .brand-version { display: none; }
    .crumbs { font-size: 11px; padding: 8px 12px; }

    /* Page padding tightens up */
    .page, .page-narrow, .page-wide { padding: 20px 14px; }

    /* Atlas hero — stack stats below title rather than right-aligned */
    .atlas-hero { flex-direction: column; gap: 18px; align-items: flex-start; }
    .atlas-stats {
      flex-wrap: wrap;
      gap: 18px 24px;
    }
    .atlas-stat { text-align: left; }
    .atlas-title { font-size: 30px; line-height: 1.1; }
    .atlas-sub { font-size: 13px; max-width: none; }

    /* Atlas team grid: single column on mobile */
    .teams-grid { grid-template-columns: 1fr !important; }
    .team-card { min-height: auto; }

    /* Dashboard: stat cards 2-up, ROI/hotspots stack, kanban stacks */
    .dash-metrics { grid-template-columns: 1fr 1fr !important; gap: 12px; }
    .dash-grid { grid-template-columns: 1fr !important; gap: 16px; }
    .opt-board { grid-template-columns: 1fr !important; gap: 12px; }
    .dash-metric .value { font-size: 28px; }
    .dash-metric .label { font-size: 10px; }

    /* Tour view layout shrinks */
    .tour-stats { grid-template-columns: 1fr 1fr !important; gap: 16px; }
    .tour-stat-num { font-size: 28px; }
    .tour-cards-grid { grid-template-columns: 1fr !important; }
    .tour-bullets { grid-template-columns: 1fr !important; }
    .tour-impact-prose { grid-template-columns: 1fr !important; gap: 14px; }
    .tour-multisite-comparison { grid-template-columns: 1fr !important; }
    .tour-multisite-divider { transform: rotate(90deg); align-self: center; }
    .tour-h2 { font-size: 24px; }
    .tour-lead { font-size: 17px; }
    .tour-cta-buttons { flex-direction: column; }
    .tour-cta-buttons .btn { width: 100%; }

    /* Journey view canvas — let it scroll horizontally on mobile */
    .journey-canvas-shell { overflow-x: auto; }
    .journey-controls { flex-wrap: wrap; gap: 12px; }

    /* Tutorial overlay — full width minus margin, sit at bottom */
    .tut-card {
      width: calc(100vw - 24px) !important;
      max-width: 380px;
      left: 12px !important;
      right: 12px !important;
      bottom: 12px !important;
      top: auto !important;
      transform: none !important;
      padding: 18px 20px 16px;
    }
    .tut-pos-center {
      top: 50% !important;
      bottom: auto !important;
      left: 12px !important;
      transform: translateY(-50%) !important;
    }
    .tut-title { font-size: 18px; }
    .tut-body { font-size: 13px; }

    /* Mode-selector cards stack on mobile */
    .modal { width: 100%; max-width: calc(100vw - 24px); }
    .modal-body > div[style*="grid-template-columns: 1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }

    /* Process editor — acknowledge canvas needs horizontal scroll on mobile */
    .editor-bar { flex-wrap: wrap; gap: 8px; }
    .editor-actions { flex-wrap: wrap; }
    .canvas-toolbar { flex-wrap: wrap; gap: 6px; padding: 8px; }
    .canvas-toolbar-label { font-size: 9px; }
    .step-list-row { flex-wrap: wrap; }

    /* Wizard modal full-width on mobile */
    .wizard-modal { padding: 16px; }
    .wizard-card { padding: 16px; }
    .wizard-row { grid-template-columns: 1fr !important; gap: 10px; }
    .wizard-title { font-size: 22px; }
  }

  /* ============== TOAST ============== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #f3ead7;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return migrateState(parsed);
    }
  } catch (e) { console.warn('load failed', e); }
  return migrateState(seed());
}

function migrateState(s) {
  // Ensure top-level settings exist
  if (!s.settings) {
    s.settings = { laborRate: 50, currency: 'USD', forecastPeriod: 'year' };
  }
  if (typeof s.settings.laborRate !== 'number') s.settings.laborRate = 50;
  if (!s.settings.currency) s.settings.currency = 'USD';
  if (!s.settings.forecastPeriod) s.settings.forecastPeriod = 'year';

  // v4: white-label / customization labels
  if (!s.settings.labels || typeof s.settings.labels !== 'object') {
    s.settings.labels = {};
  }
  // v3.1: customizable labels
  if (!s.settings.labels || typeof s.settings.labels !== 'object') s.settings.labels = {};

  // v5: locations array — multi-site variance tracking
  if (!Array.isArray(s.locations)) s.locations = [];

  (s.teams || []).forEach(t => {
    if (t.laborRate === undefined) t.laborRate = null;
    (t.processes || []).forEach(p => {
      if (p.parentProcessId === undefined) p.parentProcessId = null;
      if (!p.frequency || typeof p.frequency.count !== 'number') {
        p.frequency = { count: 1, period: 'week' };
      }
      if (!p.frequency.period) p.frequency.period = 'week';
      // v3: process-level triggers
      if (!Array.isArray(p.triggers)) p.triggers = [];
      (p.steps || []).forEach(st => {
        if (st.shape === undefined) st.shape = 'step';
        if (st.optimizable === undefined) st.optimizable = false;
        if (st.optimizationNote === undefined) st.optimizationNote = '';
        if (st.optimizationStatus === undefined) {
          st.optimizationStatus = st.optimizable ? 'identified' : 'identified';
        }
        if (st.currentMinutes === undefined) st.currentMinutes = 0;
        if (st.targetMinutes === undefined) st.targetMinutes = 0;
        if (st.realizedMinutes === undefined) st.realizedMinutes = null;
        if (st.implementedAt === undefined) st.implementedAt = null;
        if (st.linkedProcessId === undefined) st.linkedProcessId = null;
        // v3: step-level triggers (reserved for future UI; data model is here now)
        if (!Array.isArray(st.triggers)) st.triggers = [];
        // v5: per-step variance records — multi-site deviations from the canonical
        if (!Array.isArray(st.variances)) st.variances = [];
      });
    });
  });
  s.schemaVersion = 5;
  return s;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.warn('save failed', e); }

function resetData() {

  state = seed();
  view = { name: 'atlas', teamId: null, processId: null };
  saveState(); render();

}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'process_atlas_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported JSON');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.teams) throw new Error('Invalid file');
      state = data;
      view = { name: 'atlas', teamId: null, processId: null };
      saveState(); render();
      toast('Imported ' + file.name);
    } catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  r.readAsText(file);
  e.target.value = '';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
