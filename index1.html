                <span class="variance-loc-checkbox-name">${escapeHtml(l.name)}</span>
                <span class="variance-loc-checkbox-meta">${escapeHtml(l.region || '')} · ${escapeHtml(l.size || '')}</span>
              </label>
            `).join('')}
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-secondary" onclick="closeVarianceLocsModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveVarianceLocations('${stepId}', ${vi})">Save</button>
        </div>
      </div>
    </div>
  `;
  const wrap = document.createElement('div');
  wrap.id = 'varianceLocsModal';
  wrap.innerHTML = modalHtml;
  document.body.appendChild(wrap);
}

function closeVarianceLocsModal(ev) {
  if (ev && ev.target.classList && !ev.target.classList.contains('modal-backdrop')) return;
  const m = document.getElementById('varianceLocsModal');
  if (m) m.remove();
}

function varianceLocsToggleAll(on) {
  document.querySelectorAll('#varianceLocsList input[type=checkbox]').forEach(cb => { cb.checked = on; });
}

function saveVarianceLocations(stepId, vi) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === stepId); if (!s) return;
  if (!s.variances || !s.variances[vi]) return;
  const checked = Array.from(document.querySelectorAll('#varianceLocsList input[type=checkbox]:checked')).map(cb => cb.value);
  s.variances[vi].locationIds = checked;
  saveState();
  closeVarianceLocsModal();
  render();
}

/* ==================================================================
   RIGHT PANEL — Lanes editor
   ================================================================== */

function renderLanesEditor(proc) {
  const rows = proc.lanes.map((l, i) => `
    <div class="lane-row">
      <div class="lane-row-swatch" style="background: ${l.color}"></div>
      <input class="lane-row-input" value="${escapeHtml(l.name)}" oninput="updateLane('${l.id}', 'name', this.value, true)" />
      <input class="lane-row-color" type="color" value="${l.color}" oninput="updateLane('${l.id}', 'color', this.value, true)" />
      <button class="btn btn-ghost btn-sm" onclick="moveLane('${l.id}', -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="btn btn-ghost btn-sm" onclick="moveLane('${l.id}', 1)" ${i === proc.lanes.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="lane-row-remove" onclick="removeLane('${l.id}')" title="Remove lane">×</button>
    </div>
  `).join('');

  return `
    <div class="insight-section">
      <div class="insight-section-title">
        <span>Swimlanes</span>
        <span class="insight-count">${proc.lanes.length}</span>
      </div>
      <div style="font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5;">
        Lanes are the rows of your process map. Each step lives in a lane — when a connection crosses lanes, it's drawn as a dashed handoff line.
      </div>
      <div class="lanes-list">${rows}</div>
      <button class="task-add" onclick="addLane()">+ Add lane</button>
    </div>
  `;
}

function renderTriggersEditor(proc) {
  const triggers = proc.triggers || [];

  // Build target options — exclude self
  const targetOptions = ['<option value="">— Pick a process —</option>'].concat(
    state.teams.flatMap(t => t.processes
      .filter(pp => pp.id !== proc.id)
      .map(pp => `<option value="${pp.id}">${escapeHtml(t.name)} / ${escapeHtml(pp.name)}</option>`))
  ).join('');

  // List of existing triggers
  const triggerCards = triggers.map(tg => {
    const tgt = findProcessAnywhere(tg.toProcessId);
    const tgtLabel = tgt ? `${escapeHtml(tgt.team.name)} / ${escapeHtml(tgt.process.name)}` : '<span style="color: var(--exception);">⚠ Target deleted</span>';
    const typeLabel = tg.triggerType === 'sync' ? 'Sync handoff' : 'Async fire-and-forget';
    const handoff = formatHandoff(tg.handoffTime);
    return `
      <div class="trigger-card">
        <div class="trigger-card-head">
          <div class="trigger-card-arrow">→</div>
          <div class="trigger-card-target">${tgtLabel}</div>
          <button class="trigger-card-remove" onclick="removeTrigger('${tg.id}')" title="Remove trigger">×</button>
        </div>
        <div class="trigger-card-meta">
          <span class="trigger-pill trigger-pill-${tg.triggerType}">${typeLabel}</span>
          ${handoff ? `<span class="trigger-pill">${handoff} wait</span>` : ''}
          ${tg.initiatedBy ? `<span class="trigger-pill">by ${escapeHtml(tg.initiatedBy)}</span>` : ''}
        </div>
        <div class="trigger-card-body">
          <div class="trigger-row">
            <label>Target process</label>
            <select onchange="updateTrigger('${tg.id}', 'toProcessId', this.value)">
              ${state.teams.flatMap(t => t.processes
                .filter(pp => pp.id !== proc.id)
                .map(pp => `<option value="${pp.id}" ${pp.id === tg.toProcessId ? 'selected' : ''}>${escapeHtml(t.name)} / ${escapeHtml(pp.name)}</option>`)).join('')}
            </select>
          </div>
          <div class="trigger-row">
            <label>Trigger type</label>
            <div class="pill-row">
              <button class="pill ${tg.triggerType === 'sync' ? 'active' : ''}" onclick="updateTrigger('${tg.id}', 'triggerType', 'sync')">Sync (work pauses)</button>
              <button class="pill ${tg.triggerType === 'async' ? 'active' : ''}" onclick="updateTrigger('${tg.id}', 'triggerType', 'async')">Async (fire-and-forget)</button>
            </div>
          </div>
          <div class="trigger-row">
            <label>Initiated by</label>
            <input type="text" value="${escapeHtml(tg.initiatedBy || '')}" placeholder="e.g. HR Coord, Manager" oninput="updateTrigger('${tg.id}', 'initiatedBy', this.value, true)" />
          </div>
          <div class="trigger-row">
            <label>Trigger condition</label>
            <textarea placeholder="When does this fire? e.g. 'After post-orientation step completes'" oninput="updateTrigger('${tg.id}', 'condition', this.value, true)">${escapeHtml(tg.condition || '')}</textarea>
          </div>
          <div class="trigger-row">
            <label>Average wait / handoff time</label>
            <div class="handoff-input">
              <input type="number" min="0" step="0.5" value="${tg.handoffTime ? tg.handoffTime.value : 0}" oninput="updateTriggerHandoff('${tg.id}', 'value', this.value)" style="max-width: 80px;" />
              <select onchange="updateTriggerHandoff('${tg.id}', 'unit', this.value)">
                <option value="min" ${tg.handoffTime && tg.handoffTime.unit === 'min' ? 'selected' : ''}>minutes</option>
                <option value="hour" ${tg.handoffTime && tg.handoffTime.unit === 'hour' ? 'selected' : ''}>hours</option>
                <option value="day" ${tg.handoffTime && tg.handoffTime.unit === 'day' ? 'selected' : ''}>days</option>
              </select>
            </div>
          </div>
          <div class="trigger-row">
            <label>Failure mode <span style="color: var(--muted); font-weight: 400;">(optional)</span></label>
            <textarea placeholder="What goes wrong here? e.g. 'Comp setup delayed if I-9 not resolved'" oninput="updateTrigger('${tg.id}', 'failureMode', this.value, true)">${escapeHtml(tg.failureMode || '')}</textarea>
          </div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="insight-section">
      <div class="insight-section-title">
        <span>Triggers</span>
        <span class="insight-count">${triggers.length}</span>
      </div>
      <div style="font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5;">
        What other processes does <strong>${escapeHtml(proc.name)}</strong> kick off? Use this to map handoffs across teams. These show up as arrows on the Journey view.
      </div>

      ${triggerCards || '<div class="empty-block-sub" style="padding: 16px; background: var(--bg-soft); border: 1px dashed var(--line); border-radius: 8px; text-align: center;">No triggers yet. Click below to add one.</div>'}

      <div style="margin-top: 14px; padding: 14px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px;">
        <div style="font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 8px;">Add a trigger</div>
        <select id="newTriggerTarget" class="form-select" style="width: 100%; margin-bottom: 8px;">
          ${targetOptions}
        </select>
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="addTriggerFromPicker()">+ Add trigger</button>
      </div>
    </div>
  `;
}

function addTriggerFromPicker() {
  const sel = document.getElementById('newTriggerTarget');
  if (!sel || !sel.value) { alert('Pick a target process first.'); return; }
  addTrigger(sel.value);
}

function addTrigger(toProcessId) {
  const p = getCurrentProcess(); if (!p) return;
  if (!Array.isArray(p.triggers)) p.triggers = [];
  // Avoid exact duplicate
  if (p.triggers.some(tg => tg.toProcessId === toProcessId)) {
    toast('Trigger to that process already exists');
    return;
  }
  p.triggers.push({
    id: uidTrigger(),
    toProcessId,
    triggerType: 'sync',
    initiatedBy: '',
    condition: '',
    handoffTime: { value: 0, unit: 'min' },
    failureMode: '',
    createdAt: nowISO()
  });
  p.updatedAt = nowISO();
  saveState(); render();
  toast('Trigger added');
}

function updateTrigger(triggerId, key, val, skipRender = false) {
  const p = getCurrentProcess(); if (!p) return;
  const tg = (p.triggers || []).find(x => x.id === triggerId);
  if (!tg) return;
  tg[key] = val;
  p.updatedAt = nowISO();
  saveState();
  if (!skipRender) render();
}

function updateTriggerHandoff(triggerId, key, val) {
  const p = getCurrentProcess(); if (!p) return;
  const tg = (p.triggers || []).find(x => x.id === triggerId);
  if (!tg) return;
  if (!tg.handoffTime) tg.handoffTime = { value: 0, unit: 'min' };
  if (key === 'value') tg.handoffTime.value = Math.max(0, parseFloat(val) || 0);
  else tg.handoffTime.unit = val;
  p.updatedAt = nowISO();
  saveState(); render();
}

function removeTrigger(triggerId) {
  if (!confirm('Remove this trigger?')) return;
  const p = getCurrentProcess(); if (!p) return;
  p.triggers = (p.triggers || []).filter(x => x.id !== triggerId);
  p.updatedAt = nowISO();
  saveState(); render();
  toast('Trigger removed');
}

/* ==================================================================
   STATE MUTATIONS
   ================================================================== */

function updateStep(id, key, val, skipRender = false) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === id); if (!s) return;
  s[key] = val;
  p.updatedAt = nowISO();
  saveState();
  if (!skipRender) render();
  else renderCanvasOnly();
}

function toggleOpt(id) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === id); if (!s) return;
  s.optimizable = !s.optimizable;
  if (!s.optimizable) s.optimizationNote = '';
  saveState(); render();
}

function deleteStep(id) {
  if (!confirm('Delete this step?')) return;
  const p = getCurrentProcess(); if (!p) return;
  // Remove from list
  p.steps = p.steps.filter(s => s.id !== id);
  // Remove any connections pointing to it
  p.steps.forEach(s => {
    s.connections = (s.connections || []).filter(c => c.toId !== id);
  });
  if (editor.selectedStepId === id) editor.selectedStepId = null;
  p.updatedAt = nowISO();
  saveState(); render();
  toast('Step deleted');
}

function addStepFlow(shape) {
  const p = getCurrentProcess(); if (!p) return;
  if (p.lanes.length === 0) {
    alert('Add a lane first.'); editor.rightTab = 'lanes'; render(); return;
  }
  // Auto-promote: if shape='step' and the process has no explicit Start step yet
  // AND this is the first step, classify as 'start' so users get the integrity
  // signal for free. Advanced users can change via the right-panel shape pills.
  if (shape === 'step' && p.steps.length === 0) {
    const hasStart = p.steps.some(s => s.shape === 'start');
    if (!hasStart) shape = 'start';
  }
  const last = p.steps[p.steps.length - 1];
  const lane = last ? last.laneId : p.lanes[0].id;

  // Find a free column: start at last.column+1 and walk forward until we find a
  // (column, lane) cell that's not occupied. This prevents the new step from
  // landing on top of an existing step in the same lane — a previously reported bug
  // when the renderer stacked two steps at the same coordinate.
  const occupiedInLane = new Set(p.steps.filter(s => s.laneId === lane).map(s => s.column || 0));
  let col = last ? (last.column || 0) + 1 : 0;
  while (occupiedInLane.has(col)) col += 1;
  const titleByShape = {
    step: 'New step',
    decision: 'New decision',
    subprocess: 'New sub-process',
    start: 'Start',
    end: 'End'
  };
  const newStep = {
    id: uid('s'),
    title: titleByShape[shape] || 'New step',
    description: '',
    shape, type: 'happy',
    laneId: lane, column: col,
    system: '',
    optimizable: false, optimizationNote: '',
    optimizationStatus: 'identified',
    currentMinutes: 0, targetMinutes: 0,
    realizedMinutes: null, implementedAt: null,
    linkedProcessId: null,
    notes: '',
    tasks: [],
    connections: []
  };
  p.steps.push(newStep);
  if (last && (!last.connections || last.connections.length === 0)) {
    last.connections = [{ toId: newStep.id, label: '' }];
  }
  p.updatedAt = nowISO();
  editor.selectedStepId = newStep.id;
  editor.scrollToStepId = newStep.id;
  editor.rightTab = 'step';
  saveState(); render();
}

function addTask(id) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === id); if (!s) return;
  s.tasks = s.tasks || [];
  s.tasks.push('');
  saveState(); render();
}

function updateTask(id, idx, val) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === id); if (!s) return;
  s.tasks[idx] = val;
  saveState();
}

function removeTask(id, idx) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === id); if (!s) return;
  s.tasks.splice(idx, 1);
  saveState(); render();
}

function addConn(fromId) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === fromId); if (!s) return;
  s.connections = s.connections || [];
  s.connections.push({ toId: '', label: '' });
  saveState(); render();
}

function updateConnTarget(fromId, idx, toId) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === fromId); if (!s) return;
  s.connections[idx].toId = toId;
  saveState(); render();
}

function updateConnLabel(fromId, idx, label) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === fromId); if (!s) return;
  s.connections[idx].label = label;
  saveState();
  renderCanvasOnly();
}

function removeConn(fromId, idx) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === fromId); if (!s) return;
  s.connections.splice(idx, 1);
  saveState(); render();
}

function setConnDisplay(fromId, idx, mode) {
  const p = getCurrentProcess(); if (!p) return;
  const s = p.steps.find(x => x.id === fromId); if (!s) return;
  if (!s.connections[idx]) return;
  if (mode === 'auto') {
    delete s.connections[idx].display;  // omit when 'auto' so JSON exports stay clean
  } else {
    s.connections[idx].display = mode;
  }
  saveState(); render();
}

function addLane() {
  const p = getCurrentProcess(); if (!p) return;
  const color = LANE_COLORS[p.lanes.length % LANE_COLORS.length];
  p.lanes.push({ id: uid('lane'), name: 'New lane', color });
  saveState(); render();
}

function updateLane(id, key, val, skipRender = false) {
  const p = getCurrentProcess(); if (!p) return;
  const l = p.lanes.find(x => x.id === id); if (!l) return;
  l[key] = val;
  saveState();
  if (!skipRender) render();
  else renderCanvasOnly();
}

function removeLane(id) {
  const p = getCurrentProcess(); if (!p) return;
  if (p.lanes.length === 1) { alert('At least one lane required.'); return; }
  const usedBy = p.steps.filter(s => s.laneId === id);
  if (usedBy.length) {
    if (!confirm(usedBy.length + ' step(s) are in this lane. Remove anyway? They will be reassigned to the first lane.')) return;
    const otherLane = p.lanes.find(l => l.id !== id);
    p.steps.forEach(s => { if (s.laneId === id) s.laneId = otherLane.id; });
  }
  p.lanes = p.lanes.filter(l => l.id !== id);
  saveState(); render();
}

function moveLane(id, dir) {
  const p = getCurrentProcess(); if (!p) return;
  const i = p.lanes.findIndex(l => l.id === id);
  const j = i + dir;
  if (j < 0 || j >= p.lanes.length) return;
  [p.lanes[i], p.lanes[j]] = [p.lanes[j], p.lanes[i]];
  saveState(); render();
}

/* ==================================================================
   PARTIAL RENDER — keep input focus during typing
   ================================================================== */

function renderCanvasOnly() {
  const p = getCurrentProcess();
  if (!p) return;
  const c = document.getElementById('canvasScroll');
  if (!c) return;
  c.innerHTML = renderSVG(p) || '';
}

/* ==================================================================
   DOWNLOAD SVG
   ================================================================== */

function downloadSVG() {
  const svg = document.getElementById('processSVG');
  if (!svg) { alert('No process to export.'); return; }
  const cloned = svg.cloneNode(true);

  // CRITICAL: reset the sticky lane labels group transform.
  // During normal rendering, this group is translated by scrollLeft to keep labels
  // pinned to the viewport's left edge. In an exported standalone SVG (no scroll),
  // that translation makes the labels appear in the middle of the canvas, on top of
  // steps. Reset to translate(0,0) so labels render at their native x position.
  const laneGroup = cloned.querySelector('#laneLabelsGroup');
  if (laneGroup) {
    laneGroup.setAttribute('transform', 'translate(0, 0)');
  }
  // Hide the right-edge shadow that's only meant to show during scroll
  const laneShadow = cloned.querySelector('#laneLabelShadow');
  if (laneShadow) {
    laneShadow.setAttribute('opacity', '0');
  }

  // Inline computed styles for fonts/colors that came from CSS
  cloned.querySelectorAll('text').forEach(t => {
    const cls = t.getAttribute('class') || '';
    if (cls.includes('step-title-text')) {
      t.setAttribute('font-family', 'IBM Plex Sans, sans-serif');
      t.setAttribute('font-size', '13'); t.setAttribute('font-weight', '600'); t.setAttribute('fill', '#0d1b2a');
    } else if (cls.includes('step-desc-text')) {
      t.setAttribute('font-family', 'IBM Plex Sans, sans-serif');
      t.setAttribute('font-size', '11'); t.setAttribute('fill', '#6b7889');
    } else if (cls.includes('step-system-text')) {
      t.setAttribute('font-family', 'IBM Plex Mono, monospace');
      t.setAttribute('font-size', '10'); t.setAttribute('fill', '#2a3a4d');
    } else if (cls.includes('lane-label-text')) {
      t.setAttribute('font-family', 'IBM Plex Sans, sans-serif');
      t.setAttribute('font-size', '12'); t.setAttribute('font-weight', '600'); t.setAttribute('fill', '#f8f4ec');
    } else if (cls.includes('conn-label-text')) {
      t.setAttribute('font-family', 'IBM Plex Sans, sans-serif');
      t.setAttribute('font-size', '10'); t.setAttribute('fill', '#2a3a4d');
    }
  });
  cloned.querySelectorAll('.conn-label-bg').forEach(r => {
    r.setAttribute('fill', '#fff'); r.setAttribute('stroke', '#e6dfce');
  });
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + cloned.outerHTML;
  const blob = new Blob([xml], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const p = getCurrentProcess();
  a.download = (p ? p.name.replace(/\W+/g, '_') : 'process') + '.svg';
  a.click();
  URL.revokeObjectURL(url);
  toast('SVG downloaded');
}

/* ==================================================================
   MODAL
   ================================================================== */

function showModal({ title, body, actions, size }) {
  const root = document.getElementById('modal-root');
  const actionsHtml = (actions || []).map((a, i) =>
    `<button class="btn ${a.class || 'btn-secondary'}" data-modal-action="${i}">${escapeHtml(a.label)}</button>`
  ).join('');

  const sizeClass = size === 'large' ? 'modal-lg' : '';

  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal ${sizeClass}" role="dialog">
        <div class="modal-head">
          <div class="modal-title">${escapeHtml(title)}</div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${actionsHtml}</div>
      </div>
    </div>
  `;
  root.querySelectorAll('[data-modal-action]').forEach((btn, i) => {
    btn.addEventListener('click', () => actions[parseInt(btn.dataset.modalAction)].onClick());
  });
  setTimeout(() => {
    const focusable = root.querySelector('input, textarea');
    if (focusable) focusable.focus();
  }, 50);
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

/* ==================================================================
   CRUMBS & ROOT RENDER
   ================================================================== */

function renderTopbar() {
  // Update brand area
  const brandName = document.getElementById('brandName');
  const brandSub = document.getElementById('brandSub');
  const brandMark = document.getElementById('brandMark');
  if (brandName) brandName.innerHTML = lbl('brandName');
  if (brandSub) brandSub.innerHTML = lbl('brandSub');
  // Brand mark = first letter of brand name
  if (brandMark) {
    const stripped = String(lbl('brandName')).replace(/<[^>]+>/g, '').trim();
    brandMark.textContent = (stripped[0] || 'P').toUpperCase();
  }
  // Update browser tab title
  const t = lbl('pageTitle');
  if (t && document.title !== t) {
    // Strip any HTML tags from page title since browsers won't render them
    document.title = String(t).replace(/<[^>]+>/g, '');
  }
  // Render topbar action buttons
  const actions = document.getElementById('topbarActions');
  if (actions) {
    actions.innerHTML = `
      <button class="btn btn-topbar btn-sm btn-tour" onclick="navigate('tour')" title="Demo walkthrough — built for new viewers">★ Tour</button>
      <button class="btn btn-topbar btn-sm btn-how-to-use" onclick="startTutorial()" title="Step-by-step guide for managers and process capturers">▶ How to use this</button>
      <button class="btn btn-topbar btn-sm" onclick="navigate('journey')">${escapeHtml(lbl('btnJourney'))}</button>
      <button class="btn btn-topbar btn-sm" onclick="navigate('dashboard')">${escapeHtml(lbl('btnDashboard'))}</button>
      <button class="btn btn-topbar btn-sm" id="tut-capture" onclick="startWizard()">${escapeHtml(lbl('btnCapture'))}</button>
      <button class="btn btn-topbar btn-sm" onclick="exportData()">${escapeHtml(lbl('btnExport'))}</button>
      <button class="btn btn-topbar btn-sm" onclick="document.getElementById('importInput').click()">${escapeHtml(lbl('btnImport'))}</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)" />
      <button class="btn btn-topbar btn-sm" onclick="resetData()">${escapeHtml(lbl('btnReset'))}</button>
      <button class="btn btn-topbar btn-sm btn-topbar-icon" onclick="openSettingsModal()" title="Settings — customize labels and branding">⚙</button>
    `;
  }
}

function renderCrumbs() {
  const team = getCurrentTeam();
  const proc = getCurrentProcess();
  let html = '';
  if (view.name === 'atlas') {
    html = '<span class="current">All teams</span>';
  } else if (view.name === 'dashboard') {
    html = '<a onclick="navigate(\'atlas\')">Atlas</a><span class="sep">/</span><span class="current">Dashboard</span>';
  } else if (view.name === 'journey') {
    html = '<a onclick="navigate(\'atlas\')">Atlas</a><span class="sep">/</span><span class="current">Journey</span>';
  } else if (view.name === 'wizard') {
    html = '<a onclick="navigate(\'atlas\')">Atlas</a><span class="sep">/</span><span class="current">Quick Capture</span>';
  } else if (view.name === 'team' && team) {
    html = '<a onclick="navigate(\'atlas\')">Atlas</a><span class="sep">/</span><span class="current">' + escapeHtml(team.name) + '</span>';
  } else if (view.name === 'process' && team && proc) {
    let parentCrumb = '';
    if (proc.parentProcessId) {
      const parent = findProcessAnywhere(proc.parentProcessId);
      if (parent) {
        parentCrumb = '<a onclick="navigate(\'process\', { teamId: \'' + parent.team.id + '\', processId: \'' + parent.process.id + '\' })">' + escapeHtml(parent.process.name) + '</a><span class="sep">/</span>';
      }
    }
    html =
      '<a onclick="navigate(\'atlas\')">Atlas</a>' +
      '<span class="sep">/</span>' +
      '<a onclick="navigate(\'team\', { teamId: \'' + team.id + '\' })">' + escapeHtml(team.name) + '</a>' +
      '<span class="sep">/</span>' +
      parentCrumb +
      '<span class="current">' + escapeHtml(proc.name) + '</span>';
  }
  document.getElementById('crumbs').innerHTML = html;
}

function render() {
  const root = document.getElementById('app');

  // Toggle a body class that hides the topbar in fullscreen mode
  if (document.body) {
    document.body.classList.toggle('fullscreen-active', !!editor.canvasFullscreen && view.name === 'process');
  }

  // Preserve canvas scroll across renders
  const oldCanvas = document.getElementById('canvasScroll');
  const savedScroll = oldCanvas ? { left: oldCanvas.scrollLeft, top: oldCanvas.scrollTop } : null;

  let html;
  if (view.name === 'wizard') html = renderWizard();
  else if (view.name === 'dashboard') html = renderDashboard();
  else if (view.name === 'journey') html = renderJourney();
  else if (view.name === 'tour') html = renderTour();
  else if (view.name === 'atlas') html = renderAtlas();
  else if (view.name === 'team') html = renderTeam();
  else if (view.name === 'process') html = renderProcess();
  else { view.name = 'atlas'; html = renderAtlas(); }
  root.innerHTML = html;
  renderTopbar();
  renderCrumbs();

  // Restore canvas scroll, then scroll selected/new step into view if requested
  const newCanvas = document.getElementById('canvasScroll');
  if (newCanvas) {
    if (savedScroll) {
      newCanvas.scrollLeft = savedScroll.left;
      newCanvas.scrollTop = savedScroll.top;
    }
    if (editor.scrollToStepId) {
      requestAnimationFrame(() => scrollStepIntoView(editor.scrollToStepId));
      editor.scrollToStepId = null;
    }
    // Wire up sticky lane labels — translate the lane labels group as the canvas scrolls horizontally
    setupStickyLaneLabels(newCanvas);
  }
}

function setupStickyLaneLabels(canvas) {
  const update = () => {
    const g = document.getElementById('laneLabelsGroup');
    if (!g) return;
    const sl = canvas.scrollLeft || 0;
    g.setAttribute('transform', `translate(${sl}, 0)`);
    // Show right-edge shadow only when scrolled
    const shadow = document.getElementById('laneLabelShadow');
    if (shadow) {
      const opacity = Math.min(1, sl / 30);
      shadow.setAttribute('opacity', opacity.toFixed(2));
    }
  };
  // Initial position (in case canvas was already scrolled when restored)
  update();
  // Bind scroll listener (replace any prior listener — re-binding is fine since we restore on each render)
  canvas.onscroll = update;
}

function scrollStepIntoView(stepId) {
  const canvas = document.getElementById('canvasScroll');
  if (!canvas) return;
  const proc = getCurrentProcess();
  if (!proc) return;
  const s = proc.steps.find(x => x.id === stepId);
  if (!s) return;
  const { x, y } = stepCenter(proc, s);
  const { w, h } = stepBox(s);
  // Center the step in the visible canvas area
  const targetLeft = Math.max(0, x - canvas.clientWidth / 2);
  const targetTop  = Math.max(0, y - canvas.clientHeight / 2);
  canvas.scrollTo({ left: targetLeft, top: targetTop, behavior: 'smooth' });
}

function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ==================================================================
   INIT
   ================================================================== */

document.addEventListener('keydown', (e) => {
  // Esc exits canvas fullscreen
  if (e.key === 'Escape' && editor.canvasFullscreen) {
    editor.canvasFullscreen = false;
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (err) {}
    render();
    return;
  }
  // Delete/Backspace deletes selected step on the canvas — but ONLY if
  // the user isn't typing in an input/textarea/select, and only on the process view.
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  if (view.name !== 'process') return;
  if (!editor.selectedStepId) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.target && e.target.isContentEditable) return;
  e.preventDefault();
  deleteStep(editor.selectedStepId);
});

render();

</script>
